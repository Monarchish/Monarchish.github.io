<style>
:root{

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--serif);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
::selection{background:rgba(196,168,120,.28);color:#fff}

.topbar{position:fixed;top:0;left:0;right:0;z-index:50;height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;padding:0 30px;background:rgba(11,16,27,.72);backdrop-filter:saturate(140%) blur(14px);-webkit-backdrop-filter:saturate(140%) blur(14px);border-bottom:1px solid var(--line)}
.back,.txtlink{font-family:var(--sans);font-size:13px;color:var(--ink-2);transition:color .2s}
.back:hover,.txtlink:hover{color:var(--gold)}
.back .arrow{font-size:15px;margin-right:6px;transition:transform .2s;display:inline-block}
.back:hover .arrow{transform:translateX(-3px)}
.brand{font-family:var(--serif);font-size:15px;letter-spacing:.2em;position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap}
.brand-en{font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--muted);margin-left:8px;vertical-align:2px}
.txtlink .arrow{font-size:15px;margin-left:6px;display:inline-block;transition:transform .2s}
.txtlink:hover .arrow{transform:translateX(3px)}

#stage{position:absolute;inset:var(--nav-h) 0 0 0}
canvas{display:block;width:100%;height:100%;cursor:grab}
canvas:active{cursor:grabbing}

.tip{position:fixed;z-index:40;pointer-events:none;font-family:var(--sans);font-size:12px;color:var(--ink);background:rgba(16,23,38,.95);border:1px solid var(--line);border-radius:8px;padding:9px 13px;line-height:1.7;opacity:0;transform:translate(-50%,-130%);transition:opacity .15s;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.tip.show{opacity:1}
.tip b{font-family:var(--serif);font-size:14px;font-weight:400}
.tip .meta{color:var(--muted);font-size:11px}
.tip .tag{color:var(--gold)}

.cluster-title{position:fixed;top:calc(var(--nav-h) + 30px);left:0;right:0;z-index:20;text-align:center;pointer-events:none;opacity:0;transition:opacity .5s}
.cluster-title.show{opacity:1}
.cluster-title .ct-no{font-family:var(--mono);font-size:11px;letter-spacing:.3em;color:var(--gold)}
.cluster-title .ct-name{font-family:var(--serif);font-size:clamp(28px,4vw,44px);letter-spacing:.14em;margin-top:8px;color:var(--ink)}
.cluster-title .ct-school{font-family:var(--sans);font-size:12px;letter-spacing:.12em;color:var(--muted);margin-top:8px}

.hint{position:fixed;left:0;right:0;bottom:26px;z-index:20;display:flex;gap:26px;justify-content:center;align-items:center;flex-wrap:wrap;font-family:var(--sans);font-size:11.5px;letter-spacing:.06em;color:var(--faint);pointer-events:none;padding:0 16px}
.hint span{display:inline-flex;align-items:center;gap:7px}
.hint kbd{font-family:var(--mono);font-size:10px;color:var(--gold);border:1px solid rgba(196,168,120,.35);border-radius:4px;padding:2px 7px;background:rgba(196,168,120,.05)}
.hint .sep{color:var(--line);width:1px;height:12px;background:var(--line)}

.badge{position:fixed;right:26px;bottom:24px;z-index:20;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--faint);border:1px solid var(--line);border-radius:20px;padding:6px 13px;background:rgba(11,16,27,.6)}
.badge b{color:var(--gold);font-weight:400}

.readbtn{position:fixed;left:50%;bottom:66px;transform:translateX(-50%) translateY(12px);z-index:30;font-family:var(--sans);font-size:12.5px;letter-spacing:.08em;color:var(--gold);border:1px solid rgba(196,168,120,.4);background:rgba(196,168,120,.07);border-radius:24px;padding:9px 22px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .4s,transform .4s,background .2s}
.readbtn.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.readbtn:hover{background:rgba(196,168,120,.16)}

.panel{position:fixed;top:0;right:0;bottom:0;width:min(480px,92vw);z-index:60;background:rgba(13,20,34,.97);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-left:1px solid var(--line);transform:translateX(102%);transition:transform .45s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.4)}
.panel.show{transform:translateX(0)}
.panel-head{padding:36px 32px 22px;border-bottom:1px solid var(--line);position:relative}
.panel-head .ph-kicker{font-family:var(--mono);font-size:10px;letter-spacing:.24em;color:var(--gold)}
.panel-head h2{font-family:var(--serif);font-weight:400;font-size:30px;letter-spacing:.1em;margin-top:10px}

.panel-close{position:absolute;right:26px;top:34px;font-family:var(--sans);font-size:22px;color:var(--muted);cursor:pointer;line-height:1;transition:color .2s}
.panel-close:hover{color:var(--ink)}
.panel-list{overflow-y:auto;padding:14px 22px 40px;flex:1;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.panel-list a{display:flex;align-items:baseline;gap:18px;padding:12px 12px;border-radius:7px;border-left:2px solid transparent;transition:background .2s,border-color .2s}
.panel-list a:hover{background:rgba(233,227,213,.04);border-left-color:var(--gold)}
.panel-list .pn{font-family:var(--mono);font-size:11px;color:var(--gold);flex:0 0 26px}
.panel-list .pt{font-family:var(--serif);font-size:17px;color:var(--ink-2);letter-spacing:.04em}
.panel-list a:hover .pt{color:var(--ink)}
.panel-foot{padding:16px 32px 24px;border-top:1px solid var(--line);font-family:var(--sans);font-size:11px;color:var(--faint);line-height:1.8}

.veil{position:fixed;inset:0;z-index:55;background:rgba(6,10,18,.5);opacity:0;pointer-events:none;transition:opacity .45s}
.veil.show{opacity:1;pointer-events:auto}

.help{position:fixed;left:24px;top:calc(var(--nav-h) + 22px);z-index:20;font-family:var(--sans);font-size:11px;line-height:1.9;color:var(--faint);pointer-events:none;opacity:.9}

@media(max-width:720px){
  .brand{font-size:13px}.brand-en{display:none}

  .hint{gap:12px;font-size:10px;bottom:18px}
  .hint .sep,.hint span:nth-child(3){display:none}
  .badge{bottom:58px;right:14px}
  .help{display:none}
}

<script>
(function(){
'use strict';

/* ---------- 六片星域 ---------- */
var CH = [
  {n:'幼儿园', en:'KINDERGARTEN', school:'江都区机关幼儿园', color:'#c4a878', ax:.20, ay:.24},
  {n:'小学',   en:'PRIMARY',      school:'江都区实验小学',   color:'#7fb3d5', ax:.52, ay:.16},
  {n:'初中',   en:'MIDDLE',       school:'江都区第二中学',   color:'#a898cf', ax:.50, ay:.50},
  {n:'职校',   en:'VOCATIONAL',   school:'扬州技师学院',     color:'#7fc4a8', ax:.26, ay:.80},
  {n:'工作',   en:'WORK',         school:'2019 — 至今',       color:'#d99a68', ax:.84, ay:.30},
  {n:'函授',   en:'DISTANCE',     school:'南京工程学院',       color:'#cf8fb0', ax:.80, ay:.78}
];

/* ---------- 七十篇：编号 / 标题 / 章 / 共同的人与事 ---------- */
var RAW = [
 [1,'筷子',1,'奶奶,妈妈,代伙,勺子'],
 [2,'画画',1,'妈妈,老师,绘画'],
 [3,'一瓶娃哈哈',1,'老师,妈妈,小伙伴,玻璃鼻子'],
 [4,'跳蚤市场',1,'奶奶,老师,小伙伴'],
 [5,'游泳的小猪',1,'老师,公开课'],
 [6,'奥特曼',1,'奶奶,老师,代伙'],
 [7,'第一张画',1,'老师,绘画,讲故事'],
 [8,'很长很长的故事',1,'老师,讲故事,施俊辰'],
 [9,'一个西瓜',1,'老师,讲故事'],
 [10,'第一次过马路',2,'汪叶涵,爸妈'],
 [11,'楼梯口',2,'毛老师'],
 [12,'爸爸的校友',2,'陈英老师,爸爸,数学'],
 [13,'躲不掉的口算',2,'数学,象棋'],
 [14,'好词好句',2,'毛老师'],
 [15,'赛尔号',2,'潘天,爸爸'],
 [16,'黔驴技穷',2,'潘天,夏雨轩,讲故事'],
 [17,'丢下去的沙包',2,'顾纪元'],
 [18,'保温杯',2,'郑欣凯,乔李睿,妈妈'],
 [19,'书包',2,'乔李睿,夏仙梅老师,数学,琪琪姐姐'],
 [20,'流动班长',2,'数学'],
 [21,'英语开窍',2,'英语,补习,老师,尖子班'],
 [22,'分班',3,'考试'],
 [23,'初生牛犊',3,'学姐'],
 [24,'恨铁不成钢',3,'吴君老师,数学'],
 [25,'撕开的书',3,'凡海瑞'],
 [26,'五五开',3,'老童家,拳皇'],
 [27,'毕业那天',3,'毕业'],
 [28,'还联系着的人',3,'蒋杰,张康斯诚,沈正雨'],
 [29,'日记本',3,'吴君老师,数学,日记'],
 [30,'305宿舍',4,'郭岩,陈宇,管家豪,李唐晨,潘振洋'],
 [31,'最后一站',4,'劳动委员'],
 [32,'钱包',4,'班主任'],
 [33,'喘不过气',4,'劳动委员,班主任'],
 [34,'零食',4,'潘振洋'],
 [35,'趴下之前',4,'郝静老师,数学'],
 [36,'独自美丽',4,'郝静老师,扬州职业大学'],
 [37,'如鱼得水',4,'郝静老师,红十字会,志愿者'],
 [38,'天没亮就出发',4,'马拉松,志愿者,扬州大学'],
 [39,'毕业思想',4,'数学,志愿者,实习'],
 [40,'第一份工作',5,'康师傅,技师学院'],
 [41,'入选',5,'康师傅,石思荣,祝赵猛,夏前杨,卜闻东,潘振洋,周智鹏'],
 [42,'贝壳酒店',5,'石思荣,康师傅'],
 [43,'第一天',5,'康师傅,潘总'],
 [44,'消毒门后',5,'祝赵猛,夏前杨,潘振洋,石思荣,周智鹏'],
 [45,'调配',5,'祝赵猛,夏前杨,潘振洋,孙刘洋'],
 [46,'第一个走的人',5,'卜闻东,康师傅'],
 [47,'萃取',5,'夏前杨,小东北,芒果小酪'],
 [48,'又一个走的人',5,'夏前杨,潘振洋,妈妈'],
 [49,'仓库的凉快',5,'香精,粉子'],
 [50,'那道疤',5,'祝赵猛,小东北,爸爸,医院'],
 [51,'南京',5,'爸妈,南京'],
 [52,'复工',5,'爸妈,康师傅'],
 [53,'换滤芯',5,'调配'],
 [54,'bab',5,'bab,裴宇泽'],
 [55,'bab 里的人',5,'bab,安全员,裴宇泽'],
 [56,'藏手机',5,'bab,裴宇泽,门卫姐姐,王者荣耀'],
 [57,'周志鹏那一夜',5,'周志鹏,石思荣,调配'],
 [58,'再回调配',5,'祝赵猛,裴宇泽,调配'],
 [59,'那个新人',5,'调配'],
 [60,'离职',5,'石思荣,康师傅,技师学院'],
 [61,'这张证是怎么来的',6,'爸爸,升学,函授,南京工程学院'],
 [62,'学位英语',6,'函授,学位英语,考试'],
 [63,'准考证',6,'南京,考试,泰斯特'],
 [64,'那块指示牌',6,'南京,考试,南京工程学院'],
 [65,'那张作文模板',6,'B站,英语,作文,考试'],
 [66,'歪门邪道',6,'蒋杰,B站,颉斌斌,英语'],
 [67,'63分',6,'考试,英语,分数'],
 [68,'逛南工大',6,'蒋杰,张康斯诚,徐轩,沈正雨,南京'],
 [69,'给奶奶看学位证',6,'奶奶,江都,学位证'],
 [70,'要说遗憾',6,'考研,函授,遗憾']
];

/* ---------- 建节点、边 ---------- */
var N = RAW.length;
var nodes = RAW.map(function(r,i){
  return {i:i, no:r[0], t:r[1], ch:r[2], tags:r[3].split(','), x:0,y:0,vx:0,vy:0,fx:0,fy:0,r:5,alpha:1};
});
var edges = [], seen = {}, nodesByTag = {};
RAW.forEach(function(r,i){
  r[3].split(',').forEach(function(tag){
    (nodesByTag[tag] = nodesByTag[tag] || []).push(i);
  });
});
/* 按共享标签数加权构建边 */
Object.keys(nodesByTag).forEach(function(tag){
  var arr = nodesByTag[tag];
  for(var a=0;a<arr.length;a++)for(var b=a+1;b<arr.length;b++){
    var x=Math.min(arr[a],arr[b]), y=Math.max(arr[a],arr[b]), key=x+'-'+y;
    if(!seen[key]){ seen[key]=edges.length; edges.push({a:x,b:y,w:0,tags:[]}); }
    var e = edges[seen[key]];
    e.w++; if(e.tags.indexOf(tag)<0) e.tags.push(tag);
  }
});
nodes.forEach(function(n){ n.degree = 0; });
edges.forEach(function(e){ nodes[e.a].degree++; nodes[e.b].degree++; });
nodes.forEach(function(n){ n.r = 4.2 + Math.sqrt(n.degree) * 2.7; });

/* ---------- 画布 / 相机 ---------- */
var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
var W=0,H=0,DPR=1;
function resize(){
  var st = document.getElementById('stage');
  W = st.clientWidth; H = st.clientHeight;
  DPR = Math.min(window.devicePixelRatio||1, 2);
  cv.width = W*DPR; cv.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
resize();
window.addEventListener('resize', function(){
  var oldW=W, oldH=H; resize();
  if(oldW&&oldH){
    nodes.forEach(function(n){ n.x *= W/oldW; n.y *= H/oldH; });
  }
});

/* ---------- 力导向布局：预计算到平衡 ---------- */
function anchor(ch){ return {x:CH[ch-1].ax*W, y:CH[ch-1].ay*H}; }
nodes.forEach(function(n,i){
  var a = anchor(n.ch), ang = i*2.39996;
  n.x = a.x + Math.cos(ang)*(20+i%7*6);
  n.y = a.y + Math.sin(ang)*(20+i%7*6);
});
var REP=9000, SPR=0.008, REST=42, ANC=0.055, CEN=0.0012, DAMP=0.85;
function step(){
  var i,j,n,m,dx,dy,d2,d,f;
  for(i=0;i<N;i++){ nodes[i].fx=0; nodes[i].fy=0; }
  for(i=0;i<N;i++)for(j=i+1;j<N;j++){
    n=nodes[i]; m=nodes[j];
    dx=m.x-n.x; dy=m.y-n.y; d2=dx*dx+dy*dy; if(d2<36)d2=36;
    d=Math.sqrt(d2); f=REP/d2;
    var ux=dx/d*f, uy=dy/d*f;
    n.fx-=ux; n.fy-=uy; m.fx+=ux; m.fy+=uy;
  }
  for(i=0;i<edges.length;i++){
    var e=edges[i]; n=nodes[e.a]; m=nodes[e.b];
    dx=m.x-n.x; dy=m.y-n.y; d=Math.sqrt(dx*dx+dy*dy)||1;
    f=(d-REST)*SPR*Math.min(e.w,2.2);
    var sx=dx/d*f, sy=dy/d*f;
    n.fx+=sx; n.fy+=sy; m.fx-=sx; m.fy-=sy;
  }
  for(i=0;i<N;i++){
    n=nodes[i]; var a=anchor(n.ch);
    n.fx+=(a.x-n.x)*ANC; n.fy+=(a.y-n.y)*ANC;
    n.fx+=(W/2-n.x)*CEN; n.fy+=(H/2-n.y)*CEN;
  }
  for(i=0;i<N;i++){
    n=nodes[i];
    n.vx=(n.vx+n.fx)*DAMP; n.vy=(n.vy+n.fy)*DAMP;
    n.x+=Math.max(-9,Math.min(9,n.vx)); n.y+=Math.max(-9,Math.min(9,n.vy));
    n.x=Math.max(28,Math.min(W-28,n.x)); n.y=Math.max(28,Math.min(H-28,n.y));
  }
}
/* 每章质心与范围 */
function updateCenters(){
  CH.forEach(function(c){ c.cx=0; c.cy=0; c.cnt=0; c.rad=0; });
  nodes.forEach(function(n){
    var c=CH[n.ch-1]; c.cx+=n.x; c.cy+=n.y; c.cnt++;
  });
  CH.forEach(function(c){ if(c.cnt){ c.cx/=c.cnt; c.cy/=c.cnt; } });
  nodes.forEach(function(n){
    var c=CH[n.ch-1], d=Math.hypot(n.x-c.cx,n.y-c.cy)+n.r+22;
    if(d>c.rad) c.rad=d;
  });
}
for(var s=0;s<230;s++) step();
updateCenters();

/* ---------- 相机与三层状态 ---------- */
var focus=0, focusTarget=0, locked=null, hover=null;
var cam={x:W/2,y:H/2,zoom:1};
var panelOpen=false;

function zoomOf(f){
  if(f<1) return 1 + f*0.8;
  if(f<2) return 1.8 + (f-1)*0.85;
  return 2.65 + (f-2)*0.75;
}
function nearestChapter(px,py){
  var best=-1, bd=1e9;
  for(var i=0;i<CH.length;i++){
    var c=CH[i], d=Math.hypot(px-c.cx,py-c.cy);
    if(d<bd){ bd=d; best=i+1; }
  }
  return {ch:best,dist:bd};
}
function screenToWorld(sx,sy){
  return {x:cam.x+(sx-W/2)/cam.zoom, y:cam.y+(sy-H/2)/cam.zoom};
}
function hex2rgba(hex,a){
  var h=hex.replace('#','');
  return 'rgba('+parseInt(h.substr(0,2),16)+','+parseInt(h.substr(2,2),16)+','+parseInt(h.substr(4,2),16)+','+a+')';
}

/* ---------- 渲染 ---------- */
var stars=[];
for(var i=0;i<150;i++) stars.push({x:Math.random(),y:Math.random(),r:Math.random()*.9+.2,a:Math.random()*.5+.1});
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  stars.forEach(function(st){
    ctx.fillStyle='rgba(233,227,213,'+(st.a*.5)+')';
    ctx.beginPath(); ctx.arc(st.x*W,st.y*H,st.r,0,6.283); ctx.fill();
  });
  ctx.translate(W/2, H/2);
  ctx.scale(cam.zoom,cam.zoom);
  ctx.translate(-cam.x,-cam.y);

  var fadeOther = Math.max(0, Math.min(1,(focus-0.55)/0.9));

  /* 星域光晕与名字 */
  CH.forEach(function(c,ci){
    var active = !locked || locked===ci+1;
    var ga = (focus<0.9 ? 0.5 : (active?0.36:0.06)) * (1-fadeOther*0.35);
    var grd = ctx.createRadialGradient(c.cx,c.cy,0,c.cx,c.cy,c.rad*1.35);
    grd.addColorStop(0, hex2rgba(c.color, ga*0.28));
    grd.addColorStop(0.62, hex2rgba(c.color, ga*0.08));
    grd.addColorStop(1, hex2rgba(c.color,0));
    ctx.fillStyle=grd;
    ctx.beginPath(); ctx.arc(c.cx,c.cy,c.rad*1.35,0,6.283); ctx.fill();
    if(focus<1.35){
      var la=(1-Math.max(0,(focus-0.6)/0.75))*(active?1:0.25);
      if(la>0.03){
        ctx.textAlign='center'; ctx.textBaseline='middle';
        var ly = Math.max(64/cam.zoom, c.cy-c.rad-26/cam.zoom);
        ctx.fillStyle=hex2rgba(c.color, la*0.9);
        ctx.font='300 '+Math.round(30/Math.max(1,cam.zoom*.75))+'px "Songti SC",serif';
        ctx.fillText(c.n, c.cx, ly);
        ctx.fillStyle='rgba(233,227,213,'+la*0.28+')';
        ctx.font=Math.round(10/Math.max(1,cam.zoom*.8))+'px ui-monospace,monospace';
        ctx.fillText(c.en+'  ·  '+c.cnt+' 篇', c.cx, ly+22/Math.max(1,cam.zoom*.75));
      }
    }
  });

  /* 连线 */
  ctx.lineWidth = 0.7/cam.zoom;
  edges.forEach(function(e){
    var na=nodes[e.a], nb=nodes[e.b];
    if(locked && (na.ch!==locked || nb.ch!==locked) && e.tags.length<1) return;
    var cross = CH[na.ch-1]!==CH[nb.ch-1];
    var inA = !locked || na.ch===locked, inB = !locked || nb.ch===locked;
    var a = (inA&&inB)?1:(cross?0.12:0.08);
    a *= focus>0.55?(cross?0.5:0.75):0.55;
    if(Math.min(na.alpha,nb.alpha)<0.05) return;
    ctx.strokeStyle = cross ? 'rgba(196,168,120,'+(a*0.7)+')' : 'rgba(233,227,213,'+(a*0.32)+')';
    ctx.beginPath(); ctx.moveTo(na.x,na.y); ctx.lineTo(nb.x,nb.y); ctx.stroke();
  });

  /* 节点 */
  nodes.forEach(function(n){
    var inCh = !locked || n.ch===locked;
    var target = inCh ? 1 : Math.max(0.07,1-fadeOther);
    n.alpha += (target-n.alpha)*0.12;
    if(n.alpha<0.03) return;
    var c=CH[n.ch-1], isHover = hover===n.i;
    var r=n.r*(isHover?1.28:1);
    if(isHover){
      ctx.fillStyle=hex2rgba(c.color,0.16*n.alpha);
      ctx.beginPath(); ctx.arc(n.x,n.y,r*2.3,0,6.283); ctx.fill();
    }
    ctx.fillStyle=hex2rgba(c.color, (0.78+Math.min(n.degree,8)*0.02)*n.alpha);
    ctx.beginPath(); ctx.arc(n.x,n.y,r,0,6.283); ctx.fill();
    ctx.strokeStyle=hex2rgba(c.color, 0.9*n.alpha);
    ctx.lineWidth=0.8/cam.zoom;
    ctx.stroke();
    if((focus>1.05 && inCh && cam.zoom>1.7) || isHover){
      ctx.textAlign='center'; ctx.textBaseline='top';
      ctx.fillStyle='rgba(233,227,213,'+(0.82*n.alpha)+')';
      ctx.font=Math.round(11/Math.max(1,cam.zoom*0.72))+'px "Songti SC",serif';
      ctx.fillText(n.t, n.x, n.y+r+3/cam.zoom);
    }
  });
  ctx.restore();
  requestAnimationFrame(draw);
}

/* ---------- 状态 UI ---------- */
var ct=document.getElementById('ct'), ctNo=document.getElementById('ctNo'), ctName=document.getElementById('ctName'), ctSchool=document.getElementById('ctSchool');
var badge=document.getElementById('badge'), readbtn=document.getElementById('readbtn');
function syncUI(){
  cam.x += ((locked?CH[locked-1].cx:W/2)-cam.x)*0.10;
  cam.y += ((locked?CH[locked-1].cy:H/2)-cam.y)*0.10;
  cam.zoom += (zoomOf(focus)-cam.zoom)*0.10;

  if(locked && focus>0.9){
    var c=CH[locked-1];
    ctNo.textContent = ['第一章','第二章','第三章','第四章','第五章','第六章'][locked-1]+'  ·  '+c.en;
    ctName.textContent = c.n;
    ctSchool.textContent = c.school+'  ·  '+c.cnt+' 篇';
    ct.classList.add('show');
    if(focus>1.85 && focus<2.55) readbtn.classList.add('show'); else readbtn.classList.remove('show');
    badge.innerHTML = c.n+' · <b>'+(focus>2.4?'篇目':'星域内')+'</b>';
  }else{
    ct.classList.remove('show'); readbtn.classList.remove('show');
    badge.innerHTML='全景 · <b>六片星域</b>';
  }
}
function loop(){ focus += (focusTarget-focus)*0.09; syncUI(); requestAnimationFrame(loop); }
draw(); loop();

/* ---------- 交互 ---------- */
var tip=document.getElementById('tip');
function pick(mx,my){
  var w=screenToWorld(mx,my), best=null, bd=1e9;
  nodes.forEach(function(n){
    if(locked && n.ch!==locked) return;
    var d=Math.hypot(n.x-w.x,n.y-w.y);
    if(d<n.r*1.9 && d<bd){ bd=d; best=n; }
  });
  return best;
}
cv.addEventListener('mousemove', function(e){
  var rect=cv.getBoundingClientRect(), mx=e.clientX-rect.left, my=e.clientY-rect.top;
  var n=pick(mx,my);
  if(hover!==(n?n.i:null)){ hover=n?n.i:null; cv.style.cursor=n?'pointer':'grab'; }
  if(n){
    var c=CH[n.ch-1];
    var shared=[];
    edges.forEach(function(ed){
      var other=null;
      if(ed.a===n.i)other=nodes[ed.b]; else if(ed.b===n.i)other=nodes[ed.a];
      if(other && ed.tags.length) shared=shared.concat(ed.tags);
    });
    var uniq=[]; shared.forEach(function(t){ if(uniq.indexOf(t)<0) uniq.push(t); });
    tip.innerHTML='<b>'+String(n.no).padStart(2,'0')+'　'+n.t+'</b><br><span class="meta">'+c.n+' · 与 '+n.degree+' 篇相连</span>'+(uniq.length?'<br><span class="tag">'+uniq.slice(0,4).join(' · ')+'</span>':'');
    tip.style.left=e.clientX+'px'; tip.style.top=e.clientY+'px'; tip.classList.add('show');
  } else tip.classList.remove('show');
});
cv.addEventListener('mouseleave', function(){ hover=null; tip.classList.remove('show'); });
cv.addEventListener('click', function(e){
  if(panelOpen) return;
  var rect=cv.getBoundingClientRect(), mx=e.clientX-rect.left, my=e.clientY-rect.top;
  var n=pick(mx,my);
  if(n){ location.href='index.html#s'+n.no; return; }
  if(focus<1.4){
    var w=screenToWorld(mx,my), nc=nearestChapter(w.x,w.y);
    if(nc.dist<Math.max(140,CH[nc.ch-1].rad*1.2)){
      locked=nc.ch; focusTarget=1.9;
    }
  }
});
cv.addEventListener('wheel', function(e){
  if(panelOpen) return;
  e.preventDefault();
  var rect=cv.getBoundingClientRect(), mx=e.clientX-rect.left, my=e.clientY-rect.top;
  if(e.deltaY<0){
    if(focus<0.6){
      var w=screenToWorld(mx,my), nc=nearestChapter(w.x,w.y);
      locked=nc.ch;
    }
    focusTarget=Math.min(3,focusTarget+0.55);
  }else{
    focusTarget=Math.max(0,focusTarget-0.55);
  }
}, {passive:false});

/* ---------- 篇目面板 ---------- */
var panel=document.getElementById('panel'), veil=document.getElementById('veil');
var phKicker=document.getElementById('phKicker'), phTitle=document.getElementById('phTitle'), phSub=document.getElementById('phSub'), panelList=document.getElementById('panelList');
function openPanel(){
  var list = locked? nodes.filter(function(n){return n.ch===locked;}) : nodes;
  var c = locked?CH[locked-1]:null;
  phKicker.textContent = c? c.en+' · 按时间顺序' : '全部 · 按时间顺序';
  phTitle.textContent = c? c.n : '七十篇';
  phSub.textContent = c? (c.school+' · '+list.length+' 篇') : '幼儿园 · 小学 · 初中 · 职校 · 工作 · 函授';
  panelList.innerHTML='';
  list.forEach(function(n){
    var a=document.createElement('a');
    a.href='index.html#s'+n.no;
    a.innerHTML='<span class="pn">'+String(n.no).padStart(2,'0')+'</span><span class="pt">'+n.t+'</span>';
    panelList.appendChild(a);
  });
  panel.classList.add('show'); veil.classList.add('show'); panelOpen=true;
  focusTarget=3;
}
function closePanel(){ panel.classList.remove('show'); veil.classList.remove('show'); panelOpen=false; focusTarget=Math.min(focusTarget,1.9); }
document.getElementById('readbtn').addEventListener('click', openPanel);
document.getElementById('panelClose').addEventListener('click', closePanel);
veil.addEventListener('click', closePanel);
document.addEventListener('keydown', function(e){
  if(e.key==='Escape'){ if(panelOpen) closePanel(); else { focusTarget=0; locked=null; } }
});
window.addEventListener('wheel', function(e){
  if(panelOpen && focusTarget>=2.9 && e.deltaY>0 && e.target===document.body){ /* 允许面板内滚 */ }
}, {passive:true});

/* 自动展开：滚轮推到顶时 */
var autoTimer=null;
function checkAuto(){
  if(!panelOpen && locked && focusTarget>=2.6){
    clearTimeout(autoTimer); autoTimer=setTimeout(function(){ if(!panelOpen && focusTarget>=2.6) openPanel(); }, 240);
  }
  requestAnimationFrame(checkAuto);
}
checkAuto();

})();
</script>
