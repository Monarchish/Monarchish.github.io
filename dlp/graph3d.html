<style>
:root{
  --bg:#02040b; --ink:#e9e3d5; --ink-2:#c9c3b4; --muted:#8f938f; --faint:#5c6463;
  --gold:#c4a878; --line:rgba(233,227,213,.12); --nav-h:60px;
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --mono:ui-monospace,"SFMono-Regular","JetBrains Mono","Menlo","Consolas",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--serif);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
::selection{background:rgba(196,168,120,.28);color:#fff}

.topbar{position:fixed;top:0;left:0;right:0;z-index:50;height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;padding:0 30px;background:rgba(6,10,20,.72);backdrop-filter:saturate(140%) blur(14px);-webkit-backdrop-filter:saturate(140%) blur(14px);border-bottom:1px solid var(--line)}
.back,.txtlink{font-family:var(--sans);font-size:13px;color:var(--ink-2);transition:color .2s}
.back:hover,.txtlink:hover{color:var(--gold)}
.back .arrow{font-size:15px;margin-right:6px;transition:transform .2s;display:inline-block}
.back:hover .arrow{transform:translateX(-3px)}
.brand{font-family:var(--serif);font-size:15px;letter-spacing:.2em;position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap}
.brand-en{font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--muted);margin-left:8px;vertical-align:2px}
.txtlink .arrow{font-size:15px;margin-left:6px;display:inline-block;transition:transform .2s}
.txtlink:hover .arrow{transform:translateX(3px)}
.top-links{display:flex;align-items:center;gap:22px}
.tlink{cursor:pointer;color:var(--gold);border-bottom:1px solid rgba(196,168,120,.4);padding-bottom:2px;transition:color .2s}
.tlink:hover{color:var(--ink)}
.tlink.on{color:var(--ink);border-bottom-color:var(--ink)}

#stage{position:absolute;inset:var(--nav-h) 0 0 0}
canvas{display:block;width:100%;height:100%;cursor:grab}
canvas:active{cursor:grabbing}

.loading{position:fixed;inset:var(--nav-h) 0 0 0;z-index:80;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;background:var(--bg);transition:opacity .8s}
.loading.hide{opacity:0;pointer-events:none}
.loading .l-ring{width:34px;height:34px;border:1px solid rgba(196,168,120,.18);border-top-color:var(--gold);border-radius:50%;animation:spin 1.1s linear infinite}
.loading .l-txt{font-family:var(--mono);font-size:10px;letter-spacing:.3em;color:var(--muted)}
@keyframes spin{to{transform:rotate(360deg)}}

.tip{position:fixed;z-index:40;pointer-events:none;font-family:var(--sans);font-size:12px;color:var(--ink);background:rgba(16,23,38,.95);border:1px solid var(--line);border-radius:8px;padding:9px 13px;line-height:1.7;opacity:0;transform:translate(-50%,-130%);transition:opacity .15s;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.tip.show{opacity:1}
.tip b{font-family:var(--serif);font-size:14px;font-weight:400}
.tip .meta{color:var(--muted);font-size:11px}
.tip .tag{color:var(--gold)}

/* 时间线：左侧六章图例 */
.legend{position:fixed;left:26px;top:50%;transform:translateY(-50%);z-index:20;display:flex;flex-direction:column;gap:2px}
.legend .lg-title{font-family:var(--mono);font-size:9px;letter-spacing:.22em;color:var(--faint);margin-bottom:10px;padding-left:2px}
.legend button{display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;padding:6px 8px;border-radius:6px;font-family:var(--serif);font-size:13px;letter-spacing:.06em;color:var(--muted);transition:background .2s,color .2s;text-align:left}
.legend button:hover{background:rgba(233,227,213,.05);color:var(--ink)}
.legend button.on{color:var(--ink)}
.legend .dot{width:7px;height:7px;border-radius:50%;box-shadow:0 0 10px currentColor;flex:0 0 7px}
.legend .cnt{font-family:var(--mono);font-size:9px;color:var(--faint);margin-left:auto}

.help{position:fixed;left:26px;bottom:22px;z-index:20;font-family:var(--sans);font-size:11px;line-height:1.9;color:var(--faint);pointer-events:none;opacity:.9;max-width:230px}
.help b{color:var(--muted);font-weight:400}

.hint{position:fixed;left:0;right:0;bottom:26px;z-index:20;display:flex;gap:22px;justify-content:center;align-items:center;flex-wrap:wrap;font-family:var(--sans);font-size:11px;letter-spacing:.05em;color:var(--faint);pointer-events:none;padding:0 16px}
.hint kbd{font-family:var(--mono);font-size:10px;color:var(--gold);border:1px solid rgba(196,168,120,.35);border-radius:4px;padding:2px 7px;background:rgba(196,168,120,.05)}
.hint .sep{width:1px;height:12px;background:var(--line)}

.badge{position:fixed;right:26px;bottom:24px;z-index:20;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--faint);border:1px solid var(--line);border-radius:14px;padding:9px 15px;background:rgba(6,10,20,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);text-align:right;line-height:1.9}
.badge b{color:var(--gold);font-weight:400}
.badge .wc{display:block;font-size:11px;letter-spacing:.08em;color:var(--ink)}
.badge .wc b{font-size:13px}
.badge .wsub{color:var(--faint);font-size:9px}

.veil{position:fixed;inset:0;z-index:55;background:rgba(4,7,15,.55);opacity:0;pointer-events:none;transition:opacity .45s}
.veil.show{opacity:1;pointer-events:auto}

.panel{position:fixed;top:0;right:0;bottom:0;width:min(460px,92vw);z-index:60;background:rgba(10,16,29,.97);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-left:1px solid var(--line);transform:translateX(102%);transition:transform .45s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.5)}
.panel.show{transform:translateX(0)}
.panel-head{padding:34px 30px 20px;border-bottom:1px solid var(--line);position:relative}
.panel-head .ph-kicker{font-family:var(--mono);font-size:10px;letter-spacing:.24em;color:var(--gold)}
.panel-head h2{font-family:var(--serif);font-weight:400;font-size:29px;letter-spacing:.1em;margin-top:10px;line-height:1.3}
.panel-head .ph-sub{font-family:var(--sans);font-size:12px;color:var(--muted);margin-top:9px;letter-spacing:.05em}
.panel-close{position:absolute;right:24px;top:30px;font-family:var(--sans);font-size:22px;color:var(--muted);cursor:pointer;line-height:1;transition:color .2s}
.panel-close:hover{color:var(--ink)}
.panel-body{overflow-y:auto;padding:20px 30px 40px;flex:1;scrollbar-width:thin;scrollbar-color:var(--line) transparent}

/* 篇章详情 */
.story-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.story-meta .chip{font-family:var(--sans);font-size:10.5px;letter-spacing:.05em;color:var(--ink-2);border:1px solid var(--line);border-radius:16px;padding:4px 11px}
.story-meta .chip.ch{color:#0a0d16;font-weight:500;border-color:transparent}
.story-tags{font-family:var(--sans);font-size:11.5px;line-height:2;color:var(--faint);margin:14px 0 24px}
.story-tags b{color:var(--muted);font-weight:400}
.story-tags .tg{color:var(--gold);margin-right:9px}
.goto{display:inline-flex;align-items:center;gap:10px;font-family:var(--sans);font-size:13px;letter-spacing:.08em;color:var(--gold);border:1px solid rgba(196,168,120,.45);background:rgba(196,168,120,.07);border-radius:24px;padding:10px 24px;cursor:pointer;transition:background .2s}
.goto:hover{background:rgba(196,168,120,.18)}
.goto .arrow{transition:transform .2s}
.goto:hover .arrow{transform:translateX(3px)}
.story-quote{font-family:var(--serif);font-size:14px;line-height:2;color:var(--ink-2);border-left:2px solid var(--gold);padding-left:16px;margin-top:26px;opacity:.9}

/* 目录列表 */
.list-item{display:flex;align-items:baseline;gap:16px;padding:11px 12px;border-radius:7px;border-left:2px solid transparent;cursor:pointer;transition:background .2s,border-color .2s}
.list-item:hover{background:rgba(233,227,213,.04);border-left-color:var(--gold)}
.list-item .pn{font-family:var(--mono);font-size:11px;color:var(--gold);flex:0 0 28px}
.list-item .pt{font-family:var(--serif);font-size:16px;color:var(--ink-2);letter-spacing:.04em}
.list-item:hover .pt{color:var(--ink)}
.list-item .pc{font-family:var(--sans);font-size:10px;color:var(--faint);margin-left:auto;letter-spacing:.04em}

/* 人物 chips */
.people-chips{padding:16px 24px 16px;display:flex;flex-wrap:wrap;gap:7px;border-bottom:1px solid var(--line);max-height:170px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.people-chips button{font-family:var(--sans);font-size:11.5px;letter-spacing:.03em;color:var(--ink-2);background:rgba(233,227,213,.04);border:1px solid var(--line);border-radius:18px;padding:5px 11px;cursor:pointer;transition:background .2s,border-color .2s,color .2s}
.people-chips button:hover{background:rgba(196,168,120,.12);border-color:rgba(196,168,120,.5);color:var(--ink)}
.people-chips button.on{background:rgba(196,168,120,.18);border-color:var(--gold);color:var(--ink)}
.people-chips button .cnt{font-family:var(--mono);font-size:9.5px;color:var(--gold);margin-left:5px}

.panel-foot{padding:14px 30px 22px;border-top:1px solid var(--line);font-family:var(--sans);font-size:10.5px;color:var(--faint);line-height:1.8}

@media(max-width:720px){
  .brand{font-size:12px}.brand-en{display:none}
  .back,.txtlink{font-size:11px}.topbar{padding:0 12px}.top-links{gap:12px}
  .legend{left:10px;gap:0}.legend button{font-size:11px;padding:4px 5px;gap:7px}.legend .cnt{display:none}
  .help{display:none}.hint{gap:12px;font-size:9.5px;bottom:16px}.hint .sep{display:none}
  .badge{bottom:52px;right:12px}
}
</style>

/* ============ 辉光星点贴图（canvas 预绘，带章节色 + 十字星芒） ============ */
function hex2rgb(h){ h=h.replace('#',''); return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)]; }
function mixWhite(rgb,k){ return [Math.round(rgb[0]+(255-rgb[0])*k),Math.round(rgb[1]+(255-rgb[1])*k),Math.round(rgb[2]+(255-rgb[2])*k)]; }
var spriteCache={};
function glowTexture(color, spike){
  var key=color+'|'+(spike?1:0);
  if(spriteCache[key]) return spriteCache[key];
  var S=128, cv=document.createElement('canvas'); cv.width=cv.height=S;
  var x=cv.getContext('2d'), rgb=hex2rgb(color), core=mixWhite(rgb,0.55), c=S/2;
  x.globalCompositeOperation='lighter';
  /* 外层彩色光晕 */
  var glow=x.createRadialGradient(c,c,0,c,c,S*0.5);
  glow.addColorStop(0,   'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+',0.55)');
  glow.addColorStop(0.18,'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+',0.30)');
  glow.addColorStop(0.45,'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+',0.08)');
  glow.addColorStop(1,   'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+',0)');
  x.fillStyle=glow; x.fillRect(0,0,S,S);
  /* 十字星芒 */
  if(spike){
    function beam(horizontal){
      x.save(); x.translate(c,c); if(!horizontal) x.rotate(Math.PI/2);
      var g=x.createLinearGradient(-S*0.5,0,S*0.5,0);
      g.addColorStop(0,'rgba('+core[0]+','+core[1]+','+core[2]+',0)');
      g.addColorStop(0.5,'rgba('+core[0]+','+core[1]+','+core[2]+',0.5)');
      g.addColorStop(1,'rgba('+core[0]+','+core[1]+','+core[2]+',0)');
      x.fillStyle=g; x.fillRect(-S*0.5,-0.9,S,1.8);
      x.restore();
    }
    beam(true); beam(false);
  }
  /* 偏白星核 */
  var k=x.createRadialGradient(c,c,0,c,c,S*0.11);
  k.addColorStop(0,'rgba(255,255,255,1)');
  k.addColorStop(0.35,'rgba('+core[0]+','+core[1]+','+core[2]+',0.95)');
  k.addColorStop(1,'rgba('+core[0]+','+core[1]+','+core[2]+',0)');
  x.fillStyle=k; x.beginPath(); x.arc(c,c,S*0.11,0,6.283); x.fill();
  var tex=new THREE.CanvasTexture(cv);
  spriteCache[key]=tex; return tex;
}

/* ============ 3D 场景 ============ */
var stage=document.getElementById('stage');
var Graph=ForceGraph3D()(stage)
  .backgroundColor('#02040b')
  .showNavInfo(false)
  .graphData({nodes:nodes, links:links})
  .nodeThreeObject(function(n){
    var spike = n.degree>=7;
    var mat=new THREE.SpriteMaterial({
      map:glowTexture(n.color,spike),
      transparent:true, blending:THREE.AdditiveBlending,
      depthWrite:false, opacity:1.0
    });
    var sp=new THREE.Sprite(mat);
    var size=(7.5+n.val*4.2)*(spike?1.22:1);
    sp.scale.set(size,size,1);
    return sp;
  })
  .linkColor(function(l){ return 'rgba(150,170,205,0.13)'; })
  .linkWidth(0.45)
  .linkDirectionalParticles(function(l){ return l.w>=3 ? 1 : 0; })
  .linkDirectionalParticleSpeed(0.003)
  .linkDirectionalParticleWidth(1.3)
  .linkDirectionalParticleColor(function(l){ return 'rgba(196,168,120,0.7)'; })
  .nodeLabel(function(){ return ''; })
  .onNodeHover(handleHover)
  .onNodeClick(handleClick)
  .onBackgroundClick(clearFocus)
  .cooldownTime(14000)
  .warmupTicks(30);

/* 力：六章软边界——只在飘出本星域时才轻拉回来，章内自由铺开 */
Graph.d3Force('charge').strength(-130).distanceMax(300);
Graph.d3Force('link').distance(30);
Graph.d3Force('chapter', function(){
  nodes.forEach(function(n){
    var c=CH[n.ch-1];
    var dx=n.x-c.px, dy=n.y-c.py, dz=n.z-c.pz;
    var d=Math.hypot(dx,dy,dz), soft=110;
    if(d>soft){
      var k=(d-soft)/d*0.10;
      n.vx-=dx*k; n.vy-=dy*k; n.vz-=dz*k;
    }
  });
});

/* 深空星尘：三层视差 */
(function starfield(){
  function layer(N,rMin,rMax,color,size,opacity){
    var geo=new THREE.BufferGeometry(), pos=new Float32Array(N*3);
    for(var i=0;i<N;i++){
      var r=rMin+Math.random()*(rMax-rMin), th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1);
      pos[i*3]=r*Math.sin(ph)*Math.cos(th);
      pos[i*3+1]=r*Math.sin(ph)*Math.sin(th);
      pos[i*3+2]=r*Math.cos(ph);
    }
    geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
    return new THREE.Points(geo,new THREE.PointsMaterial({color:color,size:size,sizeAttenuation:true,transparent:true,opacity:opacity,depthWrite:false,blending:THREE.AdditiveBlending}));
  }
  scene.add(layer(2600,600,1500,0xffffff,0.8,0.5));
  scene.add(layer(1000,800,1800,0xbfd4ff,1.0,0.42));
  scene.add(layer(600,500,1300,0x8f7fd8,2.4,0.09));
})();

/* 点击涟漪 */
var rings=[];
function emitRing(node){
  var geo=new THREE.RingGeometry(node.val*1.6,node.val*1.9,40);
  var mat=new THREE.MeshBasicMaterial({color:new THREE.Color(node.color),transparent:true,opacity:0.55,side:THREE.DoubleSide,depthWrite:false,blending:THREE.AdditiveBlending});
  var ring=new THREE.Mesh(geo,mat); ring.userData={t:0,life:1.6};
  ring.position.set(node.x||0,node.y||0,node.z||0); scene.add(ring); rings.push(ring);
}

/* 闲置自动旋转 */
var lastAct=Date.now(), IDLE=3200, SPIN=0.00032, camAngle=0, camR=null, camH=null;
['mousedown','mouseup','mousemove','wheel','touchstart','touchmove','keydown'].forEach(function(ev){
  window.addEventListener(ev,function(){ lastAct=Date.now(); },{passive:true});
});
function idleRotate(){
  var cp=camera.position;
  if(Date.now()-lastAct<IDLE){
    camR=Math.hypot(cp.x,cp.z); camH=cp.y; camAngle=Math.atan2(cp.x,cp.z); return;
  }
  if(camR===null){ camR=Math.hypot(cp.x,cp.z); camH=cp.y; camAngle=Math.atan2(cp.x,cp.z); }
  camAngle+=SPIN;
  Graph.cameraPosition({x:Math.sin(camAngle)*camR,y:camH,z:Math.cos(camAngle)*camR});
}

var clock=new THREE.Clock();
function animate(){
  var t=clock.getElapsedTime();
  idleRotate();
  for(var i=rings.length-1;i>=0;i--){
    var r=rings[i]; r.userData.t+=0.016;
    var k=r.userData.t/r.userData.life;
    r.scale.setScalar(1+k*4.5); r.material.opacity=0.55*(1-k); r.lookAt(camera.position);
    if(k>=1){ scene.remove(r); r.geometry.dispose(); r.material.dispose(); rings.splice(i,1); }
  }
  requestAnimationFrame(animate);
}
animate();

function focusNode(n){
  var dist=90+n.val*7;
  var ratio=1+dist/Math.hypot(n.x||0,n.y||0,n.z||1);
  Graph.cameraPosition({x:(n.x||0)*ratio,y:(n.y||0)*ratio,z:(n.z||0)*ratio},n,900);
  emitRing(n);
}

function handleClick(n){
  if(!n) return;
  focusNode(n);
  var c=CH[n.ch-1];
  document.getElementById('phKicker').textContent='NO. '+String(n.no).padStart(2,'0')+' · 一篇回忆';
  document.getElementById('phTitle').textContent=n.t;
  document.getElementById('phSub').textContent=c.en+' · '+c.school;
  var chips='<span class="chip ch" style="background:'+c.color+'">'+c.n+'</span>'+
    n.people.map(function(p){ return '<span class="chip">'+p+'</span>'; }).join('');
  var tags=n.tags.map(function(t){ return '<span class="tg">#'+t+'</span>'; }).join('');
  document.getElementById('panelBody').innerHTML=
    '<div class="story-meta">'+chips+'</div>'+
    '<div class="story-tags"><b>共同记得的人与事</b><br>'+tags+'</div>'+
    '<a class="goto" href="index.html#s'+n.no+'">进入正文 <span class="arrow">→</span></a>'+
    '<div class="story-quote">这一篇写在「'+c.n+'」这段年纪里。沿着它的连线望出去，都是那时候记得的人。</div>';
  document.getElementById('panelFoot').textContent='光点越大，和别的回忆牵连越深。这颗星连着 '+n.degree+' 颗别的星。';
  setWordCount('截至第 '+n.no+' 篇', n.no);
  openPanel();
}

var TOTAL_WORDS = WORDS.reduce(function(a,b){return a+b;},0);
function fmt(n){ return n.toLocaleString('en-US'); }
function setWordCount(label, upto){
  var el=document.getElementById('wordCount');
  if(!el) return;
  if(upto==null){
    el.innerHTML='已写下 <b>'+fmt(TOTAL_WORDS)+'</b> 字';
  }else{
    var sum=0; for(var i=0;i<upto && i<WORDS.length;i++) sum+=WORDS[i];

  }
}

  var arr=peopleIdx[name].slice().sort(function(a,b){return a-b;});

    var n=nodes[no-1], c=CH[n.ch-1];

  Array.prototype.forEach.call(document.querySelectorAll('#peopleList .list-item'),function(el){
    el.onclick=function(){
      var no=+el.getAttribute('data-no'), n=nodes[no-1];
      peoplePanel.classList.remove('show'); peopleVeil.classList.remove('show');
      focusNode(n); handleClick(n);
    };
  });
