:"emotion","tags":["球球","外公","外婆","舅舅","舅妈","表妹","大罐子","拆迁"],"related":[],"key":"中集同创浦江（上海）贸易有限公司"},{"id":"m120","title":"米米卡","html":"\u003cp>那时候特别想要摩尔庄园的米米卡。卡面上是伊优——巴鲁斯的初始形态，我最喜欢的精灵。\u003c/p>\n          \u003cp>那张卡后来在搬家还是打扫卫生的时候弄丢了。\u003c/p>","dateText":"工作以后","text":"那时候特别想要摩尔庄园的米米卡。卡面上是伊优——巴鲁斯的初始形态，我最喜欢的精灵。\n\n那张卡后来在搬家还是打扫卫生的时候弄丢了。","imp":0.5,"at":"2025-10-16T12:00:00","cat":"event","tags":["赛尔号","米米卡","伊优","游戏"],"related":[],"key":"中集同创浦江（上海）贸易有限公司"},{"id":"m121","title":"三张米米卡","html":"\u003cp>那张卡弄丢的时候没觉得怎样。那东西那时候也不值钱，丢了就丢了。\u003c/p>\n          \u003cp>2026 年 7 月 7 日，我在闲鱼上买到了三张米米卡，全新未拆封，御三家的卡面。塑封还在，一点磨损都没有。\u003c/p>\n          \u003cp>三张摊在桌上，我一张一张看过去，看了很久。\u003c/p>","dateText":"2026.7.7","text":"那张卡弄丢的时候没觉得怎样。那东西那时候也不值钱，丢了就丢了。\n\n2026 年 7 月 7 日，我在闲鱼上买到了三张米米卡，全新未拆封，御三家的卡面。塑封还在，一点磨损都没有。\n\n三张摊在桌上，我一张一张看过去，看了很久。","imp":0.58,"at":"2026-07-07T12:00:00","cat":"event","tags":["赛尔号","米米卡","闲鱼","游戏"],"related":[],"key":"中集同创浦江（上海）贸易有限公司"},{"id":"m122","title":"这张证是怎么来的","html":"\u003cp>2022年3月，我进了南京工程学院，机械设计制造及其自动化，函授。函授不用天天到学校，读的是成人那一套。到2024年7月毕业，前后两年多。\u003c/p>\n          \u003cp>走到这一步，背后是我爸。专科那两年，他给我报了两次升学考试，专转本、专升本，两条路都给我留着。他常说，多条路，多个机会。专转本是全日制的，我没考上；专升本是函授，我考上了。后来读的南京工程学院，就是这条函授的路。\u003c/p>\n          \u003cp>学校离我的生活很远，这两年多里发生的事也不多。让我记住的，是最后那一场考试。\u003c/p>","dateText":"函授时期","text":"2022年3月，我进了南京工程学院，机械设计制造及其自动化，函授。函授不用天天到学校，读的是成人那一套。到2024年7月毕业，前后两年多。\n\n走到这一步，背后是我爸。专科那两年，他给我报了两次升学考试，专转本、专升本，两条路都给我留着。他常说，多条路，多个机会。专转本是全日制的，我没考上；专升本是函授，我考上了。后来读的南京工程学院，就是这条函授的路。\n\n学校离我的生活很远，这两年多里发生的事也不多。让我记住的，是最后那一场考试。","imp":0.72,"at":"2022-03-01T12:00:00","cat":"event","tags":["函授","爸爸","升学","南京工程学院"],"related":[],"key":"南京工程学院"},{"id":"m123","title":"学位英语","html":"\u003cp>函授毕业想拿学位，得先过一门学位英语。\u003c/p>\n          \u003cp>不考听力。只考选择题、阅读理解，再加一篇作文。\u003c/p>","dateText":"函授时期","text":"函授毕业想拿学位，得先过一门学位英语。\n\n不考听力。只考选择题、阅读理解，再加一篇作文。","imp":0.47,"at":"2022-06-04T12:00:00","cat":"event","tags":["函授","学位英语","考试"],"related":[],"key":"南京工程学院"},{"id":"m124","title":"准考证","html":"\u003cp>准考证打印出来，上面写着：2024年4月21日上午十点到十一点半，考点是泰斯特无纸化测评中心，南京市江北新区浦口大道18号，红星美凯龙金街A6门，上了扶梯二楼。第9考场，2楼210-1，我的座号是36。\u003c/p>\n          \u003cp>纸上还印着我的照片，和一行考生须知。\u003c/p>\n          \u003cp>考试前一天，我提前到了南京。紧张是紧张的，可又不知道该怎么准备，索性破罐子破摔——觉得该过就过，过不了就算了。\u003c/p>\n          \u003cfigure class=\"photo\">\u003cimg src=\"assets/admit-card.jpg\" alt=\"成人学士学位英语考试准考证\">\u003cfigcaption>准考证 · 证件号已打码\u003c/figcaption>\u003c/figure>","dateText":"函授时期","text":"准考证打印出来，上面写着：2024年4月21日上午十点到十一点半，考点是泰斯特无纸化测评中心，南京市江北新区浦口大道18号，红星美凯龙金街A6门，上了扶梯二楼。第9考场，2楼210-1，我的座号是36。\n\n纸上还印着我的照片，和一行考生须知。\n\n考试前一天，我提前到了南京。紧张是紧张的，可又不知道该怎么准备，索性破罐子破摔——觉得该过就过，过不了就算了。\n准考证 · 证件号已打码","imp":0.71,"at":"2022-09-07T12:00:00","cat":"event","tags":["南京","考试","泰斯特"],"related":[],"key":"南京工程学院"},{"id":"m125","title":"那块指示牌","html":"\u003cp>考场设在商场里。扶梯上去，一块牌子立在通道中间：2024年南京工程学院成人学士学位英语考试。底下一格一格列着考场号，201到211，哪边直行、哪边左转，箭头画得清清楚楚。各考场区域都有存包柜和卫生间。\u003c/p>\n          \u003cp>我站在牌子前看了一眼，找到了210-1的方向。\u003c/p>\n          \u003cfigure class=\"photo\">\u003cimg src=\"assets/signboard.jpg\" alt=\"考场指示牌\">\u003cfigcaption>考场指示牌\u003c/figcaption>\u003c/figure>\n          \u003cfigure class=\"photo\">\u003cimg src=\"assets/venue.jpg\" alt=\"泰斯特无纸化测评中心\">\u003cfigcaption>泰斯特无纸化测评中心\u003c/figcaption>\u003c/figure>","dateText":"函授时期","text":"考场设在商场里。扶梯上去，一块牌子立在通道中间：2024年南京工程学院成人学士学位英语考试。底下一格一格列着考场号，201到211，哪边直行、哪边左转，箭头画得清清楚楚。各考场区域都有存包柜和卫生间。\n\n我站在牌子前看了一眼，找到了210-1的方向。\n考场指示牌\n泰斯特无纸化测评中心","imp":0.64,"at":"2022-12-12T12:00:00","cat":"event","tags":["南京","考试","南京工程学院"],"related":[],"key":"南京工程学院"},{"id":"m126","title":"那张作文模板","html":"\u003cp>作文只考书信。我手上有一张模板，是从B站几个UP主那里东拼西凑总结出来的，存在手机里。左边是不变的大纲，右边是七个可能考到的主题。\u003c/p>\n          \u003cp>大纲是这样：\u003c/p>\n          \u003cdiv class=\"letter-tpl\">\nDear Sir or Madam.\u003cbr>\nMy name is [sb].\u003cbr>\nI am writing this letter to [sth].\u003cbr>\nThe followings are the details.\u003cbr>\nFirst of all, [sth].\u003cbr>\nFurthermore, [sth].\u003cbr>\nLast but not least, [sth].\u003cbr>\nThank you for your time and kind consideration for this letter.\u003cbr>\nIf you have any questions, please contact me at any time.\u003cbr>\nI am looking forward to your early reply.\u003cbr>\nYours truly,\u003cbr>\n[sb]\n          \u003c/div>\n          \u003cp>\u003ccode>I am writing this letter to\u003c/code> 后面的 \u003ccode>[sth]\u003c/code>，就从右边七个里选一个：\u003c/p>\n          \u003cul class=\"topic-list\">\n            \u003cli>求职 — apply for this job\u003c/li>\n            \u003cli>投诉 — complain about some problems\u003c/li>\n            \u003cli>咨询 — inquire some information\u003c/li>\n            \u003cli>预定 — book hotel rooms\u003c/li>\n            \u003cli>祝贺 — congratulation to you\u003c/li>\n            \u003cli>邀请 — invite you to join us\u003c/li>\n            \u003cli>商务报告 — 右边空着\u003c/li>\n          \u003c/ul>\n          \u003cp>商务报告那一格，我当时就是赌它不会考。我把B站上讲学位英语的UP主翻了个遍，从没见谁说过考商务报告。\u003c/p>\n          \u003cp>选好一个，剩下的空就自己发挥。这张表我背了很久。\u003c/p>\n          \u003cfigure class=\"photo\">\u003cimg src=\"assets/template.jpg\" alt=\"英语书信作文模板\">\u003cfigcaption>那张作文模板 · 从B站几位UP主那里总结来的\u003c/figcaption>\u003c/figure>","dateText":"函授时期","text":"作文只考书信。我手上有一张模板，是从B站几个UP主那里东拼西凑总结出来的，存在手机里。左边是不变的大纲，右边是七个可能考到的主题。\n\n大纲是这样：\n\nDear Sir or Madam.\nMy name is [sb].\nI am writing this letter to [sth].\nThe followings are the details.\nFirst of all, [sth].\nFurthermore, [sth].\nLast but not least, [sth].\nThank you for your time and kind consideration for this letter.\nIf you have any questions, please contact me at any time.\nI am looking forward to your early reply.\nYours truly,\n[sb]\n\nI am writing this letter to 后面的 [sth]，就从右边七个里选一个：\n\n求职 — apply for this job\n投诉 — complain about some problems\n咨询 — inquire some information\n预定 — book hotel rooms\n祝贺 — congratulation to you\n邀请 — invite you to join us\n商务报告 — 右边空着\n\n商务报告那一格，我当时就是赌它不会考。我把B站上讲学位英语的UP主翻了个遍，从没见谁说过考商务报告。\n\n选好一个，剩下的空就自己发挥。这张表我背了很久。\n那张作文模板 · 从B站几位UP主那里总结来的","imp":0.72,"at":"2023-03-17T12:00:00","cat":"event","tags":["B站","英语","作文","考试"],"related":[],"key":"南京工程学院"},{"id":"m127","title":"歪门邪道","html":"\u003cp>我的词汇量一直不行，撑到现在，大概还是初中那点底子。\u003c/p>\n          \u003cp>蒋杰让我去看B站一个叫颉斌斌的老师，讲阅读理解怎么做——找关键词，题目出现的顺序对应文章段落的顺序，诸如此类的小技巧。我照着练了练。这算是一条歪门邪道，可那场考试里，它确实帮了我。\u003c/p>","dateText":"函授时期","text":"我的词汇量一直不行，撑到现在，大概还是初中那点底子。\n\n蒋杰让我去看B站一个叫颉斌斌的老师，讲阅读理解怎么做——找关键词，题目出现的顺序对应文章段落的顺序，诸如此类的小技巧。我照着练了练。这算是一条歪门邪道，可那场考试里，它确实帮了我。","imp":0.58,"at":"2023-06-20T12:00:00","cat":"event","tags":["蒋杰","B站","颉斌斌","英语"],"related":[],"key":"南京工程学院"},{"id":"m128","title":"63分","html":"\u003cp>走出考场那一刻，我其实挺自信的。从小到大考完试我都自信，因为卷子都填满了，写的都是我自己的理解。\u003c/p>\n          \u003cp>4月29日下午，我查了成绩。\u003c/p>\n          \u003cp>63分。60分及格。\u003c/p>\n          \u003cp>多了三分。\u003c/p>\n          \u003cfigure class=\"photo\">\u003cimg src=\"assets/score.jpg\" alt=\"学位英语成绩63分\">\u003cfigcaption>成绩查询 · 证件号已打码\u003c/figcaption>\u003c/figure>","dateText":"函授时期","text":"走出考场那一刻，我其实挺自信的。从小到大考完试我都自信，因为卷子都填满了，写的都是我自己的理解。\n\n4月29日下午，我查了成绩。\n\n63分。60分及格。\n\n多了三分。\n成绩查询 · 证件号已打码","imp":0.59,"at":"2023-09-23T12:00:00","cat":"event","tags":["考试","英语","分数"],"related":[],"key":"南京工程学院"},{"id":"m129","title":"逛南工大","html":"\u003cp>在南京那几天，蒋杰带我去看了他的学校，南京工业大学。校门口那排红字很大，隔着老远就能看见；楼上的钟楼很高，我站在底下仰着头拍了一张。\u003c/p>\n          \u003cp>我们几个是初中同学，一直没断过联系——蒋杰、张康斯诚、徐轩、沈正雨，还有我，五个人。\u003c/p>\n          \u003cp>蒋杰的故事我想留着以后单说。他老穿插在我的时间线里，还会反复出现。\u003c/p>\n          \u003cfigure class=\"photo\">\u003cimg src=\"assets/campus-gate.jpg\" alt=\"南京工业大学校门合影\">\u003cfigcaption>和蒋杰在南工大校门口\u003c/figcaption>\u003c/figure>\n          \u003cfigure class=\"photo\">\u003cimg src=\"assets/tower.jpg\" alt=\"南京工业大学钟楼\">\u003cfigcaption>南工大钟楼\u003c/figcaption>\u003c/figure>","dateText":"函授时期","text":"在南京那几天，蒋杰带我去看了他的学校，南京工业大学。校门口那排红字很大，隔着老远就能看见；楼上的钟楼很高，我站在底下仰着头拍了一张。\n\n我们几个是初中同学，一直没断过联系——蒋杰、张康斯诚、徐轩、沈正雨，还有我，五个人。\n\n蒋杰的故事我想留着以后单说。他老穿插在我的时间线里，还会反复出现。\n和蒋杰在南工大校门口\n南工大钟楼","imp":0.68,"at":"2023-12-28T12:00:00","cat":"event","tags":["蒋杰","张康斯诚","徐轩","沈正雨","南京"],"related":[],"key":"南京工程学院"},{"id":"m130","title":"给奶奶看学位证","html":"\u003cp>学位证拿到手那一周，我回了趟江都。\u003c/p>\n          \u003cp>我把它拿给奶奶看，跟她说，我现在是大学生了。又掏出手机，把毕业证和学位证并排放好，拍了下来。\u003c/p>\n          \u003cp>我是奶奶带大的，衣食住行都是她一手管的。老人家的一些想法是旧了些，可那些年她把我照顾得无微不至。总觉得书没读好，最对不起的就是家里人，尤其是她。\u003c/p>","dateText":"函授时期","text":"学位证拿到手那一周，我回了趟江都。\n\n我把它拿给奶奶看，跟她说，我现在是大学生了。又掏出手机，把毕业证和学位证并排放好，拍了下来。\n\n我是奶奶带大的，衣食住行都是她一手管的。老人家的一些想法是旧了些，可那些年她把我照顾得无微不至。总觉得书没读好，最对不起的就是家里人，尤其是她。","imp":0.62,"at":"2024-04-01T12:00:00","cat":"event","tags":["江都","奶奶","学位证"],"related":[],"key":"南京工程学院"},{"id":"m131","title":"要说遗憾","html":"\u003cp>拿到这张证，我知道我的学习生涯到此结束了。\u003c/p>\n          \u003cp>我想过考研。可我要上班，要工作，没法脱产。也设想过非全的硕士，但身边都说那是学校拿来创收的，没含金量，对将来没什么帮助。我不知道该信谁。而且我确实也没有那个脑子继续读了——太老了，学不动了。\u003c/p>\n          \u003cp>要说遗憾，大概就是没考上研究生吧。\u003c/p>\n          \u003cp>南京工程学院这件事，到这张学位证也就结束了。自始至终，我好像都没能去看看我所谓的母校，到底长什么样子。\u003c/p>","dateText":"函授时期","text":"拿到这张证，我知道我的学习生涯到此结束了。\n\n我想过考研。可我要上班，要工作，没法脱产。也设想过非全的硕士，但身边都说那是学校拿来创收的，没含金量，对将来没什么帮助。我不知道该信谁。而且我确实也没有那个脑子继续读了——太老了，学不动了。\n\n要说遗憾，大概就是没考上研究生吧。\n\n南京工程学院这件事，到这张学位证也就结束了。自始至终，我好像都没能去看看我所谓的母校，到底长什么样子。","imp":0.71,"at":"2024-07-05T12:00:00","cat":"emotion","tags":["函授","考研","遗憾"],"related":[],"key":"南京工程学院"},{"id":"m132","title":"姓名","html":"\u003cp>施俊辰。\u003c/p>","dateText":"","text":"施俊辰。","imp":1,"at":"2000-09-14T12:00:00","cat":"stable_profile","tags":["施俊辰","名字"],"related":[],"key":"关于我"},{"id":"m133","title":"小名","html":"\u003cp>辰辰。\u003c/p>\n\u003cp>家里人这么叫我。外公在的时候，也是这么叫我的。\u003c/p>","dateText":"","text":"辰辰。\n\n家里人这么叫我。外公在的时候，也是这么叫我的。","imp":0.8,"at":"2000-09-17T12:00:00","cat":"stable_profile","tags":["小名","辰辰","家人"],"related":[],"key":"关于我"},{"id":"m134","title":"生日","html":"\u003cp>2000 年 9 月 15 日。\u003c/p>","dateText":"2000.9.15","text":"2000 年 9 月 15 日。","imp":0.85,"at":"2000-09-18T12:00:00","cat":"stable_profile","tags":["九月","生日","出生","2000"],"related":[],"key":"关于我"},{"id":"m135","title":"血型","html":"\u003cp>A 型。\u003c/p>","dateText":"","text":"A 型。","imp":0.65,"at":"2000-09-19T12:00:00","cat":"stable_profile","tags":["血型"], "tags":["扬州技师学院","求学","大专","职校","2016","数控"],"related":[],"key":"扬州技师学院"},{"id":"m143","title":"施大伟","html":"","dateText":"","text":"听我妈妈说，我还没出生的时候，奶奶给我取了个名字，叫施大伟。\n\n妈妈没同意。","imp":0.8,"at":"2000-09-15T12:00:00","cat":"stable_profile","tags":["施大伟","名字","奶奶","妈妈"],"related":[],"key":"关于我"},{"id":"m144","title":"名字的含义","html":"","dateText":"","text":"俊，是希望我长得英俊。\n\n辰，是因为我属龙——辰就是龙。","imp":0.8,"at":"2000-09-16T12:00:00","cat":"stable_profile","tags":["名字","俊","辰","属相"],"related":[],"key":"关于我"},{"id":"m145","title":"待补","html":"","dateText":"2019 年下半年","text":"这一段还没有写。","imp":0.25,"at":"2019-10-01T12:00:00","cat":"stable_profile","tags":["工作","待补"],"related":[],"key":"扬州钰能精密机械科技有限公司（培明传动）"},{"id":"m146","title":"待补","html":"","dateText":"2020 年","text":"这一段还没有写。","imp":0.25,"at":"2020-03-01T12:00:00","cat":"stable_profile","tags":["工作","待补"],"related":[],"key":"扬州广菱电子有限公司"},{"id":"m147","title":"待补","html":"","dateText":"2021.2 — 2021.7","text":"这一段还没有写。","imp":0.25,"at":"2021-02-01T12:00:00","cat":"stable_profile","tags":["工作","待补"],"related":[],"key":"江苏昊冠精密加工有限公司"},{"id":"m149","title":"待补","html":"","dateText":"2022.3 — 2023.4","text":"这一段还没有写。","imp":0.25,"at":"2022-03-01T12:00:00","cat":"stable_profile","tags":["工作","待补"],"related":[],"key":"交通银行信用卡中心"},{"id":"m150","title":"第一天","html":"\u003cp>今天是来\"江苏亚威机床股份有限公司\"的第一天。\u003c/p>\n\u003cp>我怀着激动的心情来到\"精加工分厂\"，进入大门，只见两面的墙上赫然写着：愿景、公司使命，以及企业精神。\u003c/p>\n\u003cp>诚　诚实　诚信　诚信为本。\u003c/p>\n\u003cp>和　和睦　融和　和衷共济。\u003c/p>\n\u003cp>精　精湛　精锐　精益求精。\u003c/p>\n\u003cp>新　厚新　创新　求新求进。\u003c/p>\n\u003cp>虽然还不能明白\"企业精神\"的含义和它背后的故事，但我相信这都是我今后工作生涯的信条！\u003c/p>\u003cimg src=\"assets/yawei/01.jpg\" alt=\"亚威日记第1页\">","dateText":"2021.8.2","text":"今天是来\"江苏亚威机床股份有限公司\"的第一天。\n我怀着激动的心情来到\"精加工分厂\"，进入大门，只见两面的墙上赫然写着：愿景、公司使命，以及企业精神。\n诚　诚实　诚信　诚信为本。\n和　和睦　融和　和衷共济。\n精　精湛　精锐　精益求精。\n新　厚新　创新　求新求进。\n虽然还不能明白\"企业精神\"的含义和它背后的故事，但我相信这都是我今后工作生涯的信条！","imp":0.75,"at":"2021-08-02T12:00:00","cat":"event","tags":["工作","亚威日记"],"related":[],"key":"江苏亚威机床股份有限公司"},{"id":"m151","title":"第二天","html":"\u003cp>今天是我来\"江苏亚威机床股份有限公司\"的第二天。\u003c/p>\n\u003cp>我根据分配被分到精密大件车间龙门一班，跟随徐涛师傅一起，学习多轴龙门机床（M45-17）的操作与维护保养。\u003c/p>\n\u003cp>认识许多新人：办公室里的王勤发王部长，负责考勤及后勤等的张子艳、张会计，车间主任周飞周主任，精密大件车间龙门一班的组长刘文齐（刘组长）。我的师傅徐涛、徐师傅。对面机床的大哥哥景传鑫、景师傅。隔壁开着两台机床的大哥哥孙子扬、孙师傅等。\u003c/p>\n\u003cp>还有很多很多在机床打磨的\"龙门一班的老师傅们\"，等今后，我一定会和他们一样站在工作的岗位上，共同努力！\u003c/p>\n\u003cp>我如同龙门一班的口号那样：\"团结协作，精益求精！\"\u003c/p>\u003cimg src=\"assets/yawei/02.jpg\" alt=\"亚威日记第2页\">","dateText":"2021.8.3","text":"今天是我来\"江苏亚威机床股份有限公司\"的第二天。\n我根据分配被分到精密大件车间龙门一班，跟随徐涛师傅一起，学习多轴龙门机床（M45-17）的操作与维护保养。\n认识许多新人：办公室里的王勤发王部长，负责考勤及后勤等的张子艳、张会计，车间主任周飞周主任，精密大件车间龙门一班的组长刘文齐（刘组长）。我的师傅徐涛、徐师傅。对面机床的大哥哥景传鑫、景师傅。隔壁开着两台机床的大哥哥孙子扬、孙师傅等。\n还有很多很多在机床打磨的\"龙门一班的老师傅们\"，等今后，我一定会和他们一样站在工作的岗位上，共同努力！\n我如同龙门一班的口号那样：\"团结协作，精益求精！\"","imp":0.75,"at":"2021-08-03T12:00:00","cat":"event","tags":["工作","徐涛","景传鑫","孙子扬","刘文齐","王部长","亚威日记"],"related":[],"key":"江苏亚威机床股份有限公司"},{"id":"m152","title":"第三天","html":"\u003cp>今天是我来\"江苏亚威机床股份有限公司\"的第三天。\u003c/p>\n\u003cp>\"学无止境！\"\u003c/p>\n\u003cp>原本以为结束了扬州技师学院五年的学习生涯，今后都不用再学习了！现在我才认识到学校里的知识都是皮毛。\u003c/p>\n\u003cp>学校的数据车床，亚威的龙门铣床。\u003c/p>\n\u003cp>学校的西门子系统，亚威的法兰克系统。\u003c/p>\n\u003cp>学校的管理，亚威的管理。\u003c/p>\n\u003cp>都不同于学校，但如果没有这些皮毛知识，也许不会有这样的认知。\u003c/p>\n\u003cp>如果不在学校学过制图，可能在亚威图纸都看不懂。\u003c/p>\n\u003cp>如果不在学校学过编程，可能在亚威程序都看不懂。\u003c/p>\n\u003cp>而在不久的将来，我将接触更多的专业知识，还需要我不断的巩固、消化，并且运用到实际操作中。\u003c/p>\n\u003cp>\"活到老，学到老！\"\u003c/p>\u003cimg src=\"assets/yawei/03.jpg\" alt=\"亚威日记第3页\">","dateText":"2021.8.4","text":"今天是我来\"江苏亚威机床股份有限公司\"的第三天。\n\"学无止境！\"\n原本以为结束了扬州技师学院五年的学习生涯，今后都不用再学习了！现在我才认识到学校里的知识都是皮毛。\n学校的数据车床，亚威的龙门铣床。\n学校的西门子系统，亚威的法兰克系统。\n学校的管理，亚威的管理。\n都不同于学校，但如果没有这些皮毛知识，也许不会有这样的认知。\n如果不在学校学过制图，可能在亚威图纸都看不懂。\n如果不在学校学过编程，可能在亚威程序都看不懂。\n而在不久的将来，我将接触更多的专业知识，还需要我不断的巩固、消化，并且运用到实际操作中。\n\"活到老，学到老！\"","imp":0.55,"at":"2021-08-04T12:00:00","cat":"event","tags":["工作","亚威日记"],"related":[],"key":"江苏亚威机床股份有限公司"},{"id":"m153","title":"第四天","html":"\u003cp>今天是我来\"江苏亚威机床股份有限公司\"的第四天。\u003c/p>\n\u003cp>今天已经开始触碰面板了。随着前三天的观摩学习，师傅每天都会让我尝试一下修改编辑程序。\u003c/p>\n\u003cp>本来觉得多轴龙门的操作面板很简单，不像学校里实习的机床那样一个按钮要费力才能按下，也可能是我太紧张了，经常会多按或者按错。师傅都会在一旁记录着，鼓励我，要我慢慢来，还教我如何检验自己的操作是否正确。\u003c/p>\n\u003cp>修改程序这方面的知识还需要加强！\u003c/p>\n\u003cp>今天也只是简简单单做了一下相对坐标与绝对坐标罢了，还需要努力学习！\u003c/p>\n\u003cp>加油！\u003c/p>\u003cimg src=\"assets/yawei/04.jpg\" alt=\"亚威日记第4页\">","dateText":"2021.8.5","text":"今天是我来\"江苏亚威机床股份有限公司\"的第四天。\n今天已经开始触碰面板了。随着前三天的观摩学习，师傅每天都会让我尝试一下修改编辑程序。\n本来觉得多轴龙门的操作面板很简单，不像学校里实习的机床那样一个按钮要费力才能按下，也可能是我太紧张了，经常会多按或者按错。师傅都会在一旁记录着，鼓励我，要我慢慢来，还教我如何检验自己的操作是否正确。\n修改程序这方面的知识还需要加强！\n今天也只是简简单单做了一下相对坐标与绝对坐标罢了，还需要努力学习！\n加油！","imp":0.55,"at":"2021-08-05T12:00:00","cat":"event","tags":["工作","亚威日记"],"related":[],"key":"江苏亚威机床股份有限公司"},{"id":"m154","title":"第五天","html":"\u003cp>今天是我来\"江苏亚威机床股份有限公司\"的第五天。\u003c/p>\n\u003cp>明天是我来亚威的第一个假期。今天也正是一周一度\"全厂设备维护一级保养\"的日子，不管是早班还是下午班的师傅都过来一起打扫。\u003c/p>\n\u003cp>从打扫机床的鼓膜（？）开始，再用刷子刷第一遍涂洗（？），后来又用湿抹布擦。机床的内外护罩、耳到护罩（？）、机床床头、照明灯、操作面板等，用扫把把机床四周扫干净。液压油站、冷却器、温度调节（？）都是保养需要注意的地方。\u003c/p>\n\u003cp>在打扫的最后就是倒铁屑车。当其他两个师傅看到我推着大车出来时，都叮嘱我小心（？）：\"车下去没人，人别下去。\"开始我还不会掌握，听了他们的话我运起来也更稳（？）。运玻璃（？）师傅可能看出我的顾虑，陪着我一起倒去。虽然也不高，但这些都是同事们对我的关心，也让我感受到亚威的温暖。\u003c/p>\u003cimg src=\"assets/yawei/05.jpg\" alt=\"亚威日记第5页\">","dateText":"2021.8.6","text":"今天是我来\"江苏亚威机床股份有限公司\"的第五天。\n明天是我来亚威的第一个假期。今天也正是一周一度\"全厂设备维护一级保养\"的日子，不管是早班还是下午班的师傅都过来一起打扫。\n从打扫机床的鼓膜（？）开始，再用刷子刷第一遍涂洗（？），后来又用湿抹布擦。机床的内外护罩、耳到护罩（？）、机床床头、照明灯、操作面板等，用扫把把机床四周扫干净。液压油站、冷却器、温度调节（？）都是保养需要注意的地方。\n在打扫的最后就是倒铁屑车。当其他两个师傅看到我推着大车出来时，都叮嘱我小心（？）：\"车下去没人，人别下去。\"开始我还不会掌握，听了他们的话我运起来也更稳（？）。运玻璃（？）师傅可能看出我的顾虑，陪着我一起倒去。虽然也不高，但这些都是同事们对我的关心，也让我感受到亚威的温暖。","imp":0.55,"at":"2021-08-06T12:00:00","cat":"event","tags":["工作","亚威日记"],"related":[],"key":"江苏亚威机床股份有限公司"},{"id":"m155","title":"第一周周记","html":"\u003cp>这是我来到\"江苏亚威机床股份有限公司\"的第一周。\u003c/p>\n\u003cp>在这里我见到了许多新的设备，老师们讲解江苏亚威是如何如何的好。可能从那时起，我像被激活变成（？），加件批选（？）它们让我和它们一起前往精加工的路上，但也让我感到从未有过的恐惧、累和加速。\u003c/p>\n\u003cp>我需要做的有很多，需要做的也有很多。根据岗位的岗位（？），我却不能一步登天。每天八个小时的工作时间用来学习，我觉得远远不多，感觉时间加的跟过一般。\u003c/p>\n\u003cp>在这短短的一周内，我认识了：\"MES系统\"、\"FANUC系统\"、\"龙门铣床\"与它的工作原理，逐渐上手了\"机床开机和关机\"、\"程序的暂停和重启\"、\"更换刀具\"等和这些加时发生时\"打扫卫生和每周一次的一级保养\"。\u003c/p>\n\u003cp>又是回顾过去知识还是远远不够，我还需要制定好下一周将要学习的内容。\u003c/p>\n\u003cp>我将在下周更加熟练操作面板步骤，我也将跟上师傅们一起了解多些工序。我还想学会用行车、运转站（？）等帮师傅们分担一些工作量。\u003c/p>\n\u003cp>今年我精益求精，我做的哪天工作都会留下，足够长时间的问题（？），会让那些遥不可及的知识被遗忘（？）。所以在下周的工作中，我要更加努力学习，巩固知识！\u003c/p>\n\u003cp>郑重提示：①禁止上班玩手机；②我（们？）安全员班中常查（？）。\u003c/p>\u003cimg src=\"assets/yawei/06.jpg\" alt=\"亚威日记第6页\">","dateText":"2021.8.2","text":"这是我来到\"江苏亚威机床股份有限公司\"的第一周。\n在这里我见到了许多新的设备，老师们讲解江苏亚威是如何如何的好。可能从那时起，我像被激活变成（？），加件批选（？）它们让我和它们一起前往精加工的路上，但也让我感到从未有过的恐惧、累和加速。\n我需要做的有很多，需要做的也有很多。根据岗位的岗位（？），我却不能一步登天。每天八个小时的工作时间用来学习，我觉得远远不多，感觉时间加的跟过一般。\n在这短短的一周内，我认识了：\"MES系统\"、\"FANUC系统\"、\"龙门铣床\"与它的工作原理，逐渐上手了\"机床开机和关机\"、\"程序的暂停和重启\"、\"更换刀具\"等和这些加时发生时\"打扫卫生和每周一次的一级保养\"。\n又是回顾过去知识还是远远不够，我还需要制定好下一周将要学习的内容。\n我将在下周更加熟练操作面板步骤，我也将跟上师傅们一起了解多些工序。我还想学会用行车、运转站（？）等帮师傅们分担一些工作量。\n今年我精益求精，我做的哪天工作都会留下，足够长时间的问题（？），会让那些遥不可及的知识被遗忘（？）。所以在下周的工作中，我要更加努力学习，巩固知识！\n郑重提示：①禁止上班玩手机；②我（们？）安全员班中常查（？）。","imp":0.7,"at":"2021-08-06T12:00:00","cat":"event","tags":["工作","亚威日记"],"related":[],"key":"江苏亚威机床股份有限公司"},{"id":"m156","title":"第六天","html":"\u003cp>今天是我来\"江苏亚威机床股份有限公司\"的第六天。\u003c/p>\n\u003cp>经过了两天的休息，上一周学习的知识也有所消化，并有了自己的理解。\u003c/p>\n\u003cp>从入门的一窍不通，到一周后问题的理解。\u003c/p>\n\u003cp>随之而来的便是更深层的问题的露出。\u003c/p>\n\u003cp>虽然刚开始就感到似乎也没有多难，但今天才注意到机床的陌生，和原来学习的车床坐标有所出入。\u003c/p>\n\u003cp>还是在徐涛师傅的指导下，让我理顺了思路。\u003c/p>\n\u003cp>\"因为车床上移动的其实是刀具，所以一直没有搞清加工方面的概念。\"\u003c/p>\n\u003cp>例如以一个工件长度为100cm的中点作为坐标原点，如果想移动至X50坐标，随便刀具向右方向移动（工件不动）50cm。\u003c/p>\n\u003cp>但实际上却是加工面向左方向移动（刀具不动）50cm，但坐标还是X50（？）。\u003c/p>\n\u003cp>还是这是刚刚的工件，坐标原点在中间，但是刀具已经在X50的位置上，现在想移动至X20的话。\u003c/p>\n\u003cp>随便刀具向左方向移动（工件不动）30cm。\u003c/p>\n\u003cp>但实际上却是加工面向右方向移动（刀具不动）30cm。\u003c/p>\n\u003cp>坐标是X+20（？）。\u003c/p>\n\u003cp>虽然车床和铣床程序没有影响，但是在手轮操作下还是需要分辨一下他们的区别。\u003c/p>\u003cimg src=\"assets/yawei/07.jpg\" alt=\"亚威日记第7页\">","dateText":"2021.8.9","text":"今天是我来\"江苏亚威机床股份有限公司\"的第六天。\n经过了两天的休息，上一周学习的知识也有所消化，并有了自己的理解。\n从入门的一窍不通，到一周后问题的理解。\n随之而来的便是更深层的问题的露出。\n虽然刚开始就感到似乎也没有多难，但今天才注意到机床的陌生，和原来学习的车床坐标有所出入。\n还是在徐涛师傅的指导下，让我理顺了思路。\n\"因为车床上移动的其实是刀具，所以一直没有搞清加工方面的概念。\"\n例如以一个工件长度为100cm的中点作为坐标原点，如果想移动至X50坐标，随便刀具向右方向移动（工件不动）50cm。\n但实际上却是加工面向左方向移动（刀具不动）50cm，但坐标还是X50（？）。\n还是这是刚刚的工件，坐标原点在中间，但是刀具已经在X50的位置上，现在想移动至X20的话。\n随便刀具向左方向移动（工件不动）30cm。\n但实际上却是加工面向右方向移动（刀具不动）30cm。\n坐标是X+20（？）。\n虽然车床和铣床程序没有影响，但是在手轮操作下还是需要分辨一下他们的区别。","imp":0.55,"at":"2021-08-09T12:00:00","cat":"event","tags":["工作","徐涛","亚威日记"],"related":[],"key":"江苏亚威机床股份有限公司"},{"id":"m157","title":"第七天","html":"\u003cp>今天是我来\"江苏亚威机床股份有限公司\"的第七天。\u003c/p>\n\u003cp>今天学习的知识点有很多。实操在机床加工过程中最为重要的一项工具：\"行车\"。\u003c/p>\n\u003cp>虽然来了不足两三天就有接触行车，但是还没有正好的认识过行车。除了之前学习的\"行车十六条\"外，今天学习了装卸工件时不要着急上行车。\u003c/p>\n\u003cp>要先从东南西北四个方向确认工件是否在正中心，如果不在中心就装载的话，可能会导致工件撞上机床，更或者撞到人。所以吊起工件时不要一下升很高。先让工件离开地面便是悬空，待工件平稳后，再进行接下来的操作。要注意的是如果行车升得越高，工件摆动幅度就会更大，随之有危险。所以在非必要的情况下，行车运行工件时尽量不要升太高。相比于四周运动，上下的移动更为重要。还有就是使用后的行车一定要升回空中，避免撞到人或者又异（伤？）身。\u003c/p>\n\u003cp>这就是目前为止我对行车操作的认识。\u003c/p>\u003cimg src=\"assets/yawei/08.jpg\" alt=\"亚威日记第8页\">","dateText":"2021.8.10","text":"今天是我来\"江苏亚威机床股份有限公司\"的第七天。\n今天学习的知识点有很多。实操在机床加工过程中最为重要的一项工具：\"行车\"。\n虽然来了不足两三天就有接触行车，但是还没有正好的认识过行车。除了之前学习的\"行车十六条\"外，今天学习了装卸工件时不要着急上行车。\n要先从东南西北四个方向确认工件是否在正中心，如果不在中心就装载的话，可能会导致工件撞上机床，更或者撞到人。所以吊起工件时不要一下升很高。先让工件离开地面便是悬空，待工件平稳后，再进行接下来的操作。要注意的是如果行车升得越高，工件摆动幅度就会更大，随之有危险。所以在非必要的情况下，行车运行工件时尽量不要升太高。相比于四周运动，上下的移动更为重要。还有就是使用后的行车一定要升回空中，避免撞到人或者又异（伤？）身。\n这就是目前为止我对行车操作的认识。","imp":0.55,"at":"2021-08-10T12:00:00","cat":"event","tags":["工作","亚威日记"],"related":[],"key":"江苏亚威机床股份有限公司"},{"id":"m158","title":"第八天","html":"\u003cp>今天是我来\"江苏亚威机床股份有限公司\"的第八天。\u003c/p>\n\u003cp>今天和徐涛师傅一起，学习并熟悉操作面板上所有的按钮，共116个。\u003c/p>\n\u003cp>除了14个指令（？）式的按钮、33个间接实用按钮、3个应个按钮（？）。\u003c/p>\n\u003cp>16个无效按钮（例如TB-8）或在未来替代（例如INC键子轮替代）的按钮。\u003c/p>\n\u003cp>仅剩下50个按钮。\u003c/p>\n\u003cp>而在这50个按钮中，我需要记住并会使用的屈指可数。\u003c/p>\n\u003cp>因为今天的认识，让原本在我面前庞大、复杂的龙门铣床和法兰克系统，变得清晰明了。\u003c/p>\n\u003cp>但很多密集排列的按钮排列在边边角让我头昏，以后的学习之路还很长。\u003c/p>\u003cimg src=\"assets/yawei/09.jpg\" alt=\"亚威日记第9页\">","dateText":"2021.8.11","text":"今天是我来\"江苏亚威机床股份有限公司\"的第八天。\n今天和徐涛师傅一起，学习并熟悉操作面板上所有的按钮，共116个。\n除了14个指令（？）式的按钮、33个间接实用按钮、3个应个按钮（？）。\n16个无效按钮（例如TB-8）或在未来替代（例如INC键子轮替代）的按钮。\n仅剩下50个按钮。\n而在这50个按钮中，我需要记住并会使用的屈指可数。\n因为今天的认识，让原本在我面前庞大、复杂的龙门铣床和法兰克系统，变得清晰明了。\n但很多密集排列的按钮排列在边边角让我头昏，以后的学习之路还很长。","imp":0.55,"at":"2021-08-11T12:00:00","cat":"event","tags":["工作","徐涛","亚威日记"],"related":[],"key":"江苏亚威机床股份有限公司"},{"id":"m159","title":"第九天","html":"\u003cp>今天是我来\"江苏亚威机床股份有限公司\"的第九天。\u003c/p>\n\u003cp>当我刚进入车间时，师傅就带着我做T1+F316N+202H箱盖。\u003c/p>\n\u003cp>每天都重复着同样的工序，都能独立更换刀具。终于在今天结束了整个加工的一半（？），徐涛师傅也开始教我工艺卡片的操作与作业指导卡片。\u003c/p>\n\u003cp>接过师傅们的上手操作，与工艺卡片并无两样。\u003c/p>\n\u003cp>但这过程中我也终于知道刀具们的性能名称。\u003c/p>\n\u003cp>\"T10整体硬质合金铣刀（？）\"是第一步所使用的刀具，包括装夹后的定位时也要用到，主要用于加工四周及平面。\u003c/p>\n\u003cp>\"D10刀盘\"是用得最多的一个刀具（有时也是最累的），包括凹刀面、粗铣和精铣，四周4-C0.5的倒角，以及4-C1.5的倒角。特别要注意在精加工前要取下刀盘反转重装已磨损的刀片。\u003c/p>\n\u003cp>（因为加工箱盖用在钻4-Φ1通孔前需释放压力，具体就表现在机开机具再夹紧（？））\u003c/p>\n\u003cp>\"D11钻头：补四孔华（？），钻头钻头，它给我的印象是需要经常停止加工去清理钻头上缠绕的铁屑。\u003c/p>\n\u003cp>\"D8钻头是合金钻头\"是整个加工过程中耗时最久的，也是我目前唯一会修换程序的一道工序。\u003c/p>\n\u003cp>\"D12.5刀盘\"，它是最末一道工序所需的刀具。它像菊花一般绽放，有着八（？）刀片，缠绕的，但充满科技感。\u003c/p>\u003cimg src=\"assets/yawei/10.jpg\" alt=\"亚威日记第10页\">","dateText":"2021.8.12","text":"今天是我来\"江苏亚威机床股份有限公司\"的第九天。\n当我刚进入车间时，师傅就带着我做T1+F316N+202H箱盖。\n每天都重复着同样的工序，都能独立更换刀具。终于在今天结束了整个加工的一半（？），徐涛师傅也开始教我工艺卡片的操作与作业指导卡片。\n接过师傅们的上手操作，与工艺卡片并无两样。\n但这过程中我也终于知道刀具们的性能名称。\n\"T10整体硬质合金铣刀（？）\"是第一步所使用的刀具，包括装夹后的定位时也要用到，主要用于加工四周及平面。\n\"D10刀盘\"是用得最多的一个刀具（有时也是最累的），包括凹刀面、粗铣和精铣，四周4-C0.5的倒角，以及4-C1.5的倒角。特别要注意在精加工前要取下刀盘反转重装已磨损的刀片。\n（因为加工箱盖用在钻4-Φ1通孔前需释放压力，具体就表现在机开机具再夹紧（？））\n\"D11钻头：补四孔华（？），钻头钻头，它给我的印象是需要经常停止加工去清理钻头上缠绕的铁屑。\n\"D8钻头是合金钻头\"是整个加工过程中耗时最久的，也是我目前唯一会修换程序的一道工序。\n\"D12.5刀盘\"，它是最末一道工序所需的刀具。它像菊花一般绽放，有着八（？）刀片，缠绕的，但充满科技感。","imp":0.55,"at":"2021-08-12T12:00:00","cat":"event","tags":["工作","徐涛","亚威日记"],"related":[],"key":"江苏亚威机床股份有限公司"},{"id":"m160","title":"第十天","html":"\u003cp>今天是我来\"江苏亚威机床股份有限公司\"的第十天。\u003c/p>\n\u003cp>今天是这个周最后一个工作日。因为假期原因，原本计划的周六上班被取消了。\u003c/p>\n\u003cp>今天很忙，一刻未停，因为今天的加工工序每一步时间都很短。\u003c/p>\n\u003cp>也继续研究工艺卡片，也认识了全新的刀具。\u003c/p>\n\u003cp>\"寻边器\"：转速只有1W，且不需要加工（？）。因为已经去过毛坯了，所以不能用D10硬质合金立铣刀去定坐标。\u003c/p>\n\u003cp>\"D6平底钻头\"相当于D11钻头，更快更粗，但和D11钻头一样，需要经常停止加工清理铁屑。\u003c/p>\n\u003cp>\"D6丝锥\"和\"D10丝锥\"都是用于弹簧夹头夹持\"快速更换的\"。\u003c/p>\n\u003cp>\"714点位钻头\"加工四周四个工艺孔，配合\"D6丝锥\"攻螺纹。\u003c/p>\n\u003cp>\"D40刀盘\"加工凹刀面，再用\"D8硬质合金铣刀\"加工凹刀面的两孔，配合\"D10丝锥\"。\u003c/p>\n\u003cp>虽然在加工时间偏短，但用到的刀具多，工序也烦琐。更重要的是直接按两个丝锥的话太麻烦了！可是师傅的操作却很简单，可能我还需要掌握技巧吧。\u003c/p>\u003cimg src=\"assets/yawei/11.jpg\" alt=\"亚威日记第11页\">","dateText":"2021.8.13","text":"今天是我来\"江苏亚威机床股份有限公司\"的第十天。\n今天是这个周最后一个工作日。因为假期原因，原本计划的周六上班被取消了。\n今天很忙，一刻未停，因为今天的加工工序每一步时间都很短。\n也继续研究工艺卡片，也认识了全新的刀具。\n\"寻边器\"：转速只有1W，且不需要加工（？）。因为已经去过毛坯了，所以不能用D10硬质合金立铣刀去定坐标。\n\"D6平底钻头\"相当于D11钻头，更快更粗，但和D11钻头一样，需要经常停止加工清理铁屑。\n\"D6丝锥\"和\"D10丝锥\"都是用于弹簧夹头夹持\"快速更换的\"。\n\"714点位钻头\"加工四周四个工艺孔，配合\"D6丝锥\"攻螺纹。\n\"D40刀盘\"加工凹刀面，再用\"D8硬质合金铣刀\"加工凹刀面的两孔，配合\"D10丝锥\"。\n虽然在加工时间偏短，但用到的刀具多，工序也烦琐。更重要的是直接按两个丝锥的话太麻烦了！可是师傅的操作却很简单，可能我还需要掌握技巧吧。","imp":0.55,"at":"2021-08-13T12:00:00","cat":"event","tags":["工作","亚威日记"],"related":[],"key":"江苏亚威机床股份有限公司"},{"id":"m161","title":"第二周周记","html":"\u003cp>这是我来到\"江苏亚威机床股份有限公司\"的第二周。\u003c/p>\n\u003cp>在这周，终于算是真正入门从雏形刀具到开始加工的箱盖。我原以为我已经掌握了所有的加工流程，但万万没想到下一周就要换产品做了。在这一周结束前，师傅还给了下一周的图纸让我先熟悉。这是我目前为止见过最大的图纸，又是在学校也只是见A4的制图，最多也只用过A3纸，而这颗主轴的图纸应该是A1的，比例也是夸张的1:4。我问师傅：这应该要学一周吧？做四天？师傅轻描淡写：\"用不到，三四天吧。\"也就是说三四天后又要换新工件。我要什么时候才能出师啊！\u003c/p>\n\u003cp>这周依然有很多欣喜。学习了开关机，平时有空（？）的我就有时间练习开关机以及回答考官。熟悉坐标系正负方向（？）；学习了四种螺纹的机床孔径（？），师傅也时不时考问我，让我印象更加深刻；学习了使用行车，因为周五工件的临时批（？），周五一天的时间都在使用行车和更换刀具及孔距（？）。还学相对坐标与绝对坐标也得到了很大程度的使用；学习了操作面板，学习了简单的修改\"Tmm精（？）\"的程序。对我印象最深的就是\"程序运行中一定要换刀复位\"。\u003c/p>\n\u003cp>这周的学习压力也是越来越紧了，下周也要继续努力！\u003c/p>\n\u003cp>施俊辰 2021.8.15\u003c/p>\u003cimg src=\"assets/yawei/12.jpg\" alt=\"亚威日记第12页\">","dateText":"2021.8.9","text":"这是我来到\"江苏亚威机床股份有限公司\"的第二周。\n在这周，终于算是真正入门从雏形刀具到开始加工的箱盖。我原以为我已经掌握了所有的加工流程，但万万没想到下一周就要换产品做了。在这一周结束前，师傅还给了下一周的图纸让我先熟悉。这是我目前为止见过最大的图纸，又是在学校也只是见A4的制图，最多也只用过A3纸，而这颗主轴的图纸应该是A1的，比例也是夸张的1:4。我问师傅：这应该要学一周吧？做四天？师傅轻描淡写：\"用不到，三四天吧。\"也就是说三四天后又要换新工件。我要什么时候才能出师啊！\n这周依然有很多欣喜。学习了开关机，平时有空（？）的我就有时间练习开关机以及回答考官。熟悉坐标系正负方向（？）；学习了四种螺纹的机床孔径（？），师傅也时不时考问我，让我印象更加深刻；学习了使用行车，因为周五工件的临时批（？），周五一天的时间都在使用行车和更换刀具及孔距（？）。还学相对坐标与绝对坐标也得到了很大程度的使用；学习了操作面板，学习了简单的修改\"Tmm精（？）\"的程序。对我印象最深的就是\"程序运行中一定要换刀复位\"。\n这周的学习压力也是越来越紧了，下周也要继续努力！\n施俊辰 2021.8.15","imp":0.7,"at":"2021-08-13T12:00:00","cat":"event","tags":["工作","亚威日记"],"related":[],"key":"江苏亚威机床股份有限公司"},{"id":"m162","title":"第十一天","html":"\u003cp>今天是我来\"江苏亚威机床股份有限公司\"的第十一天。\u003c/p>\n\u003cp>今天直接制作了新的工件，一切都是新的开始。看了一下，一周（？）所需加工的产品图纸，一个和一个不一样。不再像箱盖那样一做就是六件，多以反复，至少要学会熟练。\u003c/p>\n\u003cp>而如今却如同在考验我，让我愈感到前所未有的无力。\u003c/p>\n\u003cp>不知道下一步需要的刀具，不清楚下一步该干什么。一切的一切没有可以选用的源头，只能看着师傅行云流水般的操作。只有师傅叫我去拿什么才拿什么，叫我做什么才做什么，一切都是那么的被动。\u003c/p>\n\u003cp>上周我以为我已经在慢慢上手了，没想到我只是略知一二，也只是井底之蛙（月台之蛙？）。\u003c/p>\n\u003cp>这对于我来说，莫过于晴天霹雳般巨大的打击。\u003c/p>\u003cimg src=\"assets/yawei/13.jpg\" alt=\"亚威日记第13页\">","dateText":"2021.8.16","text":"今天是我来\"江苏亚威机床股份有限公司\"的第十一天。\n今天直接制作了新的工件，一切都是新的开始。看了一下，一周（？）所需加工的产品图纸，一个和一个不一样。不再像箱盖那样一做就是六件，多以反复，至少要学会熟练。\n而如今却如同在考验我，让我愈感到前所未有的无力。\n不知道下一步需要的刀具，不清楚下一步该干什么。一切的一切没有可以选用的源头，只能看着师傅行云流水般的操作。只有师傅叫我去拿什么才拿什么，叫我做什么才做什么，一切都是那么的被动。\n上周我以为我已经在慢慢上手了，没想到我只是略知一二，也只是井底之蛙（月台之蛙？）。\n这对于我来说，莫过于晴天霹雳般巨大的打击。","imp":0.55,"at":"2021-08-16T12:00:00","cat":"event","tags":["工作","亚威日记"],"related":[],"key":"江苏亚威机床股份有限公司"},{"id":"m163","title":"第十二天","html":"\u003cp>今天是我来\"江苏亚威机床股份有限公司\"的第十二天。\u003c/p>\n\u003cp>今天徐涛师傅初步给我介绍了关于机床坐标系和机械的操作与参数。\u003c/p>\n\u003cp>看来最重要的还是\"复位\"，之后才是后续的操作。\u003c/p>\n\u003cp>因为今天工件所使用到手轮（？）的操作较为频繁，所以很快便上了手。\u003c/p>\n\u003cp>所谓熟能生巧，前一次次的不确定、不自信，到现在有些顺畅，希望多多巩固，能成为自己的知识点。\u003c/p>\n\u003cp>但即便再快，也万万不可以出错！\u003c/p>\u003cimg src=\"assets/yawei/14.jpg\" alt=\"亚威日记第14页\">","dateText":"2021.8.17","text":"今天是我来\"江苏亚威机床股份有限公司\"的第十二天。\n今天徐涛师傅初步给我介绍了关于机床坐标系和机械的操作与参数。\n看来最重要的还是\"复位\"，之后才是后续的操作。\n因为今天工件所使用到手轮（？）的操作较为频繁，所以很快便上了手。\n所谓熟能生巧，前一次次的不确定、不自信，到现在有些顺畅，希望多多巩固，能成为自己的知识点。\n但即便再快，也万万不可以出错！","imp":0.55,"at":"2021-08-17T12:00:00","cat":"event","tags":["工作","徐涛","亚威日记"],"related":[],"key":"江苏亚威机床股份有限公司"},{"id":"m164","title":"第十三天","html":"\u003cp>今天是我来\"江苏亚威机床股份有限公司\"的第十三天。\u003c/p>\n\u003cp>今天上午被外调至外边帮助卸货，是从上海运送过来的切削原油（？）。\u003c/p>\n\u003cp>乘载帮忙的天车师傅调（？）还有些不好意思，一直和我讲麻烦我了。我和他说没事的，我刚来，要学的很多，哪里需要人就能去哪，正好多学学。于是我便第一次去了C4车间，也看到了除精加工以外的车间。\u003c/p>\n\u003cp>下午徐涛师傅教我使用外径千分尺和内径百分表，也是满满的知识点。千分尺、内径百分表也是一门技术活。\u003c/p>\n\u003cp>除此之外，徐涛师傅还教了我一个我暂时用不到但很有用的知识点。\u003c/p>\n\u003cp>\"长杆的刀具（镗刀）刚加工完存在温度，工件会有大小偏差，需要再空走一刀，并配合气枪，使钢性消除（？），再进行测量。\"\u003c/p>\n\u003cp>今天的知识点都很重要，需要多多记忆！\u003c/p>\u003cimg src=\"assets/yawei/15.jpg\" alt=\"亚威日记第15页\">","dateText":"2021.8.18","text":"今天是我来\"江苏亚威机床股份有限公司\"的第十三天。\n今天上午被外调至外边帮助卸货，是从上海运送过来的切削原油（？）。\n乘载帮忙的天车师傅调（？）还有些不好意思，一直和我讲麻烦我了。我和他说没事的，我刚来，要学的很多，哪里需要人就能去哪，正好多学学。于是我便第一次去了C4车间，也看到了除精加工以外的车间。\n下午徐涛师傅教我使用外径千分尺和内径百分表，也是满满的知识点。千分尺、内径百分表也是一门技术活。\n除此之外，徐涛师傅还教了我一个我暂时用不到但很有用的知识点。\n\"长杆的刀具（镗刀）刚加工完存在温度，工件会有大小偏差，需要再空走一刀，并配合气枪，使钢性消除（？），再进行测量。\"\n今天的知识点都很重要，需要多多记忆！","imp":0.75,"at":"2021-08-18T12:00:00","cat":"event","tags":["工作","徐涛","亚威日记"],"related":[],"key":"江苏亚威机床股份有限公司"},{"id":"m165","title":"第十四天","html":"\u003cp>今天是我来\"江苏亚威机床股份有限公司\"的第十四天。\u003c/p>\n\u003cp>今天把这几天一直在加工的主轴做完了。随后的一上午都是在为接下来的工件做准备，徐涛师傅还让我个人尝试一下装夹工件。我便开始跃跃欲试（按部就班？）的开始操作。虽然大概外形差不多，但其基本的细节我却没有注意到。徐涛师傅采用让我先尝试再示范，让我的印象更加深刻。\u003c/p>\n\u003cp>就比如装夹时的垫块应该略高于工件这一点，如果不是亲身尝试，恐怕一直都不会在意吧！\u003c/p>\n\u003cp>下午徐涛师傅还教了我手轮的基本操作和手持吸尘器（吹风机？）的工作原理。相比于手轮，吸尘机真是一个危险的工具！\u003c/p>\n\u003cp>在今后的工作中，避免风险固然重要（？），但生命安全更重要。\u003c/p>\u003cimg src=\"assets/yawei/16.jpg\" alt=\"亚威日记第16页\">","dateText":"2021.8.19","text":"今天是我来\"江苏亚威机床股份有限公司\"的第十四天。\n今天把这几天一直在加工的主轴做完了。随后的一上午都是在为接下来的工件做准备，徐涛师傅还让我个人尝试一下装夹工件。我便开始跃跃欲试（按部就班？）的开始操作。虽然大概外形差不多，但其基本的细节我却没有注意到。徐涛师傅采用让我先尝试再示范，让我的印象更加深刻。\n就比如装夹时的垫块应该略高于工件这一点，如果不是亲身尝试，恐怕一直都不会在意吧！\n下午徐涛师傅还教了我手轮的基本操作和手持吸尘器（吹风机？）的工作原理。相比于手轮，吸尘机真是一个危险的工具！\n在今后的工作中，避免风险固然重要（？），但生命安全更重要。","imp":0.55,"at":"2021-08-19T12:00:00","cat":"event","tags":["工作","徐涛","亚威日记"],"related":[],"key":"江苏亚威机床股份有限公司"},{"id":"m166","title":"第十五天","html":"\u003cp>今天是我来\"江苏亚威机床股份有限公司\"的第十五天。\u003c/p>\n\u003cp>今天上午，孙师傅过来维修关于机床防护罩、导轨油滴漏的问题，也让我第一次亲历防护罩内部导轨的模样，也进一步了解了机床Y轴运行时、导轨箱等。\u003c/p>\n\u003cp>师傅也顺便和提讲了一下关于6S的常识，也向我详细讲解了就应该做到的如何打扫整理，才能达到6S的要求。\u003c/p>\n\u003cp>下午，徐涛师傅让我尝试板调工件。有了昨天的上手基础，其实板调并不困难，最重要的还是得耐心细心！不能因为会了就熟了就吊儿郎当。宁可慢点多加确认，也不可马虎了事！\u003c/p>\u003cimg src=\"assets/yawei/17.jpg\" alt=\"亚威日记第17页\">","dateText":"2021.8.20","text":"今天是我来\"江苏亚威机床股份有限公司\"的第十五天。\n今天上午，孙师傅过来维修关于机床防护罩、导轨油滴漏的问题，也让我第一次亲历防护罩内部导轨的模样，也进一步了解了机床Y轴运行时、导轨箱等。\n师傅也顺便和提讲了一下关于6S的常识，也向我详细讲解了就应该做到的如何打扫整理，才能达到6S的要求。\n下午，徐涛师傅让我尝试板调工件。有了昨天的上手基础，其实板调并不困难，最重要的还是得耐心细心！不能因为会了就熟了就吊儿郎当。宁可慢点多加确认，也不可马虎了事！","imp":0.55,"at":"2021-08-20T12:00:00","cat":"event","tags":["工作","徐涛","亚威日记"],"related":[],"key":"江苏亚威机床股份有限公司"},{"id":"m167","title":"第三周周记","html":"\u003cp>这是我来到\"江苏亚威机床股份有限公司\"的第三周。\u003c/p>\n\u003cp>这一周内，已经更换加工了四种工件了，我也明白了。我并不是简单地学一种工件、一种程序和调机（？）就可以搞定的。我是要学习机床技术、加工经验的。方兴未艾（？）其实就是要像徐涛师傅那样，随随便便写出一段完整地、简洁而有条、正确无误的程序。所以这一周要打好基础！\u003c/p>\n\u003cp>学习了除了X轴、Y轴、Z轴外的B轴，学习了B轴的操作，\"M21\"和\"M22\"，B轴的锁紧原点以及其操作注意（注意事项）。\u003c/p>\n\u003cp>学习了同一道工序在不同位置上增加编程程序（？），又称\"机床坐标系转移（移）\"。\u003c/p>\n\u003cp>学习了使用外径千分尺和内径百分表。\u003c/p>\n\u003cp>学习了操作手轮和手持吸尘机。\u003c/p>\n\u003cp>除了学习理论知识，也有实际的操作。就比如：上下工件、垫垫片、固定工件、上下刀具、使用手轮进行板调、修改简单的程序等。\u003c/p>\n\u003cp>还学习到一些书本上从未提过的知识。就比如：\u003c/p>\n\u003cp>长杆刀具（镗刀）加工后，需要空走一刀才能测量精度。\u003c/p>\n\u003cp>固定用的螺栓和螺帽在加工过程中会受力变形（变松），所以旧螺杆无法配与新螺帽进行配合，以螺帽才是首选。等等。\u003c/p>\n\u003cp>这就是我第三周的学习内容。抛开前两周的试图急于求成，这一周才是真正的开始！\u003c/p>\u003cimg src=\"assets/yawei/18.jpg\" alt=\"亚威日记第18页\">","dateText":"2021.8.16","text":"这是我来到\"江苏亚威机床股份有限公司\"的第三周。\n这一周内，已经更换加工了四种工件了，我也明白了。我并不是简单地学一种工件、一种程序和调机（？）就可以搞定的。我是要学习机床技术、加工经验的。方兴未艾（？）其实就是要像徐涛师傅那样，随随便便写出一段完整地、简洁而有条、正确无误的程序。所以这一周要打好基础！\n学习了除了X轴、Y轴、Z轴外的B轴，学习了B轴的操作，\"M21\"和\"M22\"，B轴的锁紧原点以及其操作注意（注意事项）。\n学习了同一道工序在不同位置上增加编程程序（？），又称\"机床坐标系转移（移）\"。\n学习了使用外径千分尺和内径百分表。\n学习了操作手轮和手持吸尘机。\n除了学习理论知识，也有实际的操作。就比如：上下工件、垫垫片、固定工件、上下刀具、使用手轮进行板调、修改简单的程序等。\n还学习到一些书本上从未提过的知识。就比如：\n长杆刀具（镗刀）加工后，需要空走一刀才能测量精度。\n固定用的螺栓和螺帽在加工过程中会受力变形（变松），所以旧螺杆无法配与新螺帽进行配合，以螺帽才是首选。等等。\n这就是我第三周的学习内容。抛开前两周的试图急于求成，这一周才是真正的开始！","imp":0.7,"at":"2021-08-22T12:00:00","cat":"event","tags":["工作","徐涛","亚威日记"],"related":[],"key":"江苏亚威机床股份有限公司"},{"id":"m168","title":"第十六天","html":"\u003cp>今天是我来\"江苏亚威机床股份有限公司\"的第十六天。\u003c/p>\n\u003cp>今天徐涛师傅教了我使用MES系统，如何进行项目（任务？）自查。从今天起，应该都会是我自己进行填写了！\u003c/p>\n\u003cp>今天晚上下班，谭总组织了他们龙门一班与二班去开会。开会的内容是有人在高压电柜中放置衣服架（雨伞？）。开始我以为只是卫生方面的问题，没想到却遇到了安全隐患！看似简单的小事，如果发现不及时，甚至会丧失生命。\u003c/p>\n\u003cp>如果在学习加工作业前，学习如何保护自己更为重要。\u003c/p>\u003cimg src=\"assets/yawei/19.jpg\" alt=\"亚威日记第19页\">","dateText":"2021.8.23","text":"今天是我来\"江苏亚威机床股份有限公司\"的第十六天。\n今天徐涛师傅教了我使用MES系统，如何进行项目（任务？）自查。从今天起，应该都会是我自己进行填写了！\n今天晚上下班，谭总组织了他们龙门一班与二班去开会。开会的内容是有人在高压电柜中放置衣服架（雨伞？）。开始我以为只是卫生方面的问题，没想到却遇到了安全隐患！看似简单的小事，如果发现不及时，甚至会丧失生命。\n如果在学习加工作业前，学习如何保护自己更为重要。","imp":0.55,"at":"2021-08-23T12:00:00","cat":"event","tags":["工作","徐涛","亚威日记"],"related":[],"key":"江苏亚威机床股份有限公司"},{"id":"m169","title":"第十七天","html":"\u003cp>今天是我来\"江苏亚威机床股份有限公司\"的第十七天。\u003c/p>\n\u003cp>今天主要学了工件装夹的小技巧，也可以说是尽可能少的技巧（？）。因为装夹螺丝无法拧上时，我都会以为是压板压歪在中间，但其实都会用手扶了又扶，都没有效果（？），后来都试了一个螺丝才有感觉（？），也不知道其中的道理。今天徐涛师傅算是给我解答了心中的疑惑了。\u003c/p>\u003cimg src=\"assets/yawei/20.jpg\" alt=\"亚威日记第20页\">","dateText":"2021.8.24","text":"今天是我来\"江苏亚威机床股份有限公司\"的第十七天。\n今天主要学了工件装夹的小技巧，也可以说是尽可能少的技巧（？）。因为装夹螺丝无法拧上时，我都会以为是压板压歪在中间，但其实都会用手扶了又扶，都没有效果（？），后来都试了一个螺丝才有感觉（？），也不知道其中的道理。今天徐涛师傅算是给我解答了心中的疑惑了。","imp":0.55,"at":"2021-08-24T12:00:00","cat":"event","tags":["工作","徐涛","亚威日记"],"related":[],"key":"江苏亚威机床股份有限公司"},{"id":"m170","title":"第十八天","html":"\u003cp>今天是我来\"江苏亚威机床股份有限公司\"的第十八天。\u003c/p>\n\u003cp>下午徐涛师傅带我去了刀具库，教了我一下怎么领刀具、怎么换刀片。\u003c/p>\n\u003cp>下午徐涛师傅家中有事先回家了（？），师傅让我先自己编写简单的程序熟悉一下流程。\u003c/p>\n\u003cp>本来，我想起每次在工具箱中找合适长度的螺杆都很困难。于是便想到今天把工具箱收拾一下，正好呼应了6S中的整理（？），也方便了自己找东西，也加快了工作效率。于是我便将原本零乱无章（？）的工具箱全倒在机床上，将长度相同的螺杆摆放在一起放入工具箱中，将原本箱里的缺角（？）、垃圾一并倒掉。\u003c/p>\n\u003cp>之后的工具箱整理清爽，又十分方便拿取。这说明6S对整理很重要。\u003c/p>\u003cimg src=\"assets/yawei/21.jpg\" alt=\"亚威日记第21页\">","dateText":"2021.8.25","text":"今天是我来\"江苏亚威机床股份有限公司\"的第十八天。\n下午徐涛师傅带我去了刀具库，教了我一下怎么领刀具、怎么换刀片。\n下午徐涛师傅家中有事先回家了（？），师傅让我先自己编写简单的程序熟悉一下流程。\n本来，我想起每次在工具箱中找合适长度的螺杆都很困难。于是便想到今天把工具箱收拾一下，正好呼应了6S中的整理（？），也方便了自己找东西，也加快了工作效率。于是我便将原本零乱无章（？）的工具箱全倒在机床上，将长度相同的螺杆摆放在一起放入工具箱中，将原本箱里的缺角（？）、垃圾一并倒掉。\n之后的工具箱整理清爽，又十分方便拿取。这说明6S对整理很重要。","imp":0.55,"at":"2021-08-25T12:00:00","cat":"event","tags":["工作","徐涛","亚威日记"],"related":[],"key":"江苏亚威机床股份有限公司"},{"id":"m171","title":"第十九天","html":"\u003cp>今天是我来\"江苏亚威机床股份有限公司\"的第十九天。\u003c/p>\n\u003cp>今天下午，提琴滑块加工完毕。徐涛师傅教了我一下工件做完后如何报完工。流程很简单，一看就懂。\u003c/p>\n\u003cp>在刚加工完之后，徐涛师傅发现工件被加工面上有明显的伤痕。我问师傅该怎么样，因为我内心还是挺慌的。虽然我只是板调、接刀、定位等配合加工的工序，但也第一次遇到这种事，听得却很难静（？）。徐涛师傅叫我先检查一下情况。在检验师傅看了一眼便知道是工件材料的问题，与我们加工无关。这才让我松了口气。于是在检验师傅与徐涛师傅根据工艺卡片上的信息，找到上一步加工的工序，一起讨论该如何解决。\u003c/p>\n\u003cp>好在最后虚惊一场，问题不大。\u003c/p>\u003cimg src=\"assets/yawei/22.jpg\" alt=\"亚威日记第22页\">","dateText":"2021.8.26","text":"今天是我来\"江苏亚威机床股份有限公司\"的第十九天。\n今天下午，提琴滑块加工完毕。徐涛师傅教了我一下工件做完后如何报完工。流程很简单，一看就懂。\n在刚加工完之后，徐涛师傅发现工件被加工面上有明显的伤痕。我问师傅该怎么样，因为我内心还是挺慌的。虽然我只是板调、接刀、定位等配合加工的工序，但也第一次遇到这种事，听得却很难静（？）。徐涛师傅叫我先检查一下情况。在检验师傅看了一眼便知道是工件材料的问题，与我们加工无关。这才让我松了口气。于是在检验师傅与徐涛师傅根据工艺卡片上的信息，找到上一步加工的工序，一起讨论该如何解决。\n好在最后虚惊一场，问题不大。","imp":0.75,"at":"2021-08-26T12:00:00","cat":"event","tags":["工作","徐涛","亚威日记"],"related":[],"key":"江苏亚威机床股份有限公司"},{"id":"m172","title":"第二十天","html":"\u003cp>今天是我来\"江苏亚威机床股份有限公司\"的第二十天。\u003c/p>\n\u003cp>今天又开始加工新的工件了：弓形板。虽然外形很像之前加工的弓形板（？），但它们的加工工艺大不相同。\u003c/p>\n\u003cp>于是徐涛师傅在我面前复现（？）了一遍现场程序。这个工件装夹方式也很特别，是小平面朝下，大平面朝上，用压板压住两端后，再顶起中段。\u003c/p>\n\u003cp>而今天的板调对原点都是我一个人完成的，与刚来时的无从下手完全不同，也让我感受到自己的进步。\u003c/p>\u003cimg src=\"assets/yawei/23.jpg\" alt=\"亚威日记第23页\">","dateText":"2021.8.27","text":"今天是我来\"江苏亚威机床股份有限公司\"的第二十天。\n今天又开始加工新的工件了：弓形板。虽然外形很像之前加工的弓形板（？），但它们的加工工艺大不相同。\n于是徐涛师傅在我面前复现（？）了一遍现场程序。这个工件装夹方式也很特别，是小平面朝下，大平面朝上，用压板压住两端后，再顶起中段。\n而今天的板调对原点都是我一个人完成的，与刚来时的无从下手完全不同，也让我感受到自己的进步。","imp":0.55,"at":"2021-08-27T12:00:00","cat":"event","tags":["工作","徐涛","亚威日记"],"related":[],"key":"江苏亚威机床股份有限公司"},{"id":"m173","title":"第四周周记","html":"\u003cp>这是我来到\"江苏亚威机床股份有限公司\"的第四周。\u003c/p>\n\u003cp>这周一下班后去二楼会议室开会。第一位面对的是这么做的（？）评弹（？）总讲话。他的语速和蔼温和、亲民，但不少点对工作的丝毫不苟与严厉，让我由衷而发的崇拜于领导的人格魅力。在会议上，让我更加深刻的认识到6S的重要性。\u003c/p>\n\u003cp>就如同我刚刚来厂里时，周飞主任给我们讲的海恩里希法则（？）：\"每一起严重事故的背后，必然有29次轻微事故和300起未遂先兆以及1000起事故隐患。\"所以这一次会议危机险些愈盐愈重（？），严重——帮助我们敲打心中的安全警钟。\u003c/p>\n\u003cp>这周学习了关于MES系统的自检点（？）、报完工的操作流程。\u003c/p>\n\u003cp>学习了寻边器的使用方法。\u003c/p>\n\u003cp>学习了装夹工件和装夹的技巧。\u003c/p>\n\u003cp>学习了刀盘刀片的切削参数及使用场景。\u003c/p>\n\u003cp>渐渐掌握了正确的板调流程与对原点的方式。\u003c/p>\n\u003cp>明白了6S的重要性，以及自身有许多需要改善的地方，只是缺少了一双会发现的眼睛。\u003c/p>\n\u003cp>随着张鲍师傅月底将要离去开始新的生活，我也明白了时间的流逝。一切都不会在此刻定格。未来的一切都将成为变量，随着时代的变化，新鲜血液的流入。如果不想被淘汰、被替代，唯有充实自己、努力变强，才是重中之重。我要学做的还有很多。\u003c/p>\n\u003cp>优胜劣汰，适者生存。\u003c/p>\u003cimg src=\"assets/yawei/24.jpg\" alt=\"亚威日记第24页\">","dateText":"2021.8.23","text":"这是我来到\"江苏亚威机床股份有限公司\"的第四周。\n这周一下班后去二楼会议室开会。第一位面对的是这么做的（？）评弹（？）总讲话。他的语速和蔼温和、亲民，但不少点对工作的丝毫不苟与严厉，让我由衷而发的崇拜于领导的人格魅力。在会议上，让我更加深刻的认识到6S的重要性。\n就如同我刚刚来厂里时，周飞主任给我们讲的海恩里希法则（？）：\"每一起严重事故的背后，必然有29次轻微事故和300起未遂先兆以及1000起事故隐患。\"所以这一次会议危机险些愈盐愈重（？），严重——帮助我们敲打心中的安全警钟。\n这周学习了关于MES系统的自检点（？）、报完工的操作流程。\n学习了寻边器的使用方法。\n学习了装夹工件和装夹的技巧。\n学习了刀盘刀片的切削参数及使用场景。\n渐渐掌握了正确的板调流程与对原点的方式。\n明白了6S的重要性，以及自身有许多需要改善的地方，只是缺少了一双会发现的眼睛。\n随着张鲍师傅月底将要离去开始新的生活，我也明白了时间的流逝。一切都不会在此刻定格。未来的一切都将成为变量，随着时代的变化，新鲜血液的流入。如果不想被淘汰、被替代，唯有充实自己、努力变强，才是重中之重。我要学做的还有很多。\n优胜劣汰，适者生存。","imp":0.7,"at":"2021-08-29T12:00:00","cat":"event","tags":["工作","张鲍","亚威日记"],"related":[],"key":"江苏亚威机床股份有限公司"},{"id":"m174","title":"第二十一天","html":"\u003cp>今天是我来\"江苏亚威机床股份有限公司\"的第二十一天。\u003c/p>\n\u003cp>今天过的十分平凡，但知识点却遍布我的身边。有一些，不会的、不懂的可以学习；有一些，会的、做错的，可以改进。\u003c/p>\n\u003cp>就比如最简单的拧螺丝都有自己的理解。\u003c/p>\u003cimg src=\"assets/yawei/25.jpg\" alt=\"亚威日记第25页\">","dateText":"2021.8.30","text":"今天是我来\"江苏亚威机床股份有限公司\"的第二十一天。\n今天过的十分平凡，但知识点却遍布我的身边。有一些，不会的、不懂的可以学习；有一些，会的、做错的，可以改进。\n就比如最简单的拧螺丝都有自己的理解。","imp":0.55,"at":"2021-08-30T12:00:00","cat":"event","tags":["工作","亚威日记"],"related":[],"key":"江苏亚威机床股份有限公司"},{"id":"m175","title":"第二十二天","html":"\u003cp>今天是我来\"江苏亚威机床股份有限公司\"的第二十二天。\u003c/p>\n\u003cp>下午徐涛师傅教我如何修改程序。因为之前只是看着师傅行云流水般地飞快改动数值，所以一直没有好好学会。再者是因为复杂的程序在我面前，我也不敢随意的改动，所以就让师傅在一旁看着我操作。我的内心还是十分忐忑的。\u003c/p>\u003cimg src=\"assets/yawei/26.jpg\" alt=\"亚威日记第26页\">","dateText":"2021.8.31","text":"今天是我来\"江苏亚威机床股份有限公司\"的第二十二天。\n下午徐涛师傅教我如何修改程序。因为之前只是看着师傅行云流水般地飞快改动数值，所以一直没有好好学会。再者是因为复杂的程序在我面前，我也不敢随意的改动，所以就让师傅在一旁看着我操作。我的内心还是十分忐忑的。","imp":0.55,"at":"2021-08-31T12:00:00","cat":"event","tags":["工作","徐涛","亚威日记"],"related":[],"key":"江苏亚威机床股份有限公司"},{"id":"m176","title":"第二十三天","html":"\u003cp>今天是我来\"江苏亚威机床股份有限公司\"的第二十三天。\u003c/p>\n\u003cp>一早到来，就做了必要（？）的准备工作：开机、回零、MES系统有板（？）、上油（？）。就到了周帮长（？）的安排（？），去C4车间帮助马师傅完成板调，完成时间为一天。\u003c/p>\n\u003cp>起初，在我印象中，板调的都是中小型的工件，从未接触过大型工件。我刚到\"武重（？）大型数控落地镗铣床\"前，就被震住了。又高、又大、又累（？），占地面之大，远超驾驶思考（？）。那边的师傅请让我帮忙\"抬单，把吊带翻身\"。平时再生的吊绳在这面前就是牛毛。好像很让我双手抬，与也能抬，好不容易取来吊绳，又要翻转板上的工件。顿时变高，但记得师傅也先进一步，让我没有时间去思考。\"上山容易下山难\"。完整地处在平板工件下是何等的危险，换（？）一把一米多也会压脚一样。随后不是贴入工件下，这才知道头（？）来个道的重要性。在垫片下不断接触工件时，下层（？）就是被钢平面了。四个角的板调值调了很久，又是千斤顶又是垫片，其实四角装好，机器人需要大汗（？）。好不容易板调完，又是上面的板调，每过千斤顶……一次又一次不断的顶出、卸下、再顶出，在下班前半个小时才真正完成。\u003c/p>\n\u003cp>今天又是充实而又疲劳的一天。\u003c/p>\u003cimg src=\"assets/yawei/27.jpg\" alt=\"亚威日记第27页\">","dateText":"2021.9.1","text":"今天是我来\"江苏亚威机床股份有限公司\"的第二十三天。\n一早到来，就做了必要（？）的准备工作：开机、回零、MES系统有板（？）、上油（？）。就到了周帮长（？）的安排（？），去C4车间帮助马师傅完成板调，完成时间为一天。\n起初，在我印象中，板调的都是中小型的工件，从未接触过大型工件。我刚到\"武重（？）大型数控落地镗铣床\"前，就被震住了。又高、又大、又累（？），占地面之大，远超驾驶思考（？）。那边的师傅请让我帮忙\"抬单，把吊带翻身\"。平时再生的吊绳在这面前就是牛毛。好像很让我双手抬，与也能抬，好不容易取来吊绳，又要翻转板上的工件。顿时变高，但记得师傅也先进一步，让我没有时间去思考。\"上山容易下山难\"。完整地处在平板工件下是何等的危险，换（？）一把一米多也会压脚一样。随后不是贴入工件下，这才知道头（？）来个道的重要性。在垫片下不断接触工件时，下层（？）就是被钢平面了。四个角的板调值调了很久，又是千斤顶又是垫片，其实四角装好，机器人需要大汗（？）。好不容易板调完，又是上面的板调，每过千斤顶……一次又一次不断的顶出、卸下、再顶出，在下班前半个小时才真正完成。\n今天又是充实而又疲劳的一天。","imp":0.55,"at":"2021-09-01T12:00:00","cat":"event","tags":["工作","马师傅","亚威日记"],"related":[],"key":"江苏亚威机床股份有限公司"},{"id":"m177","title":"第二十四天","html":"\u003cp>今天是我来\"江苏亚威机床股份有限公司\"的第二十四天。\u003c/p>\n\u003cp>今天，弓形板工件已经全部加工完毕，又开始加工之前加工过的提琴滑块。这已经是第二次加工这种工件了，大概都有了些印象，熟能生巧。\u003c/p>\n\u003cp>上工件、压垫片、板调，一步到位。就好像有了肌肉记忆（？）一般，驱使着我。\u003c/p>\n\u003cp>清理工件、卸下工件、翻转，可能时不时还会忘记下一步是什么，手上已经不自主地动起来了。\u003c/p>\n\u003cp>一切都在向好的方向发展了！\u003c/p>\u003cimg src=\"assets/yawei/28.jpg\" alt=\"亚威日记第28页\">","dateText":"2021.9.2","text":"今天是我来\"江苏亚威机床股份有限公司\"的第二十四天。\n今天，弓形板工件已经全部加工完毕，又开始加工之前加工过的提琴滑块。这已经是第二次加工这种工件了，大概都有了些印象，熟能生巧。\n上工件、压垫片、板调，一步到位。就好像有了肌肉记忆（？）一般，驱使着我。\n清理工件、卸下工件、翻转，可能时不时还会忘记下一步是什么，手上已经不自主地动起来了。\n一切都在向好的方向发展了！","imp":0.55,"at":"2021-09-02T12:00:00","cat":"event","tags":["工作","亚威日记"],"related":[],"key":"江苏亚威机床股份有限公司"},{"id":"m178","title":"第二十五天","html":"\u003cp>今天是我来\"江苏亚威机床股份有限公司\"的第二十五天。\u003c/p>\n\u003cp>今天上午，张会计就到我们机床上找我，让我和司机师傅去张刚（纲）的分公司领取清洗油和打扫卫生等打扫工具。\u003c/p>\n\u003cp>这也是我第一次上班被外调出去，也是第一次坐上运输的大卡车。我将我激动的心情与司机师傅分享。在路上，我们也聊了很多，我给他们讲了我实习以来的见闻，他们讲起了疫情期间艰苦的旅程。让我认识到：所有人在这世上都不容易，都将为了生活而奔波。我羡慕他们能够驾车踏遍祖国大江南北。在他们眼里，中国各地，也许都像我这没出过省的人眼中的扬州那么大吧。想去哪就去哪。\u003c/p>\n\u003cp>我希望在将来，我也能离开扬州，离开江苏，去别的城市走走看看。\u003c/p>\u003cimg src=\"assets/yawei/29.jpg\" alt=\"亚威日记第29页\">","dateText":"2021.9.3","text":"今天是我来\"江苏亚威机床股份有限公司\"的第二十五天。\n今天上午，张会计就到我们机床上找我，让我和司机师傅去张刚（纲）的分公司领取清洗油和打扫卫生等打扫工具。\n这也是我第一次上班被外调出去，也是第一次坐上运输的大卡车。我将我激动的心情与司机师傅分享。在路上，我们也聊了很多，我给他们讲了我实习以来的见闻，他们讲起了疫情期间艰苦的旅程。让我认识到：所有人在这世上都不容易，都将为了生活而奔波。我羡慕他们能够驾车踏遍祖国大江南北。在他们眼里，中国各地，也许都像我这没出过省的人眼中的扬州那么大吧。想去哪就去哪。\n我希望在将来，我也能离开扬州，离开江苏，去别的城市走走看看。","imp":0.75,"at":"2021-09-03T12:00:00","cat":"event","tags":["工作","亚威日记"],"related":[],"key":"江苏亚威机床股份有限公司"},{"id":"m179","title":"第五周周记","html":"\u003cp>这是我来到\"江苏亚威机床股份有限公司\"的第五周。\u003c/p>\n\u003cp>这一周被外调（？）了两次。一次去C4车间帮助板调，一次是去张刚（纲）的亚威分公司。虽然是在龙门加工和徐涛师傅一同工作，学习加工方面的知识十分之多（？），因为时间真的不多（紧？）。就像王部长所讲的那样（？）：\"合格的技工应该在学徒三天内在师傅的指导下独立加工。\"一个月已经过去了，这让我感到压力。因为也曾听说三个月要单独上操作机床、粗刀、磨刀、碰撞……碰撞倒是小事，如果出现人身安全就要进医院了。\u003c/p>\n\u003cp>这时的压力有必要吗？\u003c/p>\n\u003cp>有人说：\"没有压力就没有动力。\"如果没有限制（？），那只会使学习进度变得十分缓慢，没有了效率就不会有所成就。\u003c/p>\n\u003cp>这样的压力有必要坚持吗？\u003c/p>\n\u003cp>需要。如果连这点苦都吃不下，怎能成大业？如果没有这点压力就受不了（？），怎么能在职业摸索一面（？）？如果说这点考验都克服不了，主人不说（？），直接改行算了。\u003c/p>\n\u003cp>这真的是我想要经历的吗？\u003c/p>\n\u003cp>还不是，还不够。我还年轻，还需要奋斗。要继续保持不会做、第一操作。现在的一切都是困难，如果止步于此，只会困于现状。而现在的工厂，连我一个人都很难生存。还需要学习，还需要努力，去奋斗，去拼搏！\u003c/p>\u003cimg src=\"assets/yawei/30.jpg\" alt=\"亚威日记第30页\">","dateText":"2021.8.30","text":"这是我来到\"江苏亚威机床股份有限公司\"的第五周。\n这一周被外调（？）了两次。一次去C4车间帮助板调，一次是去张刚（纲）的亚威分公司。虽然是在龙门加工和徐涛师傅一同工作，学习加工方面的知识十分之多（？），因为时间真的不多（紧？）。就像王部长所讲的那样（？）：\"合格的技工应该在学徒三天内在师傅的指导下独立加工。\"一个月已经过去了，这让我感到压力。因为也曾听说三个月要单独上操作机床、粗刀、磨刀、碰撞……碰撞倒是小事，如果出现人身安全就要进医院了。\n这时的压力有必要吗？\n有人说：\"没有压力就没有动力。\"如果没有限制（？），那只会使学习进度变得十分缓慢，没有了效率就不会有所成就。\n这样的压力有必要坚持吗？\n需要。如果连这点苦都吃不下，怎能成大业？如果没有这点压力就受不了（？），怎么能在职业摸索一面（？）？如果说这点考验都克服不了，主人不说（？），直接改行算了。\n这真的是我想要经历的吗？\n还不是，还不够。我还年轻，还需要奋斗。要继续保持不会做、第一操作。现在的一切都是困难，如果止步于此，只会困于现状。而现在的工厂，连我一个人都很难生存。还需要学习，还需要努力，去奋斗，去拼搏！","imp":0.7,"at":"2021-09-05T12:00:00","cat":"event","tags":["工作","徐涛","王部长","亚威日记"],"related":[],"key":"江苏亚威机床股份有限公司"},{"id":"m180","title":"第二十六天","html":"\u003cp>今天是我来\"江苏亚威机床股份有限公司\"的第二十六天。\u003c/p>\n\u003cp>随着工件的逐渐完工，徐涛师傅开始教我\"三检制\"。\u003c/p>\n\u003cp>什么是三检制呢？\u003c/p>\n\u003cp>三检制是包括自检、互检和专检。\u003c/p>\n\u003cp>自检就是自己先行检查，发现问题即时改正。\u003c/p>\n\u003cp>互检是在自检后，请隔壁机床的师傅过来二次确认。\u003c/p>\n\u003cp>专检便是请最后专业的检验员进行检查。\u003c/p>\n\u003cp>这三套流程是在完成加工后必不可少的过程。\u003c/p>\u003cimg src=\"assets/yawei/31.jpg\" alt=\"亚威日记第31页\">","dateText":"2021.9.6","text":"今天是我来\"江苏亚威机床股份有限公司\"的第二十六天。\n随着工件的逐渐完工，徐涛师傅开始教我\"三检制\"。\n什么是三检制呢？\n三检制是包括自检、互检和专检。\n自检就是自己先行检查，发现问题即时改正。\n互检是在自检后，请隔壁机床的师傅过来二次确认。\n专检便是请最后专业的检验员进行检查。\n这三套流程是在完成加工后必不可少的过程。","imp":0.55,"at":"2021-09-06T12:00:00","cat":"event","tags":["工作","徐涛","亚威日记"],"related":[],"key":"江苏亚威机床股份有限公司"},{"id":"m181","title":"第二十七天","html":"\u003cp>今天是我来\"江苏亚威机床股份有限公司\"的第二十七天。\u003c/p>\n\u003cp>今天，提琴滑块已经全部完工。接下来是要把比主轴还要大的工件拿来进行加工。这是目前而言，我们所参与加工的最大的产品了。\u003c/p>\n\u003cp>使用行车吊装时，要用两根起吊钢缆，固定四个角。吊起后，打磨底面，再装夹（？）。随后装夹四个角的压板、两头的顶块，保证工件不跑。之后就是板调的工作了。徐涛师傅让我测出平面各点的高度差。这是个新的尝试，从未有过的体验。\u003c/p>\u003cimg src=\"assets/yawei/32.jpg\" alt=\"亚威日记第32页\">","dateText":"2021.9.7","text":"今天是我来\"江苏亚威机床股份有限公司\"的第二十七天。\n今天，提琴滑块已经全部完工。接下来是要把比主轴还要大的工件拿来进行加工。这是目前而言，我们所参与加工的最大的产品了。\n使用行车吊装时，要用两根起吊钢缆，固定四个角。吊起后，打磨底面，再装夹（？）。随后装夹四个角的压板、两头的顶块，保证工件不跑。之后就是板调的工作了。徐涛师傅让我测出平面各点的高度差。这是个新的尝试，从未有过的体验。","imp":0.55,"at":"2021-09-07T12:00:00","cat":"event","tags":["工作","徐涛","亚威日记"],"related":[],"key":"江苏亚威机床股份有限公司"},{"id":"m182","title":"第二十八天","html":"\u003cp>今天是我来\"江苏亚威机床股份有限公司\"的第二十八天。\u003c/p>\n\u003cp>今天一早，张姐就把我叫去办公室，与她的师傅们一起去张纲（刚）领夏季工作服。熟悉的道路、熟悉的工厂，不同的是上一回坐着大卡车，这次是张姐亲自驾车。\u003c/p>\n\u003cp>当我们到达目的地时，还没来多少人，于是我们便帮忙清点数量、开始验货，随后便开始分发衣物。\u003c/p>\n\u003cp>在分发衣物时，可以看到不同颜色的工服。也就是说，把人分成三六九等，这样就能把不同工作的人区分开来。就好像同样是实习生，我是工作车间的工人，而别人却可以是人事、是工艺、是行政。\u003c/p>\n\u003cp>这次的外调并未让我感到开心，反而让我认识到自己又是井底之蛙。外面的世界很精彩，为何当初不曾想过未来。\u003c/p>\u003cimg src=\"assets/yawei/33.jpg\" alt=\"亚威日记第33页\">","dateText":"2021.9.8","text":"今天是我来\"江苏亚威机床股份有限公司\"的第二十八天。\n今天一早，张姐就把我叫去办公室，与她的师傅们一起去张纲（刚）领夏季工作服。熟悉的道路、熟悉的工厂，不同的是上一回坐着大卡车，这次是张姐亲自驾车。\n当我们到达目的地时，还没来多少人，于是我们便帮忙清点数量、开始验货，随后便开始分发衣物。\n在分发衣物时，可以看到不同颜色的工服。也就是说，把人分成三六九等，这样就能把不同工作的人区分开来。就好像同样是实习生，我是工作车间的工人，而别人却可以是人事、是工艺、是行政。\n这次的外调并未让我感到开心，反而让我认识到自己又是井底之蛙。外面的世界很精彩，为何当初不曾想过未来。","imp":0.55,"at":"2021-09-08T12:00:00","cat":"event","tags":["工作","亚威日记"],"related":[],"key":"江苏亚威机床股份有限公司"},{"id":"m183","title":"第二十九天","html":"\u003cp>今天是我来\"江苏亚威机床股份有限公司\"的第二十九天。\u003c/p>\n\u003cp>今天王部长给我安排的任务是\"将车间内主干道所有破损的管线路标（？）换新\"的要求。看似简单，实则工程巨大。但主干道一眼便就能望到头。重复一段又一段能划线的主干道，破损点却多如繁星点点。我初听说这项工作需要调动三四个人才能勉强完工，如今却只出动我一人，让我听起来有些不可思议。\u003c/p>\n\u003cp>看着简单的划线动作，实则……如果只是一段就可以是小事一件。难就难在要一划一划，短短在自己跟前还有很长一段路需要接着划。刚刚所做的可能只是划线长征中的第一步。在内心恐惧的压迫下，可能四百米不到的主干道已被无限放大。\u003c/p>\n\u003cp>除了划线，拆线也是一大难点。两个人也好，如果只是一个人，难度便大大增大。固定在一头，随后把线绑至另一头。如果把拉不好，绳头的固定处便会脱落。让我到了解了团队的重要！不断的蹲地踏下、寻找底座、排布、缠刀……弄得满身。\u003c/p>\n\u003cp>就算每个人什么都干不了，只负责搬运工具也好，但现实却又是我一人。\u003c/p>\n\u003cp>做到最后就是在两端的边缘不断打糙（？）。最后也竟然独自完成了主干道的换新。不多说多少（？），至少一个人完成了常规的多人任务。也不知道王部长满不满意我的工作内容。\u003c/p>\u003cimg src=\"assets/yawei/34.jpg\" alt=\"亚威日记第34页\">","dateText":"2021.9.9","text":"今天是我来\"江苏亚威机床股份有限公司\"的第二十九天。\n今天王部长给我安排的任务是\"将车间内主干道所有破损的管线路标（？）换新\"的要求。看似简单，实则工程巨大。但主干道一眼便就能望到头。重复一段又一段能划线的主干道，破损点却多如繁星点点。我初听说这项工作需要调动三四个人才能勉强完工，如今却只出动我一人，让我听起来有些不可思议。\n看着简单的划线动作，实则……如果只是一段就可以是小事一件。难就难在要一划一划，短短在自己跟前还有很长一段路需要接着划。刚刚所做的可能只是划线长征中的第一步。在内心恐惧的压迫下，可能四百米不到的主干道已被无限放大。\n除了划线，拆线也是一大难点。两个人也好，如果只是一个人，难度便大大增大。固定在一头，随后把线绑至另一头。如果把拉不好，绳头的固定处便会脱落。让我到了解了团队的重要！不断的蹲地踏下、寻找底座、排布、缠刀……弄得满身。\n就算每个人什么都干不了，只负责搬运工具也好，但现实却又是我一人。\n做到最后就是在两端的边缘不断打糙（？）。最后也竟然独自完成了主干道的换新。不多说多少（？），至少一个人完成了常规的多人任务。也不知道王部长满不满意我的工作内容。","imp":0.55,"at":"2021-09-09T12:00:00","cat":"event","tags":["工作","王部长","亚威日记"],"related":[],"key":"江苏亚威机床股份有限公司"},{"id":"m184","title":"第三十天","html":"\u003cp>今天是我来\"江苏亚威机床股份有限公司\"的第三十天。\u003c/p>\n\u003cp>今天原以为是少有的平凡的一天，也正好让自己从昨天的场地劳动里平复一下。\u003c/p>\n\u003cp>大型箱体座工件会消耗大量的时间。从工件上车到板调，可用了近半个小时的时间。\u003c/p>\n\u003cp>在机床运行的期间，徐涛师傅顺便教了我一下简单的程序编写。就像怎么让刀具旋转、刀具路径走各个方向、走各种形状。师傅和我说：\"万变不离其宗。\"又学会了简单的，复杂的也不过是几个简单的叠加在一起罢了。\u003c/p>\u003cimg src=\"assets/yawei/35.jpg\" alt=\"亚威日记第35页\">","dateText":"2021.9.10","text":"今天是我来\"江苏亚威机床股份有限公司\"的第三十天。\n今天原以为是少有的平凡的一天，也正好让自己从昨天的场地劳动里平复一下。\n大型箱体座工件会消耗大量的时间。从工件上车到板调，可用了近半个小时的时间。\n在机床运行的期间，徐涛师傅顺便教了我一下简单的程序编写。就像怎么让刀具旋转、刀具路径走各个方向、走各种形状。师傅和我说：\"万变不离其宗。\"又学会了简单的，复杂的也不过是几个简单的叠加在一起罢了。","imp":0.55,"at":"2021-09-10T12:00:00","cat":"event","tags":["工作","徐涛","亚威日记"],"related":[],"key":"江苏亚威机床股份有限公司"},{"id":"m185","title":"第六周周记","html":"\u003cp>这是我来到\"江苏亚威机床股份有限公司\"的第六周。\u003c/p>\n\u003cp>在离开上一份实习工作的时候，我就对自己说过，等去了亚威，时间够多了一定可以坚持锻炼身体，例如跑步。但现实却是下班一睡就回家躺着，没有任何出门的想法。\u003c/p>\n\u003cp>但在这周四的时候，班组长却将这件事提上（？），让我体验到了久违的成就感（？）。这种感觉让我回想起高中时期坚持跑步锻炼的自己。所以那天晚上，我便迈开自己的脚步出门跑步（？）。我给自己定下三公里的目标。就像王部长强调的死命前进（？），长时间激烈的运动会带来的腿部酸痛、呼吸急促，让我不得不放慢脚步，但不停下。因为我知道，如果中途停了，就很难再继续了。就像王部长见我周四地搞得自己满头通红让我休息一下，而不是让我停下这工作一样。在最后不到一公里时，不耐烦、胆怯、疲惫，觉得时间好长，第一次跑这么远（？）坚持不下去时。但还是要坚持（？），毕竟我已经坚持这么久了。再坚持一会儿会怎么样？就像跑到最后（？），们那里（？），累得重要的调整……保持原来这样已经很好的状态。逼着自己完成最后一套，终于，我成功了。完成了三公里，也完成了目标。虽然可能耗费的时间会长一点，可能不是那么完美，至少也算是完成了。虽然过程很痛苦，但完成之后带来的成就感，让我觉得这一切都值得。\u003c/p>\n\u003cp>生活就如同跑步一样，谁都知道要坚持，谁都明白努力。但成功的都是那些说到做到的人（？）。有的人在痛苦时咬牙坚持，功成冲破；有的人感到痛苦时会崩溃，回归安逸；有的人见是放弃，趁虚而退，再敢薄发？\u003c/p>\n\u003cp>每个人都有个人不同的生存方式，但不变的应是坚持！\u003c/p>\u003cimg src=\"assets/yawei/36.jpg\" alt=\"亚威日记第36页\">","dateText":"2021.9.6","text":"这是我来到\"江苏亚威机床股份有限公司\"的第六周。\n在离开上一份实习工作的时候，我就对自己说过，等去了亚威，时间够多了一定可以坚持锻炼身体，例如跑步。但现实却是下班一睡就回家躺着，没有任何出门的想法。\n但在这周四的时候，班组长却将这件事提上（？），让我体验到了久违的成就感（？）。这种感觉让我回想起高中时期坚持跑步锻炼的自己。所以那天晚上，我便迈开自己的脚步出门跑步（？）。我给自己定下三公里的目标。就像王部长强调的死命前进（？），长时间激烈的运动会带来的腿部酸痛、呼吸急促，让我不得不放慢脚步，但不停下。因为我知道，如果中途停了，就很难再继续了。就像王部长见我周四地搞得自己满头通红让我休息一下，而不是让我停下这工作一样。在最后不到一公里时，不耐烦、胆怯、疲惫，觉得时间好长，第一次跑这么远（？）坚持不下去时。但还是要坚持（？），毕竟我已经坚持这么久了。再坚持一会儿会怎么样？就像跑到最后（？），们那里（？），累得重要的调整……保持原来这样已经很好的状态。逼着自己完成最后一套，终于，我成功了。完成了三公里，也完成了目标。虽然可能耗费的时间会长一点，可能不是那么完美，至少也算是完成了。虽然过程很痛苦，但完成之后带来的成就感，让我觉得这一切都值得。\n生活就如同跑步一样，谁都知道要坚持，谁都明白努力。但成功的都是那些说到做到的人（？）。有的人在痛苦时咬牙坚持，功成冲破；有的人感到痛苦时会崩溃，回归安逸；有的人见是放弃，趁虚而退，再敢薄发？\n每个人都有个人不同的生存方式，但不变的应是坚持！","imp":0.7,"at":"2021-09-12T12:00:00","cat":"event","tags":["工作","王部长","亚威日记"],"related":[],"key":"江苏亚威机床股份有限公司"},{"id":"m186","title":"第三十一天","html":"\u003cp>今天是我来\"江苏亚威机床股份有限公司\"的第三十一天。\u003c/p>\n\u003cp>今天是来车间以来，徐涛师傅最忙碌的一天。也不是事情多、事情杂，而是板调。看似简单的板调，实则大有学问。\u003c/p>\n\u003cp>先是米度方向（？），因为工件很大，所以需要用到抛凳（？），不然人无法接近。\u003c/p>\n\u003cp>又要查来（？），沿着是顺时针方向。因为底座工件本身形状就很奇葩，是大小两个米方形螺槽（？）构成，所以大的要先调好，小的也要。\u003c/p>\n\u003cp>好不容易板调完毕。看着图纸，感觉就不对劲，误差会很大（？）。如果就这样加工，最后的误差会只在尺寸的下偏差了。\u003c/p>\n\u003cp>于是不厌其烦地请徐涛师傅一起，经过大量时间的板调与图纸的校合，终于得出是工件毛坯的问题。也后续找来质检员，反应毛坯的问题。\u003c/p>\n\u003cp>之后，我询问徐涛师傅：\"师傅你可真有耐心。如果我一天都没板调好一个工件，我人都要傻了！\"师傅和我说：\"所以说坚持这个行业的人少了呢（？）。但坚持下去的个个都有本事。就跟打仗一样，拔出来的个个都能打（？）！\"\u003c/p>\n\u003cp>于是，今天一天都在看师傅板调。\u003c/p>\u003cimg src=\"assets/yawei/37.jpg\" alt=\"亚威日记第37页\">","dateText":"2021.9.13","text":"今天是我来\"江苏亚威机床股份有限公司\"的第三十一天。\n今天是来车间以来，徐涛师傅最忙碌的一天。也不是事情多、事情杂，而是板调。看似简单的板调，实则大有学问。\n先是米度方向（？），因为工件很大，所以需要用到抛凳（？），不然人无法接近。\n又要查来（？），沿着是顺时针方向。因为底座工件本身形状就很奇葩，是大小两个米方形螺槽（？）构成，所以大的要先调好，小的也要。\n好不容易板调完毕。看着图纸，感觉就不对劲，误差会很大（？）。如果就这样加工，最后的误差会只在尺寸的下偏差了。\n于是不厌其烦地请徐涛师傅一起，经过大量时间的板调与图纸的校合，终于得出是工件毛坯的问题。也后续找来质检员，反应毛坯的问题。\n之后，我询问徐涛师傅：\"师傅你可真有耐心。如果我一天都没板调好一个工件，我人都要傻了！\"师傅和我说：\"所以说坚持这个行业的人少了呢（？）。但坚持下去的个个都有本事。就跟打仗一样，拔出来的个个都能打（？）！\"\n于是，今天一天都在看师傅板调。","imp":0.55,"at":"2021-09-13T12:00:00","cat":"event","tags":["工作","徐涛","亚威日记"],"related":[],"key":"江苏亚威机床股份有限公司"},{"id":"m187","title":"第三十二天","html":"\u003cp>今天是我来\"江苏亚威机床股份有限公司\"的第三十二天。\u003c/p>\n\u003cp>昨天下午，刘组长（？）派我去C4车间，试看机床，帮助马师傅完成板调。\u003c/p>\n\u003cp>这已经是我第二次帮助马师傅了。交流中没有最初的胆怯，板调的方式方法也渐渐熟练，板调的配合率（成功率？）也大大提高。上次可能一天都没板好，而昨天半天时间就差不多了。\u003c/p>\n\u003cp>板调的方式无非是用百分表打一下平面度。用千斤顶顶起一角，加入垫片，调平千斤顶，再用百分表再打一下平面度，做点或增减垫片，直至平面度在可控范围内，即角完成点，再去板调另一边。\u003c/p>\n\u003cp>但问题却是如果去板调另一边，原本板调好的那边，或多或少会出现偏差。所以在这方面浪费了一些时间。\u003c/p>\u003cimg src=\"assets/yawei/38.jpg\" alt=\"亚威日记第38页\">","dateText":"2021.9.14","text":"今天是我来\"江苏亚威机床股份有限公司\"的第三十二天。\n昨天下午，刘组长（？）派我去C4车间，试看机床，帮助马师傅完成板调。\n这已经是我第二次帮助马师傅了。交流中没有最初的胆怯，板调的方式方法也渐渐熟练，板调的配合率（成功率？）也大大提高。上次可能一天都没板好，而昨天半天时间就差不多了。\n板调的方式无非是用百分表打一下平面度。用千斤顶顶起一角，加入垫片，调平千斤顶，再用百分表再打一下平面度，做点或增减垫片，直至平面度在可控范围内，即角完成点，再去板调另一边。\n但问题却是如果去板调另一边，原本板调好的那边，或多或少会出现偏差。所以在这方面浪费了一些时间。","imp":0.55,"at":"2021-09-14T12:00:00","cat":"event","tags":["工作","马师傅","亚威日记"],"related":[],"key":"江苏亚威机床股份有限公司"},{"id":"m188","title":"第三十三天","html":"\u003cp>今天是我来\"江苏亚威机床股份有限公司\"的第三十三天。\u003c/p>\n\u003cp>今天早上打卡，正好遇到王部长，与王部长微笑打完招呼后，我们简单的了解了一下我未来的工作前景。\u003c/p>\n\u003cp>随后来到车间，开机、回原点，一切如常。\u003c/p>\n\u003cp>在饭后，张姐便打电话问我：\"有没有时间，和我一同去买防暑降温用品。\"\u003c/p>\n\u003cp>这是我第三次乘车去张刚（纲）了，载我们的丁师傅也如愿换了新车。他激动地与我们讲他的新车，说将要买真皮坐垫、脚垫、防晒膜等，就像是自家家里的一样十分爱惜。\u003c/p>\n\u003cp>这次我们领了许多东西：洗衣粉、草纸、手套、口罩、毛巾等等。当我们把劳保用品从张刚运回亚威时，每一位员工师傅都十分的开心。\u003c/p>\n\u003cp>即便枯燥乏味的工作生活，也会有让我感到快乐的小细节。\u003c/p>\u003cimg src=\"assets/yawei/39.jpg\" alt=\"亚威日记第39页\">","dateText":"2021.9.15","text":"今天是我来\"江苏亚威机床股份有限公司\"的第三十三天。\n今天早上打卡，正好遇到王部长，与王部长微笑打完招呼后，我们简单的了解了一下我未来的工作前景。\n随后来到车间，开机、回原点，一切如常。\n在饭后，张姐便打电话问我：\"有没有时间，和我一同去买防暑降温用品。\"\n这是我第三次乘车去张刚（纲）了，载我们的丁师傅也如愿换了新车。他激动地与我们讲他的新车，说将要买真皮坐垫、脚垫、防晒膜等，就像是自家家里的一样十分爱惜。\n这次我们领了许多东西：洗衣粉、草纸、手套、口罩、毛巾等等。当我们把劳保用品从张刚运回亚威时，每一位员工师傅都十分的开心。\n即便枯燥乏味的工作生活，也会有让我感到快乐的小细节。","imp":0.55,"at":"2021-09-15T12:00:00","cat":"event","tags":["工作","王部长","亚威日记"],"related":[],"key":"江苏亚威机床股份有限公司"},{"id":"m189","title":"第三十四天","html":"\u003cp>今天师傅让我单独做操作啦！虽然是很简单的擦盘座，但操作过程十分复杂！\u003c/p>\n\u003cp>看是如初识一样：准备好等高垫块，擦拭干净。\u003c/p>\n\u003cp>然后便是用行车吸盘，吸工件，吊装上车。\u003c/p>\n\u003cp>再用千斤顶将四个角垫垫高。\u003c/p>\n\u003cp>再擦点，用垫块将中央顶实。\u003c/p>\n\u003cp>随后用压板压住两端，露出待加工面。\u003c/p>\n\u003cp>以上都是准备工作，然后就是板调。因为是擦盘座，所以只需要测出三块待加工面哪个最低，保证这两方面有个加工面。\u003c/p>\n\u003cp>①如果是两边其中一端最低：\u003c/p>\n\u003cp>Y轴移动至工件中心。\u003c/p>\n\u003cp>X轴移动，使刀盘在工件上10mm。\u003c/p>\n\u003cp>Z轴缓缓下降，至碰到工件。\u003c/p>\n\u003cp>X轴移动，使刀盘远离工件。\u003c/p>\n\u003cp>X轴移动，使刀盘贴平面，使刀盘露出10mm（？）。\u003c/p>\n\u003cp>Y轴移动，使平面铣平，并输出（？）。\u003c/p>\n\u003cp>Z轴移动-5。\u003c/p>\n\u003cp>Y轴移动，使平面铣平并输出（？）。\u003c/p>\n\u003cp>相对坐标清零。\u003c/p>\n\u003cp>（现在指针表面和做好，相对坐标位置的宽点就可以了。）\u003c/p>\n\u003cp>*如果需要保证点，用百分表打一下平面是否在同一高度。\u003c/p>\n\u003cp>②如果是中间最低：\u003c/p>\n\u003cp>X轴移动至工件中心。\u003c/p>\n\u003cp>Y轴移动，使刀盘在工件上10mm。\u003c/p>\n\u003cp>Z轴缓缓下降，至碰到工件。\u003c/p>\n\u003cp>Y轴移动，使刀盘远离工件。\u003c/p>\n\u003cp>Z轴移动-5\u003c/p>\n\u003cp>Y轴移动，使平面铣平并移出（？）。\u003c/p>\n\u003cp>同时坐标清零。\u003c/p>\u003cimg src=\"assets/yawei/40.jpg\" alt=\"亚威日记第40页\">","dateText":"2021.9.16","text":"今天师傅让我单独做操作啦！虽然是很简单的擦盘座，但操作过程十分复杂！\n看是如初识一样：准备好等高垫块，擦拭干净。\n然后便是用行车吸盘，吸工件，吊装上车。\n再用千斤顶将四个角垫垫高。\n再擦点，用垫块将中央顶实。\n随后用压板压住两端，露出待加工面。\n以上都是准备工作，然后就是板调。因为是擦盘座，所以只需要测出三块待加工面哪个最低，保证这两方面有个加工面。\n①如果是两边其中一端最低：\nY轴移动至工件中心。\nX轴移动，使刀盘在工件上10mm。\nZ轴缓缓下降，至碰到工件。\nX轴移动，使刀盘远离工件。\nX轴移动，使刀盘贴平面，使刀盘露出10mm（？）。\nY轴移动，使平面铣平，并输出（？）。\nZ轴移动-5。\nY轴移动，使平面铣平并输出（？）。\n相对坐标清零。\n（现在指针表面和做好，相对坐标位置的宽点就可以了。）\n*如果需要保证点，用百分表打一下平面是否在同一高度。\n②如果是中间最低：\nX轴移动至工件中心。\nY轴移动，使刀盘在工件上10mm。\nZ轴缓缓下降，至碰到工件。\nY轴移动，使刀盘远离工件。\nZ轴移动-5\nY轴移动，使平面铣平并移出（？）。\n同时坐标清零。","imp":0.75,"at":"2021-09-16T12:00:00","cat":"event","tags":["工作","亚威日记"],"related":[],"key":"江苏亚威机床股份有限公司"},{"id":"m190","title":"第三十五天","html":"\u003cp>今天是我来\"江苏亚威机床股份有限公司\"的第三十五天。\u003c/p>\n\u003cp>今徐涛师傅请假了，就我一个人上班。我早到之后，为了我们厂的安全卫生，将机床好好打扫了一遍，把一些平时来不及打扫的地方冲洗干净。又将杂乱无章的螺母盒与垫片盒清理整理，将之前随手放置的工具放回原位并整理干净。因为师傅不在，今天无需加工，我就将所有刀具按大小型号摆放整齐。\u003c/p>\n\u003cp>随后我就去找到刘文齐组长，看看刘组长有什么需要我帮助的。刘组长便安排我去加一颗切削液。在此之后，我又多打了一颗切削液，顺便也去帮助我的景传鑫师傅和孙子扬师傅，帮他们补加了颗切削液而已。\u003c/p>\n\u003cp>虽然徐涛师傅请假了，但他也会打电话来关心我在厂里的情况。\u003c/p>\n\u003cp>我想我也渐渐习惯了在亚威的生活吧。\u003c/p>\u003cimg src=\"assets/yawei/41.jpg\" alt=\"亚威日记第41页\">","dateText":"2021.9.17","text":"今天是我来\"江苏亚威机床股份有限公司\"的第三十五天。\n今徐涛师傅请假了，就我一个人上班。我早到之后，为了我们厂的安全卫生，将机床好好打扫了一遍，把一些平时来不及打扫的地方冲洗干净。又将杂乱无章的螺母盒与垫片盒清理整理，将之前随手放置的工具放回原位并整理干净。因为师傅不在，今天无需加工，我就将所有刀具按大小型号摆放整齐。\n随后我就去找到刘文齐组长，看看刘组长有什么需要我帮助的。刘组长便安排我去加一颗切削液。在此之后，我又多打了一颗切削液，顺便也去帮助我的景传鑫师傅和孙子扬师傅，帮他们补加了颗切削液而已。\n虽然徐涛师傅请假了，但他也会打电话来关心我在厂里的情况。\n我想我也渐渐习惯了在亚威的生活吧。","imp":0.55,"at":"2021-09-17T12:00:00","cat":"event","tags":["工作","徐涛","景传鑫","孙子扬","刘文齐","亚威日记"],"related":[],"key":"江苏亚威机床股份有限公司"},{"id":"m191","title":"第七周周记","html":"\u003cp>这是我来到\"江苏亚威机床股份有限公司\"的第七周。\u003c/p>\n\u003cp>这周在机床学习的时间不多，但学的知识点还是十分有用的。擦盘座，这是我学得的最简单也是最基础的一部分，也是我第一次亲自独立完成的加工。成就感油然而生还是很轻松，因为太过简单了。要在板调过程中，车间中间的事些都可以随时听到打去板声。像完成独立加工，内心还是久久不能平静。\u003c/p>\n\u003cp>这周在机床学习的时间不多，但外调帮忙、处理后勤的事却有很多。我一直认为不能沦为一名优秀的操作工。我更应该去做技工。做外调，可能是其他工序的技工操作；做外调、喊去帮忙、喊去做另外外的事会不开心、会抱怨。但我却十分享受这些细枝小事带来的感觉。我真的很喜欢打机床、看着整洁的机床，内心也会变得舒畅；我喜欢张贴标识（？），虽然过程繁琐忙碌，但看着原本脏乱的地板看着也格外舒服；我喜欢板调出去帮忙，这可以让我学习到不一样的东西；我喜欢和张姐一起出去采购，回到厂里面，虽然是体力活，但可以锻炼我的能力；我喜欢帮助其他师傅，不管是操作工师傅还是环卫师傅。我喜欢同他们交流，听听他们的故事……我可能已经习惯了这种飘忽不定而随时、充满未知和危险的日子。\u003c/p>\u003cimg src=\"assets/yawei/42.jpg\" alt=\"亚威日记第42页\">","dateText":"2021.9.13","text":"这是我来到\"江苏亚威机床股份有限公司\"的第七周。\n这周在机床学习的时间不多，但学的知识点还是十分有用的。擦盘座，这是我学得的最简单也是最基础的一部分，也是我第一次亲自独立完成的加工。成就感油然而生还是很轻松，因为太过简单了。要在板调过程中，车间中间的事些都可以随时听到打去板声。像完成独立加工，内心还是久久不能平静。\n这周在机床学习的时间不多，但外调帮忙、处理后勤的事却有很多。我一直认为不能沦为一名优秀的操作工。我更应该去做技工。做外调，可能是其他工序的技工操作；做外调、喊去帮忙、喊去做另外外的事会不开心、会抱怨。但我却十分享受这些细枝小事带来的感觉。我真的很喜欢打机床、看着整洁的机床，内心也会变得舒畅；我喜欢张贴标识（？），虽然过程繁琐忙碌，但看着原本脏乱的地板看着也格外舒服；我喜欢板调出去帮忙，这可以让我学习到不一样的东西；我喜欢和张姐一起出去采购，回到厂里面，虽然是体力活，但可以锻炼我的能力；我喜欢帮助其他师傅，不管是操作工师傅还是环卫师傅。我喜欢同他们交流，听听他们的故事……我可能已经习惯了这种飘忽不定而随时、充满未知和危险的日子。","imp":0.7,"at":"2021-09-19T12:00:00","cat":"event","tags":["工作","亚威日记"],"related":[],"key":"江苏亚威机床股份有限公司"},{"id":"m192","title":"第八周周记","html":"\u003cp>学习内容：\u003c/p>\n\u003cp>1. 加工开机前（？），需要先进行低速运转。M03、S1W、擦点进行加工。\u003c/p>\n\u003cp>2. \"三齐\"：机床、工具、工件摆放整齐。\u003c/p>\n\u003cp>3. \"五法（?）\"：地面、机床、工具、工件、员工仪表清洁。\u003c/p>\n\u003cp>4. \"日常关键点\"：①成型区区地面油污处、②班前车辆、③机床四周\u003c/p>\n\u003cp>5. 加工完毕后，需检查刀片是否损坏。如损坏需及时更换。\u003c/p>\n\u003cp>6. 更换刀片时，拧紧之前需要擦拭且干至有吸附感，拧上后，再回旋半圈。\u003c/p>\n\u003cp>强化内容：\u003c/p>\n\u003cp>1. 独立自主（？）完成板调。\u003c/p>\n\u003cp>2. 单独程序会循环，会加工至要求尺寸。\u003c/p>\n\u003cp>3. 机床四周环境的干净卫生。\u003c/p>\n\u003cp>心得体会：由进厂前到现在（？），断断续续，成长类似与工作，让我体会到这份工作的不容易。每一位师傅都坚守在自己的岗位上。他们都会真的喜欢上班吗？在他们的执念点是家庭，是责任。从前不曾有什么乐在其中，都只是其中的责任压力。负重前行罢了！\u003c/p>\u003cimg src=\"assets/yawei/43.jpg\" alt=\"亚威日记第43页\">","dateText":"2021.9.22","text":"学习内容：\n1. 加工开机前（？），需要先进行低速运转。M03、S1W、擦点进行加工。\n2. \"三齐\"：机床、工具、工件摆放整齐。\n3. \"五法（?）\"：地面、机床、工具、工件、员工仪表清洁。\n4. \"日常关键点\"：①成型区区地面油污处、②班前车辆、③机床四周\n5. 加工完毕后，需检查刀片是否损坏。如损坏需及时更换。\n6. 更换刀片时，拧紧之前需要擦拭且干至有吸附感，拧上后，再回旋半圈。\n强化内容：\n1. 独立自主（？）完成板调。\n2. 单独程序会循环，会加工至要求尺寸。\n3. 机床四周环境的干净卫生。\n心得体会：由进厂前到现在（？），断断续续，成长类似与工作，让我体会到这份工作的不容易。每一位师傅都坚守在自己的岗位上。他们都会真的喜欢上班吗？在他们的执念点是家庭，是责任。从前不曾有什么乐在其中，都只是其中的责任压力。负重前行罢了！","imp":0.7,"at":"2021-09-30T12:00:00","cat":"event","tags":["工作","亚威日记"],"related":[],"key":"江苏亚威机床股份有限公司"},{"id":"m193","title":"周记 · 刀具刀片更换","html":"\u003cp>学习内容：\u003c/p>\n\u003cp>1. 刀具刀片的更换时间：切削加工时出现频繁火花，一般为两个循环程序后换刀片。\u003c/p>\n\u003cp>2. 更换刀具刀片的技巧：先将刀片贴合到位，再上螺丝。保证刀具与刀片无缝隙；拧上螺丝后再拧1/4圈，保证松紧程度。\u003c/p>\n\u003cp>3. 常见故障：一般为缺油、松动。\u003c/p>\n\u003cp>强化内容：\u003c/p>\n\u003cp>1. 独立卸装工件，上下车平稳。\u003c/p>\n\u003cp>2. 准确无误更换刀片。\u003c/p>\n\u003cp>3. 工装工具摆放指定位置。\u003c/p>\n\u003cp>心得体会：三个月就要到了。说实话，加工工件的前置任务和完工后的应急处理学的比较多，比较全面，也都并非空口说法（？），都有实际操作、发现问题、改正问题。但机床操作一块需要提升的还有很多。机床板调一直是较大的难点，也暂时找不到应对的方法，十分基础（困难？）。\u003c/p>\u003cimg src=\"assets/yawei/44.jpg\" alt=\"亚威日记第44页\">","dateText":"","text":"学习内容：\n1. 刀具刀片的更换时间：切削加工时出现频繁火花，一般为两个循环程序后换刀片。\n2. 更换刀具刀片的技巧：先将刀片贴合到位，再上螺丝。保证刀具与刀片无缝隙；拧上螺丝后再拧1/4圈，保证松紧程度。\n3. 常见故障：一般为缺油、松动。\n强化内容：\n1. 独立卸装工件，上下车平稳。\n2. 准确无误更换刀片。\n3. 工装工具摆放指定位置。\n心得体会：三个月就要到了。说实话，加工工件的前置任务和完工后的应急处理学的比较多，比较全面，也都并非空口说法（？），都有实际操作、发现问题、改正问题。但机床操作一块需要提升的还有很多。机床板调一直是较大的难点，也暂时找不到应对的方法，十分基础（困难？）。","imp":0.65,"at":"2021-10-08T12:00:00","cat":"event","tags":["工作","亚威日记"],"related":[],"key":"江苏亚威机床股份有限公司"},{"id":"m194","title":"周记 · 弓型板/箱板/三轴","html":"\u003cp>学习内容：1. 弓型板的找正板调。\u003c/p>\n\u003cp>2. 箱板的找正板调。\u003c/p>\n\u003cp>3. 三轴的找正板调。\u003c/p>\n\u003cp>4. 箱板的加工。\u003c/p>\n\u003cp>强化内容：\u003c/p>\n\u003cp>1. 箱板：1）找正板调 2）更改程序（？） 3）手轮撞刀（？）\u003c/p>\n\u003cp>2. 刀具使用寿命过多（将到？）时，备份程序检查后。\u003c/p>\n\u003cp>3. 坐标系的分类（G54—G59、EXT）与更改。\u003c/p>\n\u003cp>4. 看图纸定位置。\u003c/p>\n\u003cp>心得体会：结束了去外省的考试，完成了学习生涯的最后一站。接下来便是一心投入工作当中。这周学习了很多理论（实操？）知识。在此特别感谢王部长，解开我的心结，让我勇敢面对困难，面对内心的恐惧。也感谢景传鑫师傅和孙子扬师傅在我陷入迷茫时拉我一把。最感谢的还是我的徐涛师傅，一直从来对我的关心和照顾，将知识毫无保留地传授给我。\u003c/p>\n\u003cp>在今后的日子里，我还需要更加努力、勤奋、刻苦。只有将学到的知识运用起来，将书本的知识运用起来，这才能够成就大业！\u003c/p>\u003cimg src=\"assets/yawei/45.jpg\" alt=\"亚威日记第45页\">","dateText":"","text":"学习内容：1. 弓型板的找正板调。\n2. 箱板的找正板调。\n3. 三轴的找正板调。\n4. 箱板的加工。\n强化内容：\n1. 箱板：1）找正板调 2）更改程序（？） 3）手轮撞刀（？）\n2. 刀具使用寿命过多（将到？）时，备份程序检查后。\n3. 坐标系的分类（G54—G59、EXT）与更改。\n4. 看图纸定位置。\n心得体会：结束了去外省的考试，完成了学习生涯的最后一站。接下来便是一心投入工作当中。这周学习了很多理论（实操？）知识。在此特别感谢王部长，解开我的心结，让我勇敢面对困难，面对内心的恐惧。也感谢景传鑫师傅和孙子扬师傅在我陷入迷茫时拉我一把。最感谢的还是我的徐涛师傅，一直从来对我的关心和照顾，将知识毫无保留地传授给我。\n在今后的日子里，我还需要更加努力、勤奋、刻苦。只有将学到的知识运用起来，将书本的知识运用起来，这才能够成就大业！","imp":0.65,"at":"2021-10-22T12:00:00","cat":"event","tags":["工作","徐涛","景传鑫","孙子扬","王部长","亚威日记"],"related":[],"key":"江苏亚威机床股份有限公司"},{"id":"m195","title":"周记 · 箱盖","html":"\u003cp>学习内容：1. 箱盖的装夹。\u003c/p>\n\u003cp>2. 箱盖的板调。\u003c/p>\n\u003cp>3. 箱盖的加工。\u003c/p>\n\u003cp>4. 程序的修改。\u003c/p>\n\u003cp>强化内容：1. 装夹的顺序与其中内涵（？）。\u003c/p>\n\u003cp>2. 板调时的技巧。\u003c/p>\n\u003cp>3. 程序的暂停与重启。\u003c/p>\n\u003cp>4. 刀片的及时更换。\u003c/p>\n\u003cp>心得体会：这一周主要是加工T15（？）F316L箱盖。熟悉了加工的流程、加工的方式、刀具转速和寿命、注意事项等。独立自主地完成了一块的加工。大致了解，但还不熟。如果师傅不在一旁监督、指导，还是会出一些细节上的问题。但往往这些问题会引发巨大的错误。就比如：小数点、漏点、错点、XY轴未分清、正负轴不分、单位未换动、程序错误调用、刀具到达寿命未及时更换等。这些都是我加工当中留意到的问题。更可怕的是那些，我未知和我没遇到的错误。虽然说（？）错误多了不好，但发现问题、避免损坏、解决问题、处理问题的方式方法、心态，也是我需要学习的方面。\u003c/p>\u003cimg src=\"assets/yawei/46.jpg\" alt=\"亚威日记第46页\">","dateText":"","text":"学习内容：1. 箱盖的装夹。\n2. 箱盖的板调。\n3. 箱盖的加工。\n4. 程序的修改。\n强化内容：1. 装夹的顺序与其中内涵（？）。\n2. 板调时的技巧。\n3. 程序的暂停与重启。\n4. 刀片的及时更换。\n心得体会：这一周主要是加工T15（？）F316L箱盖。熟悉了加工的流程、加工的方式、刀具转速和寿命、注意事项等。独立自主地完成了一块的加工。大致了解，但还不熟。如果师傅不在一旁监督、指导，还是会出一些细节上的问题。但往往这些问题会引发巨大的错误。就比如：小数点、漏点、错点、XY轴未分清、正负轴不分、单位未换动、程序错误调用、刀具到达寿命未及时更换等。这些都是我加工当中留意到的问题。更可怕的是那些，我未知和我没遇到的错误。虽然说（？）错误多了不好，但发现问题、避免损坏、解决问题、处理问题的方式方法、心态，也是我需要学习的方面。","imp":0.65,"at":"2021-11-05T12:00:00","cat":"event","tags":["工作","亚威日记"],"related":[],"key":"江苏亚威机床股份有限公司"},{"id":"m196","title":"周记 · 塞尺","html":"\u003cp>学习内容：塞尺的品种。\u003c/p>\n\u003cp>（图示：0.02/0.05mm规格；0.1mm（0.02~1mm）；0.15mm；0.5mm；1mm~5mm）\u003c/p>\n\u003cp>强化内容：箱盖的加工。塞尺的使用。\u003c/p>\n\u003cp>心得体会：这一周还是加工箱盖的一周，周而复始，没有变化。大概是对这份工作的新鲜感的褪去，不再像从前那样对于一切都好奇。也许每一位初入社会的学子都会有一瞬的心理变化吧。\u003c/p>\n\u003cp>记录生活一直都是我的兴趣。我会时不时回想我过去二十年中有趣的趣味。别人有记录在手机里，我想哪天当我老了，可以翻出来回味回味。\u003c/p>\n\u003cp>但从来没有记录的耐心。如果生活变成一份工作、一项任务，我最终将会被渐渐磨灭。不断的循环重复，做一件事情的时候，就不会感到无聊和枯燥吗？\u003c/p>\n\u003cp>正因在阅历打了年纪（？），如同写作到了（？），为了记录生命中的美好，这是一种感悟到他人、了解到社会的认识，不断提升成长……\u003c/p>\n\u003cp>2021.11.30（？）\u003c/p>\u003cimg src=\"assets/yawei/47.jpg\" alt=\"亚威日记第47页\">","dateText":"","text":"学习内容：塞尺的品种。\n（图示：0.02/0.05mm规格；0.1mm（0.02~1mm）；0.15mm；0.5mm；1mm~5mm）\n强化内容：箱盖的加工。塞尺的使用。\n心得体会：这一周还是加工箱盖的一周，周而复始，没有变化。大概是对这份工作的新鲜感的褪去，不再像从前那样对于一切都好奇。也许每一位初入社会的学子都会有一瞬的心理变化吧。\n记录生活一直都是我的兴趣。我会时不时回想我过去二十年中有趣的趣味。别人有记录在手机里，我想哪天当我老了，可以翻出来回味回味。\n但从来没有记录的耐心。如果生活变成一份工作、一项任务，我最终将会被渐渐磨灭。不断的循环重复，做一件事情的时候，就不会感到无聊和枯燥吗？\n正因在阅历打了年纪（？），如同写作到了（？），为了记录生命中的美好，这是一种感悟到他人、了解到社会的认识，不断提升成长……\n2021.11.30（？）","imp":0.65,"at":"2021-11-15T12:00:00","cat":"event","tags":["工作","亚威日记"],"related":[],"key":"江苏亚威机床股份有限公司"},{"id":"m197","title":"周记 · 弓型板板调（附续页）","html":"\u003cp>学习内容：弓型板的板调。\u003c/p>\n\u003cp>强化内容：弓型板的加工。行车（天车）的进阶使用。\u003c/p>\n\u003cp>心得体会：留给我的时间不多了！掰掰手指都能算出自己还有几周便要出师了。不能再这样浑浑噩噩。\u003c/p>\n\u003cp>进步需要目标。但一口吃不成胖子。目标得实际、缓缓一点、贴近现实一点。我也想有多有利，赚大钱，所有人都敬重我。但现在最主要的是\"能够存活\"。这才是我这些日子里为之奋斗的目标。\u003c/p>\n\u003cp>①这份工作是为了生存吗？\u003c/p>\n\u003cp>我觉得世界上十全十美满意的工作和丰厚的报酬是不可能同时存在的。所以既然我不讨厌这份工作，且向回报，不管是物质回报还是精神收获，我想我会坚持下去。\u003c/p>\n\u003cp>②上班工作的状态应该是什么样子？\u003c/p>\n\u003cp>我还是实习生，应有正式工师傅们那样老练。所以我要积极一点，重比能分秒不负的工作状态更加勤奋。\u003c/p>\n\u003cp>③为了谁干？\u003c/p>\n\u003cp>这看上去是个很简单的回答，为了自己干。但事实真的如此吗？我回想到，也有和我父亲讲过工作上的事情，是会连及自己、工作态度应该怎样。为了谁而干，我有了家庭的理念。为了自己干，因为我没有压力，没有负担。但从后（现在？）呢？等我结婚了（？），便是为了伴侣更好地生活。等有了孩子，便是为了孩子的吃喝拉撒。\u003c/p>\n\u003cp>（下半，接下页）都是体力而工作。等为了房了车，便是为了房贷车贷而工作。在岁月的流逝中，总会因为小简单而感到后悔。到那时就已经不是为了自己了吗？或许就为了心吧。就像我现在如果能说的那样，以前生活条件不好，我吃喝，如果我喝酒，他们想我抽烟吗？他们是吃不饱穿暖吗？我不是大老粗，做生意的，难道家庭的负担都是从嘴里省下来的。所以工作真的只是为了自己吗？也许不是，是为了自己，也不全是为了自己。也可能慢慢了解了顶梁柱的责任感。乘能好好承担起这份沉甸甸的担子。\u003c/p>\u003cimg src=\"assets/yawei/48.jpg\" alt=\"亚威日记第48页\">\u003cimg src=\"assets/yawei/49.jpg\" alt=\"亚威日记第49页\">","dateText":"","text":"学习内容：弓型板的板调。\n强化内容：弓型板的加工。行车（天车）的进阶使用。\n心得体会：留给我的时间不多了！掰掰手指都能算出自己还有几周便要出师了。不能再这样浑浑噩噩。\n进步需要目标。但一口吃不成胖子。目标得实际、缓缓一点、贴近现实一点。我也想有多有利，赚大钱，所有人都敬重我。但现在最主要的是\"能够存活\"。这才是我这些日子里为之奋斗的目标。\n①这份工作是为了生存吗？\n我觉得世界上十全十美满意的工作和丰厚的报酬是不可能同时存在的。所以既然我不讨厌这份工作，且向回报，不管是物质回报还是精神收获，我想我会坚持下去。\n②上班工作的状态应该是什么样子？\n我还是实习生，应有正式工师傅们那样老练。所以我要积极一点，重比能分秒不负的工作状态更加勤奋。\n③为了谁干？\n这看上去是个很简单的回答，为了自己干。但事实真的如此吗？我回想到，也有和我父亲讲过工作上的事情，是会连及自己、工作态度应该怎样。为了谁而干，我有了家庭的理念。为了自己干，因为我没有压力，没有负担。但从后（现在？）呢？等我结婚了（？），便是为了伴侣更好地生活。等有了孩子，便是为了孩子的吃喝拉撒。\n（下半，接下页）都是体力而工作。等为了房了车，便是为了房贷车贷而工作。在岁月的流逝中，总会因为小简单而感到后悔。到那时就已经不是为了自己了吗？或许就为了心吧。就像我现在如果能说的那样，以前生活条件不好，我吃喝，如果我喝酒，他们想我抽烟吗？他们是吃不饱穿暖吗？我不是大老粗，做生意的，难道家庭的负担都是从嘴里省下来的。所以工作真的只是为了自己吗？也许不是，是为了自己，也不全是为了自己。也可能慢慢了解了顶梁柱的责任感。乘能好好承担起这份沉甸甸的担子。","imp":0.7,"at":"2021-11-22T12:00:00","cat":"event","tags":["工作","亚威日记"],"related":[],"key":"江苏亚威机床股份有限公司"},{"id":"m198","title":"周记 · G16/G81/G83/G84 编程笔记","html":"\u003cp>学习内容：G16、精（？）随机循环、Q指点为Y轴进刀。\u003c/p>\n\u003cp>G81、钻孔循环。（直接到底——直接到底？）\u003c/p>\n\u003cp>G83、啄进钻孔循环。Q指点为Z轴进刀（递进进给？）\u003c/p>\n\u003cp>G84、攻螺纹循环。\u003c/p>\n\u003cp>（编程示例，蓝字注释照录：）\u003c/p>\n\u003cp>G17 G90 G59 G0 Z200.0；——初始平面/绝对坐标/工件坐标/换刀 Z200\u003c/p>\n\u003cp>X0 Y0；——快速移动至X0,Y0\u003c/p>\n\u003cp>M3 S600；——主轴正转，转速600\u003c/p>\n\u003cp>M8；——切削液开（开启）\u003c/p>\n\u003cp>Z5.0；——快速移动至Z5（安全高度）\u003c/p>\n\u003cp>G1 Z-0.5 F200；——进给切削（下刀具），到Z-0.5开始钻，进给量200\u003c/p>\n\u003cp>#9=0；——变量初始点为0\u003c/p>\n\u003cp>N9 G90 G0 Y#9；——结束程序段号9/绝对坐标/快速，Y变量\u003c/p>\n\u003cp>G1 X-2340. F600；——进给切削/至X-2340/进给量600\u003c/p>\n\u003cp>G91 G0 Z20；——相对坐标，抬刀Z20\u003c/p>\n\u003cp>G90 X0；——绝对坐标，快移X0\u003c/p>\n\u003cp>G91 G0 Z-20；——相对坐标，快移Z-20\u003c/p>\n\u003cp>#9=#9+116.0；——下一次变量值为原变量值上加116.0\u003c/p>\n\u003cp>IF [#9 LE 1160.0] GOTO 9；——如果循环（变量？）的程序段小于（不大于）1160，就返回至程序段9（不大于）\u003c/p>\n\u003cp>G90 G0 Z200.0；——绝对坐标，抬刀Z200\u003c/p>\n\u003cp>M0（M30？）；——程序停止\u003c/p>\n\u003cp>gt 大于　ge 大于等于　eq 等于　ne 不等于　le 小于等于　lt 小于\u003c/p>\u003cimg src=\"assets/yawei/50.jpg\" alt=\"亚威日记第50页\">","dateText":"","text":"学习内容：G16、精（？）随机循环、Q指点为Y轴进刀。\nG81、钻孔循环。（直接到底——直接到底？）\nG83、啄进钻孔循环。Q指点为Z轴进刀（递进进给？）\nG84、攻螺纹循环。\n（编程示例，蓝字注释照录：）\nG17 G90 G59 G0 Z200.0；——初始平面/绝对坐标/工件坐标/换刀 Z200\nX0 Y0；——快速移动至X0,Y0\nM3 S600；——主轴正转，转速600\nM8；——切削液开（开启）\nZ5.0；——快速移动至Z5（安全高度）\nG1 Z-0.5 F200；——进给切削（下刀具），到Z-0.5开始钻，进给量200\n#9=0；——变量初始点为0\nN9 G90 G0 Y#9；——结束程序段号9/绝对坐标/快速，Y变量\nG1 X-2340. F600；——进给切削/至X-2340/进给量600\nG91 G0 Z20；——相对坐标，抬刀Z20\nG90 X0；——绝对坐标，快移X0\nG91 G0 Z-20；——相对坐标，快移Z-20\n#9=#9+116.0；——下一次变量值为原变量值上加116.0\nIF [#9 LE 1160.0] GOTO 9；——如果循环（变量？）的程序段小于（不大于）1160，就返回至程序段9（不大于）\nG90 G0 Z200.0；——绝对坐标，抬刀Z200\nM0（M30？）；——程序停止\ngt 大于　ge 大于等于　eq 等于　ne 不等于　le 小于等于　lt 小于","imp":0.65,"at":"2021-11-26T12:00:00","cat":"event","tags":["工作","亚威日记"],"related":[],"key":"江苏亚威机床股份有限公司"},{"id":"m199","title":"周记 · 板调/修改/加工 · 材料编码","html":"\u003cp>强化内容：板调\u003c/p>\n\u003cp>修改\u003c/p>\n\u003cp>加工\u003c/p>\n\u003cp>材料编码：9Wro（？）HJ W42\u003c/p>\n\u003cp>心得体会：这周的上手机床明显比之前几个月要多很多。\u003c/p>\n\u003cp>不只是板调工件、修改程序、更换刀具刀片、加工步骤（？）、还是工装上下车与翻转。\u003c/p>\n\u003cp>学习了铣平板的大面（？），周而复始的程序，也有挺多学问。\u003c/p>\n\u003cp>学习了看懂程序，明白程序每一步都代表着什么。看懂每一步都要使用的刀具。\u003c/p>\n\u003cp>学习了也除了入门的G90、G91、G94（？）、G01、G55-G59之外的进阶G指令，明白它们的意思与工作方式。\u003c/p>\n\u003cp>学无止境，每天都会有新的知识等着我。不管是（？）我还不了解、不知道、不清楚的，还是那些之前有接触但被遗忘的，都需要好好对待。\u003c/p>\n\u003cp>因为这一周，王部长没有给我提出思考题。但原本我也试图给自己提一点思考问题，结果……限于自身知识的储备不足，以及应对的人生阅历，还未达到能自己提出思考题的地步。所以我很期待王部长下一次你能提出的人生哲学问题。也好让我能在人生道路、工作岗位上走得更直、更正确。\u003c/p>\u003cimg src=\"assets/yawei/51.jpg\" alt=\"亚威日记第51页\">","dateText":"","text":"强化内容：板调\n修改\n加工\n材料编码：9Wro（？）HJ W42\n心得体会：这周的上手机床明显比之前几个月要多很多。\n不只是板调工件、修改程序、更换刀具刀片、加工步骤（？）、还是工装上下车与翻转。\n学习了铣平板的大面（？），周而复始的程序，也有挺多学问。\n学习了看懂程序，明白程序每一步都代表着什么。看懂每一步都要使用的刀具。\n学习了也除了入门的G90、G91、G94（？）、G01、G55-G59之外的进阶G指令，明白它们的意思与工作方式。\n学无止境，每天都会有新的知识等着我。不管是（？）我还不了解、不知道、不清楚的，还是那些之前有接触但被遗忘的，都需要好好对待。\n因为这一周，王部长没有给我提出思考题。但原本我也试图给自己提一点思考问题，结果……限于自身知识的储备不足，以及应对的人生阅历，还未达到能自己提出思考题的地步。所以我很期待王部长下一次你能提出的人生哲学问题。也好让我能在人生道路、工作岗位上走得更直、更正确。","imp":0.65,"at":"2021-12-03T12:00:00","cat":"event","tags":["工作","王部长","亚威日记"],"related":[],"key":"江苏亚威机床股份有限公司"},{"id":"m200","title":"转正心得 · 来亚威的第140天","html":"\u003cp>强化内容：\u003c/p>\n\u003cp>心得体会：\u003c/p>\n\u003cp>这是我站在\"江苏亚威机床股份有限公司\"的第140天，我也已经完成了在亚威工作阶段的独立（？）第一步。从下周开始，我将不会再与徐涛师傅一同度过每周的40小时。我原本以为这是最后一周会很难度（熬？），会很正式、舍不得。但这一切却是在平凡的四天才就这样度过了。即便到周末的最后一天，也只是想象中最平常的一天那样，开始与结束。\u003c/p>\n\u003cp>\"时间过得太快了\"。这不光光是感叹，也是深深的懊悔（遗憾？）。\u003c/p>\n\u003cp>一百四十天，转瞬飞逝，回头望去还能回忆起刚刚毕业，充满期待与敬畏地踏入亚威的大门。亚威不仅仅是一所（所？）用劳动力获取经济的工厂，它对于我而言，更像是一所大学。它接纳每一个渴望学习的人，无论是学习的流程、手段，还是与人交往的方式，是开拓视野、是思考人生。它像一位伟大的母亲，不会计较孩子的脚步多么沉重、多么频繁，都会愿意给孩子第二次机会。转眼间便要自己独自工作了。在接到通知的那一天起，时间开始变快了。8小时，转眼间就过去了。原本觉得枯燥的日子，那个扒着看着时间过的日子，如今我却祈求它过得慢点吧，再慢点吧。我还有太多太多事情要去做，太多太多事需要学习。往远的地方看去，2021年已接近了尾声。扪心自问一下，这一年我都有什么收获？没有。稀里糊涂毕了业，去了一家学历受限（？）的企业，在那里虚度了半年。勤工俭学（？），去扬州参加本科（？）考试，却没了音讯。八月辞去工作，进入亚威，一边学习一边工作。白天工作，晚上学习（？），勤勤恳恳。最应工具（？），最终以比死亡线（？）高出20分（？）的成绩，成功录取。但也花费了我三个月宝贵的复习时间。这值得吗？不知道。不同水平的人有不同的看法，在没有高学历也没好工作的人看来……\u003c/p>\n\u003cp>这或许是一座敲门砖（？）。在有高学历、却没好工作的人看来，这种小文凭大可不必（？）。在有高学历、也没好工作的人看来，可能也觉得大可不必。在仅有高学历、却有好工作的人看来，这也完全没有必要。人生在世的终极目标就是为了钱。有了钱才能去考虑别的问题。高考一分可以超越千人，我这学历也许也能超越少数没本金的大专吧。金钱也好，学历也罢，世间万事万物，只有你拥有了，才能说它不重要。如今事到如此，我的终极目标便是抓紧每天上班的8小时，尽可能多的利用到工作中，少做无用功，避免差错（？）、将错误最小化。良好的开端是成功的一半。\u003c/p>\n\u003cp>---\u003c/p>\u003cimg src=\"assets/yawei/52.jpg\" alt=\"亚威日记第52页\">\u003cimg src=\"assets/yawei/53.jpg\" alt=\"亚威日记第53页\">","dateText":"2021.12.19","text":"强化内容：\n心得体会：\n这是我站在\"江苏亚威机床股份有限公司\"的第140天，我也已经完成了在亚威工作阶段的独立（？）第一步。从下周开始，我将不会再与徐涛师傅一同度过每周的40小时。我原本以为这是最后一周会很难度（熬？），会很正式、舍不得。但这一切却是在平凡的四天才就这样度过了。即便到周末的最后一天，也只是想象中最平常的一天那样，开始与结束。\n\"时间过得太快了\"。这不光光是感叹，也是深深的懊悔（遗憾？）。\n一百四十天，转瞬飞逝，回头望去还能回忆起刚刚毕业，充满期待与敬畏地踏入亚威的大门。亚威不仅仅是一所（所？）用劳动力获取经济的工厂，它对于我而言，更像是一所大学。它接纳每一个渴望学习的人，无论是学习的流程、手段，还是与人交往的方式，是开拓视野、是思考人生。它像一位伟大的母亲，不会计较孩子的脚步多么沉重、多么频繁，都会愿意给孩子第二次机会。转眼间便要自己独自工作了。在接到通知的那一天起，时间开始变快了。8小时，转眼间就过去了。原本觉得枯燥的日子，那个扒着看着时间过的日子，如今我却祈求它过得慢点吧，再慢点吧。我还有太多太多事情要去做，太多太多事需要学习。往远的地方看去，2021年已接近了尾声。扪心自问一下，这一年我都有什么收获？没有。稀里糊涂毕了业，去了一家学历受限（？）的企业，在那里虚度了半年。勤工俭学（？），去扬州参加本科（？）考试，却没了音讯。八月辞去工作，进入亚威，一边学习一边工作。白天工作，晚上学习（？），勤勤恳恳。最应工具（？），最终以比死亡线（？）高出20分（？）的成绩，成功录取。但也花费了我三个月宝贵的复习时间。这值得吗？不知道。不同水平的人有不同的看法，在没有高学历也没好工作的人看来……\n\n这或许是一座敲门砖（？）。在有高学历、却没好工作的人看来，这种小文凭大可不必（？）。在有高学历、也没好工作的人看来，可能也觉得大可不必。在仅有高学历、却有好工作的人看来，这也完全没有必要。人生在世的终极目标就是为了钱。有了钱才能去考虑别的问题。高考一分可以超越千人，我这学历也许也能超越少数没本金的大专吧。金钱也好，学历也罢，世间万事万物，只有你拥有了，才能说它不重要。如今事到如此，我的终极目标便是抓紧每天上班的8小时，尽可能多的利用到工作中，少做无用功，避免差错（？）、将错误最小化。良好的开端是成功的一半。\n\n---","imp":0.95,"at":"2021-12-19T12:00:00","cat":"event","tags":["工作","徐涛","亚威日记"],"related":[],"key":"江苏亚威机床股份有限公司"},{"id":"m201","title":"雏鹰计划DAY1","html":"\u003cp>关于AI实践之问题解决工作坊培训的心得体会。\u003c/p>\n\u003cp>今天是本次雏鹰计划学习的第一站，也是内容密度很高，知识点很扎实，挑战性很强的一课。在此由衷感谢杨总细致深入的拆解与讲解，在我们探索具体问题陷入瓶颈，思路受阻时，及时给予关键引导，让我们得以拨开迷雾、继续推进思考。\u003c/p>\n\u003cp>今天学习的内容很多，干货满满。了解了什么才是真正的问题，TBP的十大意识和八大步骤等。令我印象最为深刻的是杨总带着我们一起分析“找到真因”的环节。杨总也是金句频频“问题暴露的环节，不是问题出错的环节。” 在讨论实际问题时，我们很容易不自觉地将原因归咎于某个部门或某个人，却忽略了流程与系统层面的根本问题。这一点在真实工作中尤为常见，面对失误和纰漏，我们常常下意识地指责负责该项目的同事，却很少换位思考，就比如如果换作自己处理，是否也会面临同样的困境与迷茫，也会出现相同的失误和纰漏。这种跳出个体，回归系统的视角，为我看待问题打开了全新思路。希望制作一个怎样的具体工具来帮助提高工作效率。\u003c/p>\n\u003cp>我想做的工具：一个“会长大”的SOP网站。\u003c/p>\n\u003cp>在杨总今天讲课之前，我已经初步接触过AI辅助日常工作。我的工作内容很杂，从准入到采购、从销售到后勤，流程多而重复。我意识到，一套标准的SOP能在卡壳时帮到我，于是开始用Excel整理。但问题很快来了：字数越来越多，真到需要找对应文本时手忙脚乱，很难及时定位，大大违背了初衷。我把这个烦恼告诉了AI，它建议我用GitHub搭建一个自己的网站。这样一来，不仅解决了Excel误删、失效、跨电脑无法工作的隐患，还能让内容永久保存，随时访问。于是在AI的帮助下，我逐渐把SOP搬了过去。我对网站搭建并不在行，都是在不断和AI磨合中，才做出了现在的“半成品”。\u003c/p>\n\u003cp>今天杨总的一句话点醒了我：“经验是发现的第一障碍。”我们的工作流程都是固定的，从老员工那里学来就是这样的，久而久之，就失去了反向思维、反逻辑思考的能力。这让我开始思考有没有更方便。更快捷的办法达到同样的目的，所以我希望把网站进一步改进：连接Excel、连接邮箱，了解网站，让数据自动同步，任务自动流转，更快更高效地完成工作。举个我已经实现的例子，以前合并多个表格，需要打开所有表格、全选、复制、粘贴，表格一多就很慢。但通过AI协助下的Python等工具，在不打开表格的前提下就能完成合并，大大缩短了流程时间。\u003c/p>\n\u003cp>这就是我想做的工具，一个能连接数据、自动流转、持续生长的SOP网站。也是我的workbuddy！\u003c/p>","dateText":"2026.9.13","text":"关于AI实践之问题解决工作坊培训的心得体会。\n今天是本次雏鹰计划学习的第一站，也是内容密度很高，知识点很扎实，挑战性很强的一课。在此由衷感谢杨总细致深入的拆解与讲解，在我们探索具体问题陷入瓶颈，思路受阻时，及时给予关键引导，让我们得以拨开迷雾、继续推进思考。\n今天学习的内容很多，干货满满。了解了什么才是真正的问题，TBP的十大意识和八大步骤等。令我印象最为深刻的是杨总带着我们一起分析“找到真因”的环节。杨总也是金句频频“问题暴露的环节，不是问题出错的环节。” 在讨论实际问题时，我们很容易不自觉地将原因归咎于某个部门或某个人，却忽略了流程与系统层面的根本问题。这一点在真实工作中尤为常见，面对失误和纰漏，我们常常下意识地指责负责该项目的同事，却很少换位思考，就比如如果换作自己处理，是否也会面临同样的困境与迷茫，也会出现相同的失误和纰漏。这种跳出个体，回归系统的视角，为我看待问题打开了全新思路。希望制作一个怎样的具体工具来帮助提高工作效率。\n\n我想做的工具：一个“会长大”的SOP网站。\n在杨总今天讲课之前，我已经初步接触过AI辅助日常工作。我的工作内容很杂，从准入到采购、从销售到后勤，流程多而重复。我意识到，一套标准的SOP能在卡壳时帮到我，于是开始用Excel整理。但问题很快来了：字数越来越多，真到需要找对应文本时手忙脚乱，很难及时定位，大大违背了初衷。我把这个烦恼告诉了AI，它建议我用GitHub搭建一个自己的网站。这样一来，不仅解决了Excel误删、失效、跨电脑无法工作的隐患，还能让内容永久保存，随时访问。于是在AI的帮助下，我逐渐把SOP搬了过去。我对网站搭建并不在行，都是在不断和AI磨合中，才做出了现在的“半成品”。\n今天杨总的一句话点醒了我：“经验是发现的第一障碍。”我们的工作流程都是固定的，从老员工那里学来就是这样的，久而久之，就失去了反向思维、反逻辑思考的能力。这让我开始思考有没有更方便。更快捷的办法达到同样的目的，所以我希望把网站进一步改进：连接Excel、连接邮箱，了解网站，让数据自动同步，任务自动流转，更快更高效地完成工作。举个我已经实现的例子，以前合并多个表格，需要打开所有表格、全选、复制、粘贴，表格一多就很慢。但通过AI协助下的Python等工具，在不打开表格的前提下就能完成合并，大大缩短了流程时间。\n这就是我想做的工具，一个能连接数据、自动流转、持续生长的SOP网站。也是我的workbuddy！","imp":0.8,"at":"2026-09-13T12:00:00","cat":"event","tags":["工作","培训","杨总"],"related":[],"key":"中集同创浦江（上海）贸易有限公司"},{"id":"m203","title":"雏鹰计划DAY2","html":"\u003cp>上午在宁波中集，最戳我的一句话是“生产的淡季就是管理的黄金淡季”。我也有我自己的理解，我的工作节奏也是这样，每个月20号到次月10号左右正是钢厂下订单的旺季，那个阶段基本就是连轴转，能把货按时订出去就不错了，根本顾不上想有没有更好，更快捷的办法。但11号到19号这段时间，相对没那么急，以前我可能会松一口气，放放松。但现在我意识到，这段时间其实就是我的黄金淡季。我如果能在这些天把SOP网站优化好、把AI工具用顺，那等到下个月旺季来的时候，我的效率就会更高，反过来这也给我腾出更多时间去优化技术，这是一个正循环。\u003c/p>\n\u003cp>另外，也是宁波中集的标语“没有落后的传统产业，只有落后的产业传统”。今天在集装箱产线上看到平均60秒就下线一台集装箱，这个效率本身已经让我很震撼了。但更让我觉得厉害的是，快是一回事，好又是另一回事。能做到又快又好，还能落地全自动化生产，背后肯定有很多管理者反复提建议、不断优化。我觉得“快”其实不难，难的是“快的同时还好”。\u003c/p>\n\u003cp>还有一个小细节，就是他们连食堂都做了改善。一个小小的食堂，也有同事在想办法优化，这种氛围我挺触动的，因为不是每个人都有机会做大项目，但每个人都能在自己的岗位上做点小改善。\u003c/p>\n\u003cp>下午在宁波宝新，让我感触比较深的是，产品树上有九十多种牌号，这些牌号其实不是凭空冒出来的，每一个都对应着钢厂发展的一段历史，一个客户的需求。从汽车装饰条到电梯面板，从厨电内胆到火箭壳体，一卷钢材最后去了哪里、变成了什么，出现在我们生活中的哪些地方，今天算是真正串起来了一回。看到这些材料最后都跟我们的生活息息相关，这种感觉还是挺奇妙的。\u003c/p>","dateText":"2026.9.14","text":"上午在宁波中集，最戳我的一句话是“生产的淡季就是管理的黄金淡季”。我也有我自己的理解，我的工作节奏也是这样，每个月20号到次月10号左右正是钢厂下订单的旺季，那个阶段基本就是连轴转，能把货按时订出去就不错了，根本顾不上想有没有更好，更快捷的办法。但11号到19号这段时间，相对没那么急，以前我可能会松一口气，放放松。但现在我意识到，这段时间其实就是我的黄金淡季。我如果能在这些天把SOP网站优化好、把AI工具用顺，那等到下个月旺季来的时候，我的效率就会更高，反过来这也给我腾出更多时间去优化技术，这是一个正循环。\n另外，也是宁波中集的标语“没有落后的传统产业，只有落后的产业传统”。今天在集装箱产线上看到平均60秒就下线一台集装箱，这个效率本身已经让我很震撼了。但更让我觉得厉害的是，快是一回事，好又是另一回事。能做到又快又好，还能落地全自动化生产，背后肯定有很多管理者反复提建议、不断优化。我觉得“快”其实不难，难的是“快的同时还好”。\n还有一个小细节，就是他们连食堂都做了改善。一个小小的食堂，也有同事在想办法优化，这种氛围我挺触动的，因为不是每个人都有机会做大项目，但每个人都能在自己的岗位上做点小改善。\n下午在宁波宝新，让我感触比较深的是，产品树上有九十多种牌号，这些牌号其实不是凭空冒出来的，每一个都对应着钢厂发展的一段历史，一个客户的需求。从汽车装饰条到电梯面板，从厨电内胆到火箭壳体，一卷钢材最后去了哪里、变成了什么，出现在我们生活中的哪些地方，今天算是真正串起来了一回。看到这些材料最后都跟我们的生活息息相关，这种感觉还是挺奇妙的。","imp":0.55,"at":"2026-09-14T12:00:00","cat":"event","tags":["工作","培训"],"related":[],"key":"中集同创浦江（上海）贸易有限公司"},{"id":"m204","title":"雏鹰计划DAY3","html":"\u003cp>今天上午从宁波坐高铁到无锡，下午参观了无锡宝创。在此之前，我也是被公司受邀，跟总部风控的吕家亮总和林源总一起，参加过几次和我们公司合作仓库的飞检工作。当时可能是我先入为主，觉得各个仓库的表现也好，整体堆放也好，都还算可以。但两位风控领导看了之后都表示不太满意。我当时心里还犯嘀咕：怎么样才算可以？这个答案，今天终于来到了我的面前。走进宝创加工中心的整个现场，我脑子里就一个词“漂亮”。不是那种视觉上的花哨，而是感觉整个产线像是一个活生生的孩子，在现场各位师傅的细心呵护下茁壮成长。\u003c/p>\n\u003cp>宝创历史悠久，可以说是见证了钢材行业的黄金时代。但按照陈宇总的话来说，以前那种倒手卖提单就能发财的日子，一去不复返了。他说，我们做的是一个哑铃型的工作，两头粗，中间细。钢厂和客户，两头都得罪不起，两头受气。但如果没有中间这根细杆，两头就连接不起来。这个比喻我印象特别深，因为我做业务助理，很多时候就是这根细杆，对接客户、对接内部、对接仓库、对接钢厂，哪个环节都少不了，而且哪个环节都不敢得罪。\u003c/p>\n\u003cp>最后，陈宇总对AI也有他自己独到的理解。大家都在说AI会淘汰人工，但为什么我们都要拥抱AI，而不是抵制AI，原因很简单，只有对自己工作真正了解的人，才知道自己做什么，才知道想让AI帮自己做什么。学会用AI来帮我们，不用总想着AI抢我们饭碗，把AI当成我们的workbuddy来用，这才是科技改变生活。\u003c/p>","dateText":"2026.9.15","text":"今天上午从宁波坐高铁到无锡，下午参观了无锡宝创。在此之前，我也是被公司受邀，跟总部风控的吕家亮总和林源总一起，参加过几次和我们公司合作仓库的飞检工作。当时可能是我先入为主，觉得各个仓库的表现也好，整体堆放也好，都还算可以。但两位风控领导看了之后都表示不太满意。我当时心里还犯嘀咕：怎么样才算可以？这个答案，今天终于来到了我的面前。走进宝创加工中心的整个现场，我脑子里就一个词“漂亮”。不是那种视觉上的花哨，而是感觉整个产线像是一个活生生的孩子，在现场各位师傅的细心呵护下茁壮成长。\n宝创历史悠久，可以说是见证了钢材行业的黄金时代。但按照陈宇总的话来说，以前那种倒手卖提单就能发财的日子，一去不复返了。他说，我们做的是一个哑铃型的工作，两头粗，中间细。钢厂和客户，两头都得罪不起，两头受气。但如果没有中间这根细杆，两头就连接不起来。这个比喻我印象特别深，因为我做业务助理，很多时候就是这根细杆，对接客户、对接内部、对接仓库、对接钢厂，哪个环节都少不了，而且哪个环节都不敢得罪。\n最后，陈宇总对AI也有他自己独到的理解。大家都在说AI会淘汰人工，但为什么我们都要拥抱AI，而不是抵制AI，原因很简单，只有对自己工作真正了解的人，才知道自己做什么，才知道想让AI帮自己做什么。学会用AI来帮我们，不用总想着AI抢我们饭碗，把AI当成我们的workbuddy来用，这才是科技改变生活。","imp":0.6,"at":"2026-09-15T12:00:00","cat":"event","tags":["工作","培训","吕家亮","林源","陈宇"],"related":[],"key":"中集同创浦江（上海）贸易有限公司"},{"id":"m205","title":"雏鹰计划DAY4","html":"\u003cp>今天上午跟着曹艺凡总学习了绿钢的相关知识。在此之前我并不了解绿钢是什么，我以为是一种新的钢的品种，经过这次学习才知道，绿钢其实是一种新型的加工手段，是一个非常前沿的平台。这也很好地对应了前几天学习的“没有落后的传统产业，只有落后的产业传统”。每当我们认为钢铁行业快要饱和的时候，就会出现新的手段和工序，继续延续钢铁行业的寿命。今天也学习了很多专业术语，不管是各种国际认证，还是各个钢厂目前绿钢的规划。\u003c/p>\n\u003cp>下午我们重温了中集的历史，也着重讲了几个非常经典的故事：为何选择在蛇口成立，为什么“922”这么重要，从起初的裁员，到后来集装箱的比拼，再到后来和德国比拼的登机桥、采集可燃冰。这些内容在今天的课件里可能只有一个小时左右的时间，但背后确实是一代代前辈呕心沥血的努力，才有了我们的今天。我们要不忘初心，牢记使命。\u003c/p>\n\u003cp>让我记忆犹新的是，中集当年也不是一帆风顺的，在今天的学习中提到一个细节，中集旗下有一家公司当年因为专利没保护好，直接丢掉了美国市场，后来上市也因此错过了机会。中集后来为什么坚持把每一项产品都争取做成冠军产品，不是为了拿奖，是为了保护自己，因为制造业一旦被抄袭，损失就是巨大的。所以说前辈们每踩的一个坑，都在提醒我们，专利和创新一定要无比重视。\u003c/p>","dateText":"2026.9.16","text":"今天上午跟着曹艺凡总学习了绿钢的相关知识。在此之前我并不了解绿钢是什么，我以为是一种新的钢的品种，经过这次学习才知道，绿钢其实是一种新型的加工手段，是一个非常前沿的平台。这也很好地对应了前几天学习的“没有落后的传统产业，只有落后的产业传统”。每当我们认为钢铁行业快要饱和的时候，就会出现新的手段和工序，继续延续钢铁行业的寿命。今天也学习了很多专业术语，不管是各种国际认证，还是各个钢厂目前绿钢的规划。\n下午我们重温了中集的历史，也着重讲了几个非常经典的故事：为何选择在蛇口成立，为什么“922”这么重要，从起初的裁员，到后来集装箱的比拼，再到后来和德国比拼的登机桥、采集可燃冰。这些内容在今天的课件里可能只有一个小时左右的时间，但背后确实是一代代前辈呕心沥血的努力，才有了我们的今天。我们要不忘初心，牢记使命。\n让我记忆犹新的是，中集当年也不是一帆风顺的，在今天的学习中提到一个细节，中集旗下有一家公司当年因为专利没保护好，直接丢掉了美国市场，后来上市也因此错过了机会。中集后来为什么坚持把每一项产品都争取做成冠军产品，不是为了拿奖，是为了保护自己，因为制造业一旦被抄袭，损失就是巨大的。所以说前辈们每踩的一个坑，都在提醒我们，专利和创新一定要无比重视。","imp":0.55,"at":"2026-09-16T12:00:00","cat":"event","tags":["工作","培训","曹艺凡"],"related":[],"key":"中集同创浦江（上海）贸易有限公司"},{"id":"m206","title":"雏鹰计划DAY5","html":"\u003cp>今天上午走进了上海钢加的加工产线，我最大的感受是，做业务，不能只局限于自己手上的工作，更要懂得上下游的需求和要求。从容的面对每一个问题和困难。听完林伟通总跟我们的分享，让我最印象深刻的话就是“你对加工工艺越了解，客户就越信任你”。比如钢材的成材率怎么算，损耗怎么控，那些尺寸能加工，那些尺寸不能加工，遇到特殊天气如何保障钢卷的安全等，这些看起来都是细枝末节的事情，但其实每一个都市影响客户的成本和体验。鱼不只是卖钢材，更是做服务，做细节，做信任。\u003c/p>\n\u003cp>下午我们在钱吉总和余涛总的带领下更细致的了解了钢材贸易的风险和意义。钢材贸易看起来只是简单的一买一卖，但其中的非常有学问，钢卷从钢厂出来，进过贸易商，服务商，最后到终端客户，每个环节都存在相应的痛点。而我们做贸易的，只有解决了上游的痛点，或下游的痛点，这才是我们最有意义最有意义的工作。今天的学习也是让我对自己的工作有了更深的了解，不光光只是做单子发发货，更重要的是做到懂得钢厂的需求，懂得客户的需求。\u003c/p>","dateText":"2026.9.17","text":"今天上午走进了上海钢加的加工产线，我最大的感受是，做业务，不能只局限于自己手上的工作，更要懂得上下游的需求和要求。从容的面对每一个问题和困难。听完林伟通总跟我们的分享，让我最印象深刻的话就是“你对加工工艺越了解，客户就越信任你”。比如钢材的成材率怎么算，损耗怎么控，那些尺寸能加工，那些尺寸不能加工，遇到特殊天气如何保障钢卷的安全等，这些看起来都是细枝末节的事情，但其实每一个都市影响客户的成本和体验。鱼不只是卖钢材，更是做服务，做细节，做信任。\n下午我们在钱吉总和余涛总的带领下更细致的了解了钢材贸易的风险和意义。钢材贸易看起来只是简单的一买一卖，但其中的非常有学问，钢卷从钢厂出来，进过贸易商，服务商，最后到终端客户，每个环节都存在相应的痛点。而我们做贸易的，只有解决了上游的痛点，或下游的痛点，这才是我们最有意义最有意义的工作。今天的学习也是让我对自己的工作有了更深的了解，不光光只是做单子发发货，更重要的是做到懂得钢厂的需求，懂得客户的需求。","imp":0.55,"at":"2026-09-17T12:00:00","cat":"event","tags":["工作","培训","林伟通","钱吉","余涛"],"related":[],"key":"中集同创浦江（上海）贸易有限公司"},{"id":"m207","title":"职场加速营DAY1","html":"\u003cp>我是来自上海中集同创的施俊辰。首先由衷感谢公司为我提供此次宝贵的学习平台，让我有幸结识众多新同事，也收获了诸多实用的职场新知识。\u003c/p>\n\u003cp>首日的学习令我受益匪浅，老师讲解的want、can、should分析方法，帮我把日常工作中遇到的各类问题进行了全面细化梳理，再结合时间管理四象限法则对工作任务分类梳理，让我清晰地认清了自身长期以来的工作短板与不足。\u003c/p>\n\u003cp>在此之前，我一直拘泥在自己的工作舒适圈里，安于完成本职事务。而经过今天的系统学习，我彻底转变了固有想法。今后我会在扎实掌握现有工作、夯实业务能力的基础上，主动跳出舒适圈，积极迎接并主动承揽领导安排的各项新任务、新挑战，不断突破自我！\u003c/p>","dateText":"2026.4.10","text":"我是来自上海中集同创的施俊辰。首先由衷感谢公司为我提供此次宝贵的学习平台，让我有幸结识众多新同事，也收获了诸多实用的职场新知识。\n首日的学习令我受益匪浅，老师讲解的want、can、should分析方法，帮我把日常工作中遇到的各类问题进行了全面细化梳理，再结合时间管理四象限法则对工作任务分类梳理，让我清晰地认清了自身长期以来的工作短板与不足。\n在此之前，我一直拘泥在自己的工作舒适圈里，安于完成本职事务。而经过今天的系统学习，我彻底转变了固有想法。今后我会在扎实掌握现有工作、夯实业务能力的基础上，主动跳出舒适圈，积极迎接并主动承揽领导安排的各项新任务、新挑战，不断突破自我！","imp":0.5,"at":"2026-04-10T12:00:00","cat":"event","tags":["工作","培训"],"related":[],"key":"中集同创浦江（上海）贸易有限公司"},{"id":"m208","title":"职场加速营DAY2","html":"\u003cp>大家好，我是来自上海中集同创的施俊辰。当我第一天拿到情商报告时，我就预感到自己的分数在组里是最低的。经过两天的学习，我也清晰地感受到，无论是工作协作还是日常沟通，我和组内伙伴之间都存在不小的差距。\u003c/p>\n\u003cp>原本我以为自己会因此感到沮丧，甚至担心跟不上大家的节奏，但相处下来，我真切感受到了大家的包容与照顾，在此由衷地感谢“金粉世加”里每一位伙伴！\u003c/p>\n\u003cp>在课程中，通过萌萌老师的讲解，我也更深刻地认识到了自己在职场上的不足。过去我总想着待在舒适圈里走完职业生涯，可在当下的经济大环境下，我们不得不直面新的挑战。这次来深圳的学习，对我而言就是开启未来职业生涯至关重要的一块敲门砖。人际交往能力、问题解决能力，都是我目前最需要提升的部分。此外今后我会更主动地觉察自己的内心感受，梳理不同阶段的真实情绪，而不是一味地封闭自己。\u003c/p>\n\u003cp>经过这两天的学习与收获，我也更加期待也更加珍惜接下来两天的课程！\u003c/p>","dateText":"2026.4.11","text":"大家好，我是来自上海中集同创的施俊辰。当我第一天拿到情商报告时，我就预感到自己的分数在组里是最低的。经过两天的学习，我也清晰地感受到，无论是工作协作还是日常沟通，我和组内伙伴之间都存在不小的差距。\n原本我以为自己会因此感到沮丧，甚至担心跟不上大家的节奏，但相处下来，我真切感受到了大家的包容与照顾，在此由衷地感谢“金粉世加”里每一位伙伴！\n在课程中，通过萌萌老师的讲解，我也更深刻地认识到了自己在职场上的不足。过去我总想着待在舒适圈里走完职业生涯，可在当下的经济大环境下，我们不得不直面新的挑战。这次来深圳的学习，对我而言就是开启未来职业生涯至关重要的一块敲门砖。人际交往能力、问题解决能力，都是我目前最需要提升的部分。此外今后我会更主动地觉察自己的内心感受，梳理不同阶段的真实情绪，而不是一味地封闭自己。\n经过这两天的学习与收获，我也更加期待也更加珍惜接下来两天的课程！","imp":0.6,"at":"2026-04-11T12:00:00","cat":"event","tags":["工作","培训","萌萌老师"],"related":[],"key":"中集同创浦江（上海）贸易有限公司"},{"id":"m209","title":"职场加速营DAY3","html":"\u003cp>我是来自上海中集同创的施俊辰。通过今天的学习，我对职场乃至生活中人际关系的分类:运作关系、决策关系和成长关系有了更系统的认知。在此之前，我从未意识到人际关系可以拆解、梳理得如此细致。\u003c/p>\n\u003cp>今天的课程也让我学会了多维度换位思考，更敏锐地体察对方当下的感受与情绪，同时深刻认识到，轻易给人贴标签会极大阻碍真诚和顺畅的沟通。此外，情感账户这一概念也让我深受启发。\u003c/p>\n\u003cp>这几天学习下来，我最大的感受就是思路变得通透了。原来工作以来遇到的诸多场景与困惑，都有对应的专业解读和体系化方法，可以通过刻意练习持续提升。这也让我更加体会到情商提升的重要性，相信这些收获将在我未来的工作中带来切实帮助与便利！\u003c/p>","dateText":"2026.4.12","text":"我是来自上海中集同创的施俊辰。通过今天的学习，我对职场乃至生活中人际关系的分类:运作关系、决策关系和成长关系有了更系统的认知。在此之前，我从未意识到人际关系可以拆解、梳理得如此细致。\n今天的课程也让我学会了多维度换位思考，更敏锐地体察对方当下的感受与情绪，同时深刻认识到，轻易给人贴标签会极大阻碍真诚和顺畅的沟通。此外，情感账户这一概念也让我深受启发。\n这几天学习下来，我最大的感受就是思路变得通透了。原来工作以来遇到的诸多场景与困惑，都有对应的专业解读和体系化方法，可以通过刻意练习持续提升。这也让我更加体会到情商提升的重要性，相信这些收获将在我未来的工作中带来切实帮助与便利！","imp":0.5,"at":"2026-04-12T12:00:00","cat":"event","tags":["工作","培训"],"related":[],"key":"中集同创浦江（上海）贸易有限公司"},{"id":"m210","title":"职场加速营DAY4","html":"\u003cp>我是来自上海中集同创的施俊辰。今天是本次学习的最后一堂课，也是内容密度最高，知识点最扎实，挑战性最强的一课。由衷感谢Lily老师细致深入的拆解与讲解，在我们探索具体问题陷入瓶颈，思路受阻时，及时给予关键引导，让我们得以拨开迷雾、继续推进思考。\u003c/p>\n\u003cp>令我印象最为深刻的是5why分析环节。在讨论实际问题时，我们很容易不自觉地将原因归咎于某个部门或某个人，却忽略了流程与系统层面的根本问题。这一点在真实工作中尤为常见，面对失误和纰漏，我们常常下意识地指责负责该项目的同事，却很少换位思考，就比如如果换作自己处理，是否也会面临同样的困境与迷茫，也会出现相同的失误和纰漏。这种跳出个体，回归系统的视角，为我看待问题打开了全新思路。\u003c/p>\n\u003cp>这几天的学习内容，不仅能直接运用在工作中，在未来的生活里我也会有意无意的用所学方法去观察，去分析和解决问题。此次深圳之行收获的成长与启发珍贵而无价，更让我久违地重温了专注纯粹的校园学习氛围！\u003c/p>","dateText":"2026.4.13","text":"我是来自上海中集同创的施俊辰。今天是本次学习的最后一堂课，也是内容密度最高，知识点最扎实，挑战性最强的一课。由衷感谢Lily老师细致深入的拆解与讲解，在我们探索具体问题陷入瓶颈，思路受阻时，及时给予关键引导，让我们得以拨开迷雾、继续推进思考。\n令我印象最为深刻的是5why分析环节。在讨论实际问题时，我们很容易不自觉地将原因归咎于某个部门或某个人，却忽略了流程与系统层面的根本问题。这一点在真实工作中尤为常见，面对失误和纰漏，我们常常下意识地指责负责该项目的同事，却很少换位思考，就比如如果换作自己处理，是否也会面临同样的困境与迷茫，也会出现相同的失误和纰漏。这种跳出个体，回归系统的视角，为我看待问题打开了全新思路。\n这几天的学习内容，不仅能直接运用在工作中，在未来的生活里我也会有意无意的用所学方法去观察，去分析和解决问题。此次深圳之行收获的成长与启发珍贵而无价，更让我久违地重温了专注纯粹的校园学习氛围！","imp":0.55,"at":"2026-04-13T12:00:00","cat":"event","tags":["工作","培训","Lily老师"],"related":[],"key":"中集同创浦江（上海）贸易有限公司"},{"id":"m213","title":"职场加速营心得报告","html":"\u003cp>本人于2026年4月10日至2026年4月13日参加了集团总部组织的职场加速营第15期培训。为期四天的学习，围绕《握好职场方向盘》《职场情商自我修炼》《管理合作与沟通》《问题分析与解决》四个模块展开，课程涵盖了许多实用的工作理念与工具方法，让我受益匪浅。在此，衷心感谢集团总部提供如此优秀的学习平台，感谢同创浦江钱总给予我参加培训的机会，感谢同创浦江同事们的支持，感谢深圳同创总部家贝姐和明轩姐的热情接待，感谢中集学苑各位老师的倾囊相授，也感谢“金粉世加”小组及全体同学的关照与陪伴。\u003c/p>\n\u003cp>第一天的课程帮助我重新审视了自己的工作习惯。此前，我习惯于将工作重心放在职责范围内的任务执行上，较少主动争取额外的工作或挑战。婷婷老师讲授的“want、can、should”分析方法寻找自己的“心流”，使我能够对日常工作中的模糊问题进行系统性拆解。结合时间管理四象限法则，我清晰地认识到自己长期将大量精力投入到紧急但不重要的事务中，而忽视了真正有利于长期成长的工作内容。基于当天的学习，我明确了自己后续的改进方向：在保证现有任务高质量完成的前提下，主动跳出惯性思维，积极承接新的工作任务与挑战，逐步拓展个人能力边界。\u003c/p>\n\u003cp>第二天的课程聚焦于情商能力评估与发展。培训前，我已预感到自己在情商多个维度上可能存在短板。实际报告结果印证了这一判断，无论是在团队协作还是日常沟通中，我都能感受到自己与周围同事之间的差距。但让我印象深刻的是，小组内的每一位伙伴并未因此对我产生距离，反而给予了充分的理解与支持。这种包容让我放下了心理防备，也更愿意直面自身的不足。通过萌萌老师的讲解，我认识到人际互动与问题解决的能力是我当前最需要提升的方向。今后，我会更主动地觉察自身情绪状态，逐步建立起对内心感受的梳理习惯，而非一味封闭自己。\u003c/p>\n\u003cp>第三天的课程围绕人际关系管理展开。栗子老师将职场及生活中的人际关系系统性地划分为“运作关系”“策略关系”“成长关系”三类。这一分析框架此前我从未接触过，它让我意识到，人与人之间的连接并非不可捉摸，而是可以被系统梳理和管理的。此外，“情感账户”这一概念也给我留下了深刻印象。日常沟通中的每一次互动，都是在为彼此的关系存入或支出信任。轻易给人贴标签或忽视对方感受，往往会在不知不觉中透支关系账户。这一天的学习让我体会到，原来工作中遇到的许多困惑，都有对应的专业解读和方法论支撑。通过刻意练习，情商能力是可以被持续提升的。\u003c/p>\n\u003cp>第四天的课程是本次培训内容密度最高，挑战性最强的一天。Lily老师在我们小组讨论问题思路受阻时给予的关键引导，让我受益匪浅。其中对我冲击最大的，是5why分析法的应用。在日常工作中，当出现失误或纰漏时，我们往往本能地将原因归咎于某个部门或某个人。然而，通过连续追问“为什么”，问题根源往往会指向流程设计、信息传递、职责划分等系统层面的因素，而非个体疏忽。这种跳出个体，回归系统的视角，为我看待问题打开了全新的思路。同时，MECE树、5W2H分析法等工具也为我提供了更结构化的思考路径，使我在面对复杂任务时，不再只能凭感觉摸索，而是可以按照清晰的方法论进行拆解与执行。\u003c/p>\n\u003cp>此次深圳之行，给我留下了深刻的回忆。我收获的不仅是知识和方法论，更是一次对自身工作方式和思维习惯的系统梳理。我平时不是一个善于用语言表达内心的人，此次培训让我有机会接触到许多有趣又有话题的同龄人，也在远离家的地方感受到了真诚的温暖。我将把本次培训的学习成果落实到日常工作中，持续改进，不负期望！\u003c/p>\n\u003cp>施俊辰\u003c/p>","dateText":"2026.4.10-4.13","text":"本人于2026年4月10日至2026年4月13日参加了集团总部组织的职场加速营第15期培训。为期四天的学习，围绕《握好职场方向盘》《职场情商自我修炼》《管理合作与沟通
