<!doctype html>
<!-- ============================================================
     02、开屏动画 · 动画页入口（index.html 是目录入口的约定名，不能改）
     - 它只干一件事：搭好舞台，然后加载 1.动画播放器.js 开始播放
     - 样式在 5.动画页样式.css
     - 平时不直接访问它，主页会用 iframe 把它整屏盖住播放
     ============================================================ -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#04070a" />
    <title>开屏动画 · 支援未来</title>
    <meta name="description" content="站点开屏动画，播放结束后自动进入主页。" />
    <!-- 被主页以 iframe 嵌入播放，不需要被搜索引擎单独收录 -->
    <meta name="robots" content="noindex" />
    <link rel="stylesheet" href="./5.动画页样式.css" />
  </head>
  <body>
    <main id="stage-scaler" aria-label="开场动画，逻辑分辨率 1920 × 1080">
      <div id="stage"></div>
    </main>

    <!-- 纯黑幕：资源就绪前挡住未就绪的画面（不放文字，就一块黑屏） -->
    <div id="loading" role="status" aria-label="载入中"></div>

    <script type="module" src="./1.动画播放器.js"></script>
  </body>
</html>
