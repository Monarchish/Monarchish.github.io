<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>思想钢印</title>
<meta name="description" content="思想钢印：把经验编译成可无脑执行的指令序列">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2313140e'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='%23f4f3e8' font-family='serif'%3E%E9%92%A2%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css?v=6">
</head>
<body>

<aside class="rail" id="rail">
  <div class="rail-top">
    <a class="brand" href="../index.html" title="返回主页">思想钢印<span>THOUGHT CONTROL</span></a>
    <div class="rail-meta" id="railMeta"></div>
  </div>

  <label class="search">
    <input id="q" type="text" placeholder="搜索动作、单据、口径" autocomplete="off" spellcheck="false">
    <kbd>/</kbd>
  </label>

  <nav class="tree" id="tree"></nav>

  <div class="rail-nav">
    <button class="nv" data-view="docs"><span>单据索引</span><i id="nvDocs"></i></button>
    <button class="nv" data-view="terms"><span>口径</span><i id="nvTerms"></i></button>
    <button class="nv" data-view="manifesto"><span>纲要</span></button>
    <button class="nv" data-view="audit"><span>完备度自检</span></button>
  </div>
</aside>

<main class="main">
  <header class="topbar">
    <button class="menu" id="menuBtn">目录</button>
    <div class="crumb" id="crumb"></div>
    <span class="spacer"></span>
    <span class="stat" id="tbStat"></span>
    <button class="act" id="runBtn">执行模式</button>
  </header>
  <div class="scroll" id="view"></div>
</main>

<div class="sp" id="sp"></div>
<div class="run" id="run" hidden></div>
<div class="toast" id="toast"></div>

<script src="data.js?v=4"></script>
<script src="app.js?v=5"></script>
</body>
</html>
