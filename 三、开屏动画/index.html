<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#04070a" />
    <title>开屏动画 · 支援未来</title>
    <meta name="description" content="站点开屏动画，播放结束后自动进入主页。" />
    <!-- 被主页以 iframe 嵌入播放，不需要被搜索引擎单独收录 -->
    <meta name="robots" content="noindex" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="stage-scaler" aria-label="开场动画，逻辑分辨率 1920 × 1080">
      <div id="stage"></div>
    </main>

    <div id="loading" role="status">正在载入动画资源…</div>
    <button id="audio-toggle" class="is-hidden" type="button" aria-pressed="false">解除静音</button>

    <section id="controls" class="is-hidden" aria-label="动画控制">
      <button id="replay" type="button" title="重播（R）">重播</button>
      <button id="frame-back" type="button" title="上一帧（←）">−1</button>
      <button id="play" type="button" title="播放或暂停（空格）">播放</button>
      <button id="frame-forward" type="button" title="下一帧（→）">+1</button>
      <input id="timeline" type="range" min="0" value="0" aria-label="动画帧" />
      <output id="time-label">000 / 390 · 0.00s</output>
    </section>

    <script type="module" src="./app.js"></script>
  </body>
</html>
