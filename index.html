<!DOCTYPE html>
<!-- ============================================================
     站点入口（index.html 是 GitHub Pages 的首页约定名，不能改）

     仓库结构：
       01、支援未来/    文档正文（.md），改内容只动这里
       02、开屏动画/    站点打开时的开场动画（平时不用动）
       03、设置/        主页的功能代码与样式（导航清单在这里）

     本文件本身只做三件事：搭主页骨架、引 03、设置/ 的代码与样式、
     引 02、开屏动画/6.主页挂载.js 在首页播一次开场动画。
     ============================================================ -->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>支援未来</title>

    <!-- 站点图标：墨蓝底 + 四角星（星河 / 星辰大海，取开屏动画配色）。
         直接内嵌 data URI，不发额外请求。想换形状/颜色只改下面这个 SVG。 -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%2363b4de'/%3E%3Cstop offset='1' stop-color='%231c508c'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%230a1a2e'/%3E%3Cpath d='M32 9Q35.5 28.5 55 32Q35.5 35.5 32 55Q28.5 35.5 9 32Q28.5 28.5 32 9Z' fill='url(%23g)'/%3E%3C/svg%3E" />

    <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preload" href="03、设置/2.站点样式.css" as="style" />
    <link rel="preload" href="03、设置/1.站点主程序.js" as="script" />
    <!-- 门面用的两个免费开源字体（和参考站同款的 JetBrains Mono + 气质接近的 Space Grotesk）。
         走 jsDelivr 的 fontsource，和站点其它 CDN 依赖一样，挂了会回退系统字体，不影响使用。 -->
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="https://cdn.jsdelivr.net/npm/@fontsource/space-grotesk@5/files/space-grotesk-latin-500-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5/files/jetbrains-mono-latin-400-normal.woff2" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
    <link rel="stylesheet" href="03、设置/2.站点样式.css" />
    <link rel="stylesheet" href="03、设置/3.Hero门面样式.css" />

    <!-- ===================== 开场：门面长前言 =====================
         2026-09-24 起，开屏动画退役，改由门面长前言兼任"开场 + 加载器"：
         用户滚第 2-4 屏的这段时间，目录和文档索引在后台备好，
         等待被"看内容"自然消化掉；回访（localStorage 有标记）
         入场只走短文版，不强制等待。
         要显示就给 <html> 加上 hero-on 类，样式见 03、设置/3.Hero门面样式.css，
         动画与滚动剧情在 03、设置/4.Hero门面.js。
         调试开关（加在网址后面）：
            ?hero=0    直达操作手册（老用法、老速度）
            ?hero=1    强制显示门面
            ?seen=0    清掉"回访"标记，重新看一遍完整入场
         其它直达参数（都是"这次访问要不要跳过门面"的开关）：
            ?jump=1    进站直接跳到目录
            ?page=xxx  直接打开某篇文档
            ?t=秒      动画页定格到第几秒（动画页已退役，参数保留兼容）
         ================================================== -->
    <script>
        (function () {
            var query = new URLSearchParams(location.search);
            var heroParam = query.get("hero");
            var introForce = query.get("intro");

            /* ?seen=0：把"看过门面"的标记清掉，下次（或这次刷新后）重新看完整入场 */
            if (query.get("seen") === "0") {
                try { localStorage.removeItem("support-future-hero-seen-v1"); } catch (e) { /* 忽略 */ }
            }

            /* 门面默认显示；只要这次访问带任何"直达"参数就跳过，
               老链接、老习惯、同事收藏的 URL 全都照旧 */
            var direct = query.get("jump") === "1" || !!query.get("page") || introForce === "0";
            var useHero = heroParam === "1" || (heroParam !== "0" && !direct);

            window.__heroMode = useHero;
            if (useHero) document.documentElement.classList.add("hero-on");
        })();
    </script>
</head>
<body>

    <!-- ===================== 门面 Hero（星河旅程，共 4 屏） =====================
         只在首页显示，而且是 .site-shell 的兄弟节点：整页滚动时它向上滑出、
         下面的 shell 自然盖上，滚完全部 4 屏就是原来的「操作手册」目录。
         第 1 屏是大字门面正脸，第 2-4 屏是星河旅程（初衷 / SOP 小技巧注解）。
         不用 position:fixed 钉住，所以不会和底下任何 sticky 元素打架。
         结构、样式、时间轴全部集中在这两段里，删掉这两段就退回旧版首页。
         ============================================================ -->
    <div id="heroStage" aria-hidden="true"></div>

    <!-- 收场白（照教学版 section.outro：门面滚完后的一屏深色居中文字） -->
    <section class="hero-outro-tut">
        <p>The system has reached its final spatial state.</p>
    </section>

    <!-- 站点外壳：原来 index.html 里的全部内容都在这里面，样式一点没改 -->
    <div class="site-shell" id="siteShell">

    <header class="top-nav">
        <div class="logo">支援未来</div>
    </header>

    <div id="loading-bar"></div>

    <div class="app">
        <div class="main-body">
            <aside class="sidebar" id="sidebar"></aside>
            <div class="content-wrapper">
                <main class="content-area" id="contentArea">
                    <div id="contentLoader">加载中...</div>
                </main>
                <aside class="toc-wrapper" id="tocWrapper">
                    <div class="toc-title">本页指引</div>
                    <ul class="toc-list" id="tocList"></ul>
                </aside>
            </div>
        </div>
    </div>

    <!-- 站点外壳结束（.site-shell 从这里闭合） -->
    </div>

    <!-- GSAP / ScrollTrigger / Lenis：门面 Hero 的滚动剧情用。
         Lenis 是教学版 <ReactLenis root /> 的平滑滚动（只作用于门面阶段，
         滚进目录后由 4.Hero门面.js 的 stopSmooth 销毁、还原生滚轮）。
         下载超时或 ?hero=0 时这里不会阻塞主页，站点照常可用 -->
    <script>
        (function () {
            if (!window.__heroMode) return;
            var base = "https://cdnjs.cloudflare.com/ajax/libs/";
            var files = [
                ["gsap", "gsap/3.12.5/gsap.min.js", ""],
                ["gsap", "gsap/3.12.5/ScrollTrigger.min.js", ""],
                ["lenis", "", "https://cdn.jsdelivr.net/npm/lenis@1.1.14/dist/lenis.min.js"]
            ];
            var pending = files.length;
            function done() { pending -= 1; if (pending === 0 && window.HeroFacade) window.HeroFacade.start(); }
            files.forEach(function (f) {
                var s = document.createElement("script");
                s.src = f[2] || (base + f[1]);
                s.onload = done;
                s.onerror = done;      // 库挂了也照常起步（HeroFacade 会检测）
                document.head.appendChild(s);
            });
            /* 兜底：网慢也别让门面一直白等 */
            setTimeout(function () { if (window.HeroFacade) window.HeroFacade.start(); }, 2500);
        })();
    </script>
    <script src="03、设置/4.Hero门面.js"></script>

    <!-- 内容门锁：先于主程序加载，loadContent 会调它的闸门（正文脱敏，目录公开） -->
    <script src="03、设置/5.内容门锁.js"></script>
    <script src="03、设置/1.站点主程序.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof init === 'function') {
                init();
            } else {
                console.error('1.站点主程序.js 未加载或 init 函数未定义');
            }
        });
    </script>

    <!-- 开屏动画（02、开屏动画）已退役：
         2026-09-24 起由门面长前言兼任开场与加载器，这里不再引它的挂载脚本。
         它的目录和文件都还在，想恢复就把下面这行注释取消、并把
         开屏遮罩层（id 见 02 目录）与头部开关 class 判断加回去
         （完整步骤见 02、开屏动画/使用说明.md）。 -->
    <!-- <script src="02、开屏动画/6.主页挂载.js"></script> -->

    <!-- 门面 Hero 的引导：负责"目录在下面、先别让同事滚错地方"这类小动作 -->
    <script>
        (function () {
            if (!window.__heroMode) return;

            /* 直接戳 ?jump=1 进来的：跳过门面，直接停在目录 */
            if (new URLSearchParams(location.search).get("jump") === "1") {
                document.documentElement.classList.remove("hero-on");
                var shell = document.getElementById("siteShell");
                if (shell) {
                    requestAnimationFrame(function () {
                        window.scrollTo({ top: shell.offsetTop });
                    });
                }
            }

            /* 门面还在时，万一有人按了 End / 拖动滚动条冲到目录，
               把门面标记成已经看过，避免上面那屏又"回来"。
               判据 = 门面底部有没有滚过视口 55%。
               注意不能用 IntersectionObserver 的可见比例：门面现在是
               4 屏的长流程，一屏视口最多只能看到它的 1/4，比例永远
               低于旧阈值，状态会一直判错。 */
            var stage = document.getElementById("heroStage");
            var passedTick = false;
            function updateHeroPassed() {
                passedTick = false;
                if (!stage) return;
                var bottom = stage.getBoundingClientRect().bottom;
                if (bottom <= window.innerHeight * 0.55) {
                    document.documentElement.classList.add("hero-passed");
                    /* 滚进目录：门面阶段（Lenis 平滑滚轮）到此为止，
                        正文回到原生 1:1 手感（4.Hero门面.js 提供销毁入口） */
                    if (window.HeroFacade && window.HeroFacade.stopSmooth) {
                        window.HeroFacade.stopSmooth();
                    }
                } else {
                    document.documentElement.classList.remove("hero-passed");
                }
            }
            if (stage) {
                addEventListener("scroll", function () {
                    if (passedTick) return;
                    passedTick = true;
                    requestAnimationFrame(updateHeroPassed);
                }, { passive: true });
                updateHeroPassed();
            }
        })();
    </script>

</body>
</html>
