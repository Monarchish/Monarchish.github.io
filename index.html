<!DOCTYPE html>
<!-- ============================================================
     站点入口（index.html 是 GitHub Pages 的首页约定名，不能改）

     仓库结构：
       01、支援未来/    文档正文（.md），改内容只动这里
       02、开屏动画/    站点打开时的开场动画（平时不用动）
       03、设置/        主页的功能代码与样式（导航清单在这里）

     本文件本身只做三件事：搭主页骨架、引 03、设置/ 的代码与样式、
     引 02、开屏动画/6.主页挂载.js 在首页播一次开场动画。
     ============================================================ -->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>支援未来</title>

    <!-- 站点图标：墨蓝底 + 四角星（星河 / 星辰大海，取开屏动画配色）。
         直接内嵌 data URI，不发额外请求。想换形状/颜色只改下面这个 SVG。 -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%2363b4de'/%3E%3Cstop offset='1' stop-color='%231c508c'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%230a1a2e'/%3E%3Cpath d='M32 9Q35.5 28.5 55 32Q35.5 35.5 32 55Q28.5 35.5 9 32Q28.5 28.5 32 9Z' fill='url(%23g)'/%3E%3C/svg%3E" />

    <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preload" href="03、设置/2.站点样式.css" as="style" />
    <link rel="preload" href="03、设置/1.站点主程序.js" as="script" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
    <link rel="stylesheet" href="03、设置/2.站点样式.css" />
    <link rel="stylesheet" href="02、开屏动画/7.主页覆盖层样式.css" />

    <!-- ===================== 开屏动画 =====================
         ① 在页面首次绘制之前就决定"这次要不要播动画"，
            避免出现"先闪一下主页、再盖黑幕"的观感。
         ② 要播就给 <html> 加上 intro-on 类，覆盖层由 7.主页覆盖层样式.css 显示，
            真正的播放逻辑在 02、开屏动画/6.主页挂载.js。
         调试开关（加在网址后面）：
            ?intro=0   本次不播（想直接看主页时用）
            ?intro=1   强制重播（忽略"本次会话已播过"）
            ?debug=1   在控制台打印播放流程
         ================================================== -->
    <script>
        (function () {
            var KEY = "act54-intro-played";
            window.__INTRO_SESSION_KEY = KEY;

            var query = new URLSearchParams(location.search);
            var force = query.get("intro");
            if (force === "0") return;          // 明确要求不播

            var played = false;
            try { played = sessionStorage.getItem(KEY) === "1"; } catch (e) { /* 忽略 */ }
            if (force !== "1" && played) return; // 本次会话已经播过

            document.documentElement.classList.add("intro-on");
        })();
    </script>
</head>
<body>

    <!-- 开屏动画覆盖层：动画播完由 6.主页挂载.js 自动淡出并移除，不占用主页布局 -->
    <div id="intro-overlay" aria-hidden="true"></div>

    <header class="top-nav">
        <div class="logo">支援未来</div>
    </header>

    <div id="loading-bar"></div>

    <div class="app">
        <div class="main-body">
            <aside class="sidebar" id="sidebar"></aside>
            <div class="content-wrapper">
                <main class="content-area" id="contentArea">
                    <div id="contentLoader">加载中...</div>
                </main>
                <aside class="toc-wrapper" id="tocWrapper">
                    <div class="toc-title">本页指引</div>
                    <ul class="toc-list" id="tocList"></ul>
                </aside>
            </div>
        </div>
    </div>

    <script src="03、设置/1.站点主程序.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof init === 'function') {
                init();
            } else {
                console.error('1.站点主程序.js 未加载或 init 函数未定义');
            }
        });
    </script>

    <!-- 开屏动画挂载脚本：决定要不要播、播完怎么收场 -->
    <script src="02、开屏动画/6.主页挂载.js"></script>

</body>
</html>
