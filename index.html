<!DOCTYPE html>
<!-- ============================================================
     站点入口（index.html 是 GitHub Pages 的首页约定名，不能改）

     仓库结构（2026-10 整理后）：
       01、支援未来/    文档正文（.md），改内容只动这里
       02、设置/        主页的功能代码与样式
         01~11.*        脚本与样式，按加载顺序编号
         素材/          图片（门面主图 / 蒙版窗 / 方格网 / 开屏标志）
         库/            自托管的第三方库与字体（不吃 CDN）
       （末尾的 README.md 是"怎么加一篇新工序"的说明；.nojekyll 用来关掉
         GitHub Pages 自带的 Jekyll 处理，中文目录名才不会被误判。）

     这份入口只做四件事：
       ① 搭主页骨架——开场动画层（reveal）、滚动门面（hero）、站点外壳（目录/正文）
       ② 引 02、设置/ 的样式与脚本
       ③ 决定这次进站要不要演开场与门面（网址开关见下）
       ④ 把 CDN 库按顺序取回来，再开演

     开场与门面两套动画：整段取自《支援未来 handbook》原版（用户已购下该仓库），
     逐字照搬、没有改动画本身；差别只有资源路径（图片/掩膜/标志在本仓库里的位置）。
       开屏动画   02、设置/06.开屏动画样式.css  +  07.开屏动画.js
       滚动门面   02、设置/03.Hero门面样式.css   +  04.Hero门面.js
     门面滚完就是下面的站点外壳——目录（01.站点主程序.js）、正文、内容门锁，
     这一整块本来就是本站的，一行没动。

     调试开关（加在网址后面）：
       ?hero=0    直达操作手册（不演开场与门面）
       ?hero=1    强制演门面
       ?reveal=0  只演门面，跳过开屏动画
       ?seen=0    清掉"回访"标记，重新看一遍完整入场
     其它直达参数（这次访问要不要跳过门面）：
       ?jump=1    进站直接跳到目录
       ?page=xxx  直接打开某篇文档
     ============================================================ -->

        /* 掩膜开窗：照 handbook 入口里的内联块，只把图指到 02、设置/ */
        .hero-mask {
            -webkit-mask-image: linear-gradient(#fff, #fff), url("02、设置/素材/03.门面蒙版窗.svg?v=3");
            -webkit-mask-position: center, center;
            -webkit-mask-size: auto, 50%;
            -webkit-mask-repeat: no-repeat, no-repeat;
            -webkit-mask-composite: xor;
            mask-image: linear-gradient(#fff, #fff), url("02、设置/素材/03.门面蒙版窗.svg?v=3");
            mask-position: center, center;

        /* 开场期间：锁定滚动，站点外壳先不露脸（门面在它里面，演完再一起露） */
        html.play-reveal { overflow: hidden; }
        html.play-reveal #site-main { visibility: hidden; }
        body.is-ready #site-main,
        html.no-hero #site-main { visibility: visible; }

        /* 不演开场时，把开场层收起来；?hero=0 这类直达链接连门面一起收 */
        html.no-reveal .reveal-root,
        html.no-hero .reveal-root,
        html.no-hero .hero { display: none !important; }
    </style>

    <script>
        (function () {
            var query = new URLSearchParams(location.search);
            var heroParam = query.get("hero");

            /* ?seen=0：把"看过门面"的标记清掉，下次（或这次刷新后）重新看完整入场 */
            if (query.get("seen") === "0") {
                try { localStorage.removeItem("support-future-hero-seen-v1"); } catch (e) { /* 忽略 */ }
            }

            /* 门面默认显示；带任何"直达"参数就跳过，老链接、老习惯、同事收藏的 URL 全都照旧 */
            var direct = query.get("jump") === "1" || !!query.get("page") || query.get("intro") === "0";
            var useHero = heroParam === "1" || (heroParam !== "0" && !direct);
            var useReveal = useHero && query.get("reveal") !== "0";

            window.__animMode = useHero;
            window.__revealMode = useReveal;

            if (useHero && useReveal) {
                document.documentElement.classList.add("play-reveal");
                /* 开场是从头看起的：别让浏览器恢复上次的滚动位置 */
                try { if ("scrollRestoration" in history) history.scrollRestoration = "manual"; } catch (e) { /* 忽略 */ }
                window.scrollTo(0, 0);
            } else if (!useHero) {
                document.documentElement.classList.add("no-hero");
            } else {
                document.documentElement.classList.add("no-reveal");
            }
        })();
    </script>

    <!-- ===================== 库与动画脚本 =====================
         顺序照 handbook 原版：gsap → ScrollTrigger → CustomEase → lenis → 动画脚本。
         这里用顺序注入而不是直接写 <script src>，是为了 ?hero=0 时不白下载这几个库，
         而且某个库挂掉时不会把整页卡住（少了库就退回"直接看目录"，站点永远能用）。
         注意：本站这两个脚本（07.开屏动画.js / 04.Hero门面.js）也不要改成静态 <script src>，
         静态标签会阻塞后面的脚本解析，网络一卡整页都要等（试过，会卡 9 秒）。 -->
    <script>
        (function () {
            var html = document.documentElement;
            var animMode = window.__animMode === true;
            var revealMode = window.__revealMode === true;

            /* ============ Lenis 平滑滚轮（门面阶段用；滚进目录就还原生 1:1） ============ */
            var lenis = null;
            var tickerFn = null;

            function startSmooth() {
                if (lenis || !window.Lenis || !window.gsap || !window.ScrollTrigger) return;
                lenis = new window.Lenis({ lerp: 0.08 });
                lenis.on("scroll", window.ScrollTrigger.update);
                tickerFn = function (time) { lenis.raf(time * 1000); };
                window.gsap.ticker.add(tickerFn);
                window.gsap.ticker.lagSmoothing(0);
                window.HeroFacade.lenis = lenis;
            }

            function stopSmooth() {
                if (!lenis) return;
                try {
                    if (tickerFn && window.gsap) window.gsap.ticker.remove(tickerFn);
                    lenis.destroy();
                } catch (e) { /* 忽略 */ }
                lenis = null;
                tickerFn = null;
                window.HeroFacade.lenis = null;
            }

            /* 站点主程序（01.站点主程序.js）会认这个对象：有 lenis 就用平滑滚，没有就原生滚 */
            window.HeroFacade = {
                lenis: null,
                startSmooth: startSmooth,
                stopSmooth: stopSmooth
            };

            function markReady() {
                document.body.classList.add("is-ready");
                html.classList.remove("play-reveal");
            }

            /* 门面大图「就绪才显示」：decode 完成前保持透明（CSS 里有配套规则），
               避免慢网络下把半下载的图块画进像素窗里 */
            (function () {
                var wrap = document.querySelector(".hero-img");
                var img = wrap && wrap.querySelector("img");
                if (!wrap || !img) return;
                var mark = function () { wrap.classList.add("img-ready"); };
                if (img.complete && img.naturalWidth) mark();
                else if (img.decode) img.decode().then(mark, mark);
                else { img.addEventListener("load", mark); img.addEventListener("error", mark); }
            })();

            /* 不演开屏（?reveal=0 / ?hero=0）：站点外壳立刻露脸 */
            if (!animMode || !revealMode) {
                if (!revealMode) html.classList.add("no-reveal");
                markReady();
            }

            var siteStarted = false;
            function startSite() {
                if (siteStarted || !animMode) return;
                siteStarted = true;
                /* 注意：这里刻意不等门面大图 decode——线上网络慢时图片会卡很久，
                   等它 = 滚动动画一直不初始化（用户实测线上"下拉没动画"就是这个原因）。
                   图片改由 .img-ready 门控显示：加载完自己淡入，不拖累动画。 */
                Promise.all([
                    /* 门面那两个库（ScrollTrigger / lenis）和门面脚本可能还在路上，
                       一起等，免得交接时门面还没准备好 */
                    heroChain || Promise.resolve(),
                    document.fonts ? document.fonts.ready : Promise.resolve()
                ]).then(function () {
                    startSmooth();
                    armHero(0);
                });
            }

            /* 门面初始化的"补位"：正常情况下上面 Promise.all 一结束，
               门面脚本和库都已就位，直接 init。但线上（GitHub Pages 在国内
               偶发单请求 6 秒超时）此前只要 04.Hero门面.js / ScrollTrigger
               其中一个没到位，就会静默放弃——蒙版停在默认 scale 1，
               照片缩成屏幕中央一小块、四周一大圈黑边（用户截图实锤）。
               现在改成：没就位就每 3 秒补拉一轮，最多 20 次（约 1 分钟），
               期间 CSS 兜底 scale(2.5) 保证照片始终满屏。
               注意：如果用户已经滚进门面之后的目录（hero-passed），
               就不再补初始化，避免晚到的 pin 把页面布局拽回去。 */
            var heroArmed = false;
            function armHero(n) {
                if (heroArmed) return;
                if (window.SupportFutureScroll && window.gsap && window.ScrollTrigger) {
                    var hero = document.querySelector(".hero");
                    var passed = document.documentElement.classList.contains("hero-passed") ||
                        (hero && hero.getBoundingClientRect().bottom <= window.innerHeight * 0.55);
                    if (passed) { heroArmed = true; return; }
                    heroArmed = true;
                    window.SupportFutureScroll.init();
                    if (window.ScrollTrigger) window.ScrollTrigger.refresh();
                    return;
                }
                if (n >= 20) return;
                ensureLib(LIBS.hero);
                ensureLib(LIBS.gsap);
                ensureLib(LIBS.scrollTrigger);
                setTimeout(function () { armHero(n + 1); }, 3000);
            }

            /* 「右上角 Menu」：原「跳过动画 · 进入手册」，滚到目录外壳 */
            var skipBtn = document.querySelector(".hero-menu");
            if (skipBtn) {
                skipBtn.addEventListener("click", function () {
                    var shell = document.getElementById("siteShell");
                    if (!shell) return;
                    /* 先结束门面阶段再滚：否则跳转动画飞到半路会触发
                       「滚过门面 55% 就 stopSmooth」的逻辑，Lenis 被销毁，
                       滚动卡死在门面里（跳过按钮此前就是坏的这个原因） */
                    if (window.HeroFacade && window.HeroFacade.lenis && window.HeroFacade.stopSmooth) {
                        window.HeroFacade.stopSmooth();
                    }
                    var y = shell.getBoundingClientRect().top + window.scrollY - 1;
                    window.scrollTo({ top: y, behavior: "smooth" });
                });
            }

            /* ============ 开演 ============ */
            var started = false;

            function boot() {
                if (!animMode || started) return;
                started = true;

                /* 开屏脚本/库没下来：收起开场层，让站点直接露面 */
                if (!revealMode || !window.SupportFutureReveal || !window.gsap) {
                    html.classList.add("no-reveal");
                    markReady();
                    startSite();
                    return;
                }

                var done = function () {
                    try { window.scrollTo(0, 0); } catch (e) { /* 忽略 */ }
                    markReady();
                    if (window.ScrollTrigger) window.ScrollTrigger.refresh();
                    startSite();
                };

                try {
                    window.SupportFutureReveal.boot(window.gsap, window.CustomEase)
                        .then(done)
                        .catch(function () {
                            /* 开屏中途出错：别把站点关在门外 */
                            html.classList.add("no-reveal");
                            done();
                        });
                } catch (e) {
                    html.classList.add("no-reveal");
                    done();
                }
            }

            if (!animMode) return;

            /* ============ 取库：两条链同时进行 ============
               开场只要 gsap + CustomEase + 开屏脚本，这链一到位就开演（尽量贴近原版时序）；
               门面要的 ScrollTrigger / lenis / 门面脚本走另一条链同时取，等开场演完正好就位。
               某一步挂了也不会卡住：跳过它，最后按"缺库"退回直接看目录。

               加固（2026-09-30）：之前只从一个 CDN 取，网络抖一下或代理拦一下就
               "缺库" → 整段开屏被跳过（现象：本地预览有开屏、线上打开却没有）。
               现在每个库都备了多个来源，并且加载完会校验全局变量是否真的出现
               （代理返回一页错误 HTML 时 onload 也会触发，光看 onload 会误判成功）；
               失败就换下一个源，再失败带时间戳重试一次，全都失败才认输。

               自托管（2026-09-30）：首个来源改成站点自带的 02、设置/库/ 本地副本。
               原因：jsdelivr 等公共 CDN 在部分网络（含国内常见线路）会被污染或拖慢，
               库拿不到 → 判"缺库" → 开屏和滑动动画整段消失。本地副本和网页同源，
               网页能打开它就一定能下载到，公共 CDN 只作为兜底。 */
            var GSAP_VER = "3.14.2";
            var LIBS = {
                gsap: {
                    global: "gsap",
                    urls: [
                        "02、设置/库/gsap.min.js?v=3",
                        "https://cdn.jsdelivr.net/npm/gsap@" + GSAP_VER + "/dist/gsap.min.js",
                        "https://unpkg.com/gsap@" + GSAP_VER + "/dist/gsap.min.js",
                        "https://cdnjs.cloudflare.com/ajax/libs/gsap/" + GSAP_VER + "/gsap.min.js"
                    ]
                },
                customEase: {
                    global: "CustomEase",
                    urls: [
                        "02、设置/库/CustomEase.min.js?v=3",
                        "https://cdn.jsdelivr.net/npm/gsap@" + GSAP_VER + "/dist/CustomEase.min.js",
                        "https://unpkg.com/gsap@" + GSAP_VER + "/dist/CustomEase.min.js",
                        "https://cdnjs.cloudflare.com/ajax/libs/gsap/" + GSAP_VER + "/CustomEase.min.js"
                    ]
                },
                scrollTrigger: {
                    global: "ScrollTrigger",
                    urls: [
                        "02、设置/库/ScrollTrigger.min.js?v=3",
                        "https://cdn.jsdelivr.net/npm/gsap@" + GSAP_VER + "/dist/ScrollTrigger.min.js",
                        "https://unpkg.com/gsap@" + GSAP_VER + "/dist/ScrollTrigger.min.js",
                        "https://cdnjs.cloudflare.com/ajax/libs/gsap/" + GSAP_VER + "/ScrollTrigger.min.js"
                    ]
                },
                lenis: {
                    global: "Lenis",
                    urls: [
                        "02、设置/库/lenis.min.js?v=3",
                        "https://cdn.jsdelivr.net/npm/lenis@1.3.17/dist/lenis.min.js",
                        "https://unpkg.com/lenis@1.3.17/dist/lenis.min.js"
                    ]
                },
                /* ScrambleText：门面文案的"动态输入"效果（参考 inversa），3.13 起官方免费 */
                scrambleText: {
                    global: "ScrambleTextPlugin",
                    urls: [
                        "02、设置/库/ScrambleTextPlugin.min.js?v=1",
                        "https://cdn.jsdelivr.net/npm/gsap@" + GSAP_VER + "/dist/ScrambleTextPlugin.min.js",
                        "https://unpkg.com/gsap@" + GSAP_VER + "/dist/ScrambleTextPlugin.min.js"
                    ]
                },
                /* 本站自己的脚本：只有一个来源，但同样校验（本站也可能被代理拦） */
                reveal: { global: "SupportFutureReveal", urls: ["02、设置/07.开屏动画.js?v=5"] },
                hero: { global: "SupportFutureScroll", urls: ["02、设置/04.Hero门面.js?v=6"] }
            };

            /* 加载单个脚本：成功/失败/超时都会 resolve，绝不把流程卡死 */
            function loadOne(src, timeoutMs) {
                return new Promise(function (resolve) {
                    var s = document.createElement("script");
                    var done = false;
                    var timer = setTimeout(function () { finish(false); }, timeoutMs || 6000);
                    function finish(ok) {
                        if (done) return;
                        done = true;
                        clearTimeout(timer);
                        s.onload = null;
                        s.onerror = null;
                        resolve(ok);
                    }
                    s.onload = function () { finish(true); };
                    s.onerror = function () { finish(false); };
                    s.src = src;
                    document.head.appendChild(s);
                });
            }

            /* 按来源顺序试：加载完校验全局变量；只有"源可达（onload 成功）却没能生效"
               这种可疑情况（坏缓存 / 代理返回了错误页）才带时间戳重试一次；
               源直接失败或超时就直接换下一个来源，不在同一个源上白等两轮。 */
            function waitGlobal(name, ms) {
                return new Promise(function (resolve) {
                    var waited = 0;
                    var step = 300;
                    var timer = setInterval(function () {
                        if (window[name]) { clearInterval(timer); resolve(true); return; }
                        waited += step;
                        if (waited >= ms) { clearInterval(timer); resolve(false); }
                    }, step);
                });
            }

            function ensureLib(lib) {
                if (window[lib.global]) return Promise.resolve(true);
                var i = 0;
                function attempt() {
                    if (i >= lib.urls.length) return waitGlobal(lib.global, 2000);
                    var base = lib.urls[i++];
                    return loadOne(base).then(function (ok) {
                        if (window[lib.global]) return true;
                        if (!ok) return attempt();          /* 源不可达：换下一个，不重试 */
                        var sep = base.indexOf("?") < 0 ? "?" : "&";
                        return loadOne(base + sep + "retry=" + Date.now()).then(function () {
                            return window[lib.global] ? true : attempt();
                        });
                    });
                }
                return attempt();
            }

            /* 六路并行取库：彼此没有依赖——开屏脚本 / 门面脚本加载时只定义全局函数，
               真正需要 gsap 是在 boot() 里才发生的，所以可以同时取。
               并行之后最坏耗时从"三个库相加"变成"取其中最长的一个"，
               慢网络下能早得多开演（之前串行是线上开屏被砍的帮凶之一）。 */
            var gsapReady = ensureLib(LIBS.gsap);
            var easeReady = ensureLib(LIBS.customEase);
            var revealScriptReady = ensureLib(LIBS.reveal);
            var stReady = ensureLib(LIBS.scrollTrigger);
            var lenisReady = ensureLib(LIBS.lenis);
            /* ScrambleText 是 gsap 插件：必须等 gsap 核心就位后再加载，
               否则它加载时找不到 window.gsap，注册不上（等于白下） */
            var scrambleReady = gsapReady.then(function (ok) {
                return ok ? ensureLib(LIBS.scrambleText) : false;
            });
            var heroScriptReady = ensureLib(LIBS.hero);

            var revealChain = Promise.all([gsapReady, easeReady, revealScriptReady])
                .then(function (rs) {
                    if (rs[2]) return true;
                    /* 连 gsap 都没取到，等开屏脚本也没用，别白等 */
                    if (!window.gsap) return false;
                    /* 开屏脚本是"看不到开场动画"的唯一命门：它没就位时再守 4 秒，
                       线上实测它有时被中断一下、几秒后才真正执行完 */
                    return waitGlobal(LIBS.reveal.global, 4000);
                });

            var heroChain = Promise.all([gsapReady, stReady, lenisReady, scrambleReady, heroScriptReady]);

            /* 开演：取库链路一结束就开演——取到就播开屏（然后停在开屏等你点「进入」），
               全都取不到才优雅降级进目录。判定权完全交给链路自己，因为
               loadOne 本来就带超时，链路一定会结束，不会挂死。 */
            revealChain.then(function () { boot(); });

            /* 极端兜底：万一链路意外挂死，最多 22 秒就放行进站，不让人一直看黑屏。
               这里刻意给到 22 秒（而不是原来的 12 秒）——原来的值太短，
               链路稍慢就会抢在库到位前判"缺库"，把正在路上的开屏整段砍掉，
               而且一旦砍掉就永久作废（started 已置位），后面库到了也不播。
               线上"开屏时有时无、本地却永远正常"就是这么来的。 */
            setTimeout(function () { if (!started) boot(); }, 22000);
        })();
    </script>

    <!-- 内容门锁：先于主程序加载，loadContent 会调它的闸门（正文脱敏，目录公开） -->
    <script src="02、设置/05.内容门锁.js?v=3"></script>
    <script src="02、设置/01.站点主程序.js?v=3"></script>
    <script src="02、设置/10.章节门厅.js?v=8"></script>
    <script src="02、设置/11.自动目录.js?v=3"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            if (typeof init === 'function') {
                init();
            } else {
                console.error('01.站点主程序.js 未加载或 init 函数未定义');
            }
        });
    </script>

    <!-- 门面阶段的收尾：滚进目录后把平滑滚轮关掉，正文回到原生 1:1 -->
    <script>
        (function () {
            if (!window.__animMode) return;

            /* 直接戳 ?jump=1 进来的：跳过门面，直接停在目录 */
            if (new URLSearchParams(location.search).get("jump") === "1") {
                document.documentElement.classList.add("no-hero");
                var shell0 = document.getElementById("siteShell");
                if (shell0) {
                    requestAnimationFrame(function () {
                        window.scrollTo({ top: shell0.offsetTop });
                    });
                }
            }

            /* 门面还在时，万一有人按了 End / 拖动滚动条冲到目录，
               把门面标记成已经看过，避免上面那屏又"回来"。
               判据 = 门面底部有没有滚过视口 55%（门面是 4 屏长流程，
               用可见比例判会一直判错，所以用位置） */
            var hero = document.querySelector(".hero");
            var passedTick = false;
            function updateHeroPassed() {
                passedTick = false;
                if (!hero) return;
                var bottom = hero.getBoundingClientRect().bottom;
                if (bottom <= window.innerHeight * 0.55) {
                    document.documentElement.classList.add("hero-passed");
                    /* 滚进目录：门面阶段（Lenis 平滑滚轮）到此为止，
                       正文回到原生 1:1 手感 */
                    if (window.HeroFacade && window.HeroFacade.stopSmooth) {
                        window.HeroFacade.stopSmooth();
                    }
                } else {
                    document.documentElement.classList.remove("hero-passed");
                }
            }
            if (hero) {
                addEventListener("scroll", function () {
                    if (passedTick) return;
                    passedTick = true;
                    requestAnimationFrame(updateHeroPassed);
                }, { passive: true });
                updateHeroPassed();
            }
        })();
    </script>
