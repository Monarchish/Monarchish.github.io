<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>支援未来</title>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preload" href="一、设置/style.css" as="style" />
    <link rel="preload" href="一、设置/app.js" as="script" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
    <link rel="stylesheet" href="一、设置/style.css" />
</head>
<body>

    <header class="top-nav">
        <div class="logo">支援未来</div>
    </header>

    <div id="loading-bar"></div>

    <div class="app">
        <div class="main-body">
            <aside class="sidebar" id="sidebar"></aside>
            <div class="content-wrapper">
                <main class="content-area" id="contentArea">
                    <div id="contentLoader">加载中...</div>
                </main>
                <aside class="toc-wrapper" id="tocWrapper">
                    <div class="toc-title">本页指引</div>
                    <ul class="toc-list" id="tocList"></ul>
                </aside>
            </div>
        </div>
    </div>

    <script src="一、设置/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof init === 'function') {
                init();
            } else {
                console.error('app.js 未加载或 init 函数未定义');
            }
        });
    </script>

</body>
</html>
