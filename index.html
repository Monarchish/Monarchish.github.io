                parse: function(text) {

                }

        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f5f7fa;
            color: #1a1a1a;
            line-height: 1.6;
        }
        a {
            text-decoration: none;
            color: #3a84ff;
            cursor: pointer;
        }
        a:hover {
            text-decoration: underline;
        }

        .top-nav {
            display: flex;
            align-items: center;
            padding: 0 40px;
            height: 52px;
            background: #1e2a3a;
            flex-shrink: 0;
            gap: 0;
            position: sticky;
            top: 0;
            z-index: 100;
            width: 100%;
        }
        .top-nav .logo {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            margin-right: 40px;
            white-space: nowrap;
            letter-spacing: 0.5px;
        }
        .top-nav .logo span {
            color: #3a84ff;
        }
        .top-nav .nav-item {
            padding: 0 20px;
            height: 52px;
            font-size: 14px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            background: transparent;
            position: relative;
            display: flex;
            align-items: center;
            letter-spacing: 0.3px;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        .top-nav .nav-item:hover {
            color: #ffffff;
        }
        .top-nav .nav-item.active {
            color: #ffffff;
        }
        .top-nav .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 3px;
            background: #3a84ff;
            border-radius: 2px 2px 0 0;
        }

        .app {
            display: flex;
            flex-direction: column;
            min-height: calc(100vh - 52px);
            max-width: 1440px;
            margin: 0 auto;
            background: #ffffff;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.05);
        }

        .main-body {
            display: flex;
            flex: 1;
            position: relative;
            align-items: flex-start;
        }

        .sidebar {
            width: 260px;
            flex-shrink: 0;
            background: #fafbfc;
            border-right: 1px solid #e9edf4;
            padding: 16px 8px 30px 8px;
            overflow-y: auto;
            position: sticky;
            top: 52px;
            max-height: calc(100vh - 52px);
            align-self: flex-start;
        }
        .sidebar .sidebar-category {
            font-size: 14px;
            font-weight: 600;
            color: #1e2a3a;
            padding: 8px 12px 12px 12px;
            border-bottom: 1px solid #e9edf4;
            margin-bottom: 8px;
        }
        .sidebar .menu-group {
            margin-bottom: 2px;
        }
        .sidebar .menu-group .group-title {
            font-size: 13px;
            font-weight: 500;
            color: #1e2a3a;
            padding: 6px 12px 4px 12px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 4px;
            transition: background 0.1s;
            user-select: none;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        .sidebar .menu-group .group-title:hover {
            background: #f0f4fe;
        }
        .sidebar .menu-group .group-title .arrow {
            font-size: 10px;
            color: #8a9aa8;
            transition: transform 0.2s;
        }
        .sidebar .menu-group .group-title .arrow.open {
            transform: rotate(90deg);
        }
        .sidebar .menu-group .sub-items {
            padding-left: 4px;
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.25s ease;
        }
        .sidebar .menu-group .sub-items.open {
            max-height: 1200px;
        }
        .sidebar .menu-group .sub-items a {
            display: block;
            padding: 4px 12px 4px 28px;
            font-size: 13px;
            color: #4a5a6e;
            border-radius: 4px;
            transition: all 0.1s;
            cursor: pointer;
            border-left: 2px solid transparent;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        .sidebar .menu-group .sub-items a:hover {
            background: #eef3fe;
            color: #3a84ff;
        }
        .sidebar .menu-group .sub-items a.active {
            background: #eef3fe;
            color: #3a84ff;
            font-weight: 500;
            border-left-color: #3a84ff;
        }
        .sidebar .sub-faq {
            margin-top: 2px;
        }
        .sidebar .sub-faq .group-title {
            padding-left: 28px;
            font-size: 13px;
            font-weight: 500;
            color: #4a5a6e;
        }
        .sidebar .sub-faq .group-title:hover {
            background: #eef3fe;
            color: #3a84ff;
        }
        .sidebar .sub-faq .sub-items a {
            padding-left: 44px;
            font-size: 13px;
        }

        .content-wrapper {
            flex: 1;
            display: flex;
            min-height: 600px;
            min-width: 0;
        }

        .content-area {
            flex: 1;
            padding: 28px 40px 50px 40px;
            background: #ffffff;
            min-width: 0;
        }

        .content-area .breadcrumb {
            font-size: 13px;
            color: #8a9aa8;
            margin-bottom: 12px;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        .content-area .breadcrumb a {
            color: #3a84ff;
            text-decoration: none;
        }
        .content-area .breadcrumb a:hover {
            text-decoration: underline;
        }

        .content-area .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eef2f6;
            padding-bottom: 14px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .content-area .page-header h1 {
            font-size: 22pt;
            font-weight: 600;
            color: #1a1a1a;
            line-height: 1.6;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            margin: 0;
        }
        .content-area .page-header .edit-btn {
            background: #f0f4fe;
            color: #3a84ff;
            border: none;
            padding: 5px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        .content-area .page-header .edit-btn:hover {
            background: #dce6fa;
        }

        /* 正文区域隐藏 h1，因为标题已经在 page-header 里了 */
        .content-area .page-content h1 {
            display: none;
        }
        .content-area .page-content h2 {
            font-size: 16pt;
            font-weight: 600;
            color: #1a1a1a;
            line-height: 1.5;
            margin: 28px 0 12px 0;
            padding-top: 8px;
            border-bottom: 1px solid #f0f2f5;
            padding-bottom: 6px;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        .content-area .page-content h3 {
            font-size: 13pt;
            font-weight: 600;
            color: #2c2c2c;
            line-height: 1.5;
            margin: 18px 0 8px 0;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        .content-area .page-content h4 {
            font-size: 11.5pt;
            font-weight: 600;
            color: #333333;
            line-height: 1.5;
            margin: 14px 0 6px 0;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        .content-area .page-content p {
            margin-bottom: 12px;
            font-size: 11pt;
            line-height: 1.6;
            color: #1a1a1a;
        }
        .content-area .page-content ul {
            padding-left: 22px;
            margin-bottom: 12px;
        }
        .content-area .page-content li {
            margin-bottom: 5px;
            font-size: 11pt;
            line-height: 1.6;
            color: #1a1a1a;
        }
        .content-area .page-content ol {
            padding-left: 22px;
            margin-bottom: 12px;
        }
        .content-area .page-content ol li {
            margin-bottom: 5px;
            font-size: 11pt;
            line-height: 1.6;
            color: #1a1a1a;
        }

            margin-top: 40px;
            padding-top: 16px;
            border-top: 1px solid #eef2f6;
            font-size: 13px;
            color: #8a9aa8;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        .toc-wrapper {
            width: 200px;
            flex-shrink: 0;
            padding: 28px 16px 30px 16px;
            background: #fafbfc;
            border-left: 1px solid #e9edf4;
            position: sticky;
            top: 52px;
            max-height: calc(100vh - 52px);
            overflow-y: auto;
            align-self: flex-start;
            display: block;
        }
        .toc-wrapper .toc-title {
            font-size: 13px;
            font-weight: 600;
            color: #1e2a3a;
            padding-bottom: 10px;
            border-bottom: 1px solid #e9edf4;
            margin-bottom: 10px;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        .toc-wrapper .toc-list {
            list-style: none;
            padding: 0;
        }
        .toc-wrapper .toc-list li {
            margin-bottom: 4px;
        }
        .toc-wrapper .toc-list a {
            display: block;
            padding: 4px 8px;
            font-size: 13px;
            color: #4a5a6e;
            border-radius: 4px;
            transition: all 0.1s;
            border-left: 2px solid transparent;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        .toc-wrapper .toc-list a:hover {
            background: #eef3fe;
            color: #3a84ff;
        }
        .toc-wrapper .toc-list a.active-toc {
            background: #eef3fe;
            color: #3a84ff;
            border-left-color: #3a84ff;
            font-weight: 500;
        }
        .toc-wrapper.empty {
            display: none;
        }

        .page-block {
            display: none;
        }
        .page-block.active {
            display: block;
        }
        .sidebar-group {
            display: none;
        }
        .sidebar-group.active {
            display: block;
        }

        .markdown-body table {
            border-collapse: collapse;
            width: 100%;
            margin: 16px 0;
        }
        .markdown-body table th,
        .markdown-body table td {
            border: 1px solid #e9edf4;
            padding: 8px 14px;
            text-align: left;
            font-size: 11pt;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        .markdown-body table th {
            background: #f5f7fa;
            font-weight: 600;
        }
        .markdown-body blockquote {
            border-left: 4px solid #3a84ff;
            padding: 12px 20px;
            margin: 16px 0;
            background: #f5f8fe;
            border-radius: 4px;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        /* ===== 操作关键词样式：灰底 + 深灰字 + 加粗 ===== */
        /* 情况1: strong 包裹 code */
        .markdown-body strong code {
            background: #F2F2F2 !important;
            color: #333333 !important;
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace !important;
            font-size: 0.9em !important;
            border-radius: 3px !important;
            padding: 1px 8px !important;
            font-weight: 700 !important;
        }

        /* 情况2: code 包裹 strong（备用） */
        .markdown-body code strong {
            background: #F2F2F2 !important;
            color: #333333 !important;
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace !important;
            font-size: 0.9em !important;
            border-radius: 3px !important;
            padding: 1px 8px !important;
            font-weight: 700 !important;
        }

        /* 普通 code 不变 */
        .markdown-body code {
            background: transparent;
            color: #1a1a1a;
            font-family: inherit;
            font-size: 1em;
            padding: 0;
        }

        .markdown-body pre {
            background: #f5f7fa;
            padding: 16px 20px;
            border-radius: 6px;
            overflow-x: auto;
        }

        @media (max-width: 1024px) {
            .toc-wrapper {
                display: none !important;
            }
        }
        @media (max-width: 768px) {
            .top-nav {
                padding: 0 12px;
                flex-wrap: wrap;
                height: auto;
                gap: 2px;
            }
            .top-nav .logo {
                margin-right: 16px;
                font-size: 14px;
            }
            .top-nav .nav-item {
                padding: 0 12px;
                height: 40px;
                font-size: 13px;
            }
            .sidebar {
                width: 200px;
                padding: 8px 4px;
                max-height: none;
                position: relative;
                top: 0;
            }
            .content-area {
                padding: 16px 14px 30px 14px;
            }
            .main-body {
                flex-direction: column;
            }
            .content-wrapper {
                flex-direction: column;
            }
        }
    </style>
</head>

        async function loadSidebar() {
            try {
                const resp = await fetch('sidebar.html');
                const html = await resp.text();
                document.getElementById('sidebar').innerHTML = html;
                bindSidebarEvents();
                highlightSidebarItem('home');
            } catch (e) {
                console.warn('侧边栏加载失败', e);
            }
        }

        async function loadContent(tab, pageId) {
            const loader = document.getElementById('contentLoader');

            let filePath;
            if (tab === 'zhunru') {
                filePath = `docs/zhunru/${pageId}.md`;
            } else if (tab === 'caigou') {
                filePath = `docs/caigou/${pageId}.md`;
            } else if (tab === 'xiaoshou') {
                filePath = `docs/xiaoshou/${pageId}.md`;
            } else if (tab === 'caiwu') {
                filePath = `docs/caiwu/${pageId}.md`;
            } else if (tab === 'qita') {
                filePath = `docs/qita/${pageId}.md`;
            } else if (tab === 'home') {
                filePath = 'docs/home.md';
            } else {
                filePath = `docs/${tab}.md`;
            }

            try {
                const resp = await fetch(filePath);
                if (!resp.ok) {
                    loader.innerHTML = `<p>页面加载失败，请刷新重试。</p>`;
                    return;
                }
                const mdText = await resp.text();
                // 从 Markdown 中移除 # 标题行，避免正文中显示重复标题
                const mdTextWithoutTitle = mdText.replace(/^#\s+.+\n/, '');
                const htmlContent = marked.parse(mdTextWithoutTitle);

                // 提取标题用于 page-header
                const titleMatch = mdText.match(/^#\s+(.+)$/m);
                const pageTitle = titleMatch ? titleMatch[1] : (pageNameMap[pageId] || '页面');

                loader.innerHTML = `
                    <div class="page-block active" id="page-${pageId || tab}">
                        <div class="breadcrumb">
                            <a href="javascript:void(0)" onclick="switchTab('home')">支援未来</a>
                            ${getBreadcrumb(tab, pageId)}
                        </div>
                        <div class="page-header">
                            <h1>${pageTitle}</h1>
                            <a class="edit-btn" href="https://github.com/Monarchish/Monarchish.github.io/edit/main/${filePath}" target="_blank">编辑此页</a>
                        </div>
                        <div class="page-content markdown-body">
                            ${htmlContent}
                        </div>
                        <div class="footer-meta">最近更新：2026-08-18</div>
                    </div>
                `;
                generateTOC();
                document.getElementById('contentArea').scrollTop = 0;
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } catch (e) {
                console.error('内容加载失败:', e);
                loader.innerHTML = `<p>内容加载失败，请刷新重试。</p>`;
            }
        }

        function getBreadcrumb(tab, pageId) {
            if (tab === 'zhunru') {
                if (pageId && pageId.startsWith('1.1.')) {
                    return ` > <a href="javascript:void(0)" onclick="switchTab('zhunru')">准入</a> > 准入 > ${pageNameMap[pageId] || pageId}`;
                } else if (pageId && pageId.startsWith('1.2.')) {
                    if (pageId.startsWith('1.2.4.')) {
                        return ` > <a href="javascript:void(0)" onclick="switchTab('zhunru')">准入</a> > MDG > FAQ > ${pageNameMap[pageId] || pageId}`;
                    }
                    return ` > <a href="javascript:void(0)" onclick="switchTab('zhunru')">准入</a> > MDG > ${pageNameMap[pageId] || pageId}`;
                }
                return ` > <a href="javascript:void(0)" onclick="switchTab('zhunru')">准入</a> > ${pageNameMap[pageId] || pageId}`;
            }
            if (tab === 'caigou') {
                const parts = pageId ? pageId.split('.') : [];
                if (parts.length >= 3) {
                    const major = parts[0] + '.' + parts[1];
                    const names = {
                        '1.1': '订货',
                        '1.2': '宝钢期货（预）订货',
                        '1.3': '宝钢期货订货',
                        '1.4': '华菱现货订货',
                        '1.5': '同步'
                    };
                    const category = names[major] || '';
                    if (category) {
                        return ` > <a href="javascript:void(0)" onclick="switchTab('caigou')">采购</a> > ${category} > ${pageNameMap[pageId] || pageId}`;
                    }
                }
                return ` > <a href="javascript:void(0)" onclick="switchTab('caigou')">采购</a> > ${pageNameMap[pageId] || pageId}`;
            }
            if (tab === 'xiaoshou') {
                const parts = pageId ? pageId.split('.') : [];
                if (parts.length >= 2) {
                    const major = parts[0] + '.' + parts[1];
                    const names = {
                        '2.1': '让步单',
                        '2.2': '插行',
                        '2.3': '结案',
                        '2.4': '自由款',
                        '2.5': '电子提单',
                        '2.6': '入库',
                        '2.7': '转货权',
                        '2.8': '质量异议',
                        '2.9': '销售开票',
                        '2.10': '采购发票'
                    };
                    const category = names[major] || '';
                    if (category) {
                        return ` > <a href="javascript:void(0)" onclick="switchTab('xiaoshou')">销售</a> > ${category} > ${pageNameMap[pageId] || pageId}`;
                    }
                }
                return ` > <a href="javascript:void(0)" onclick="switchTab('xiaoshou')">销售</a> > ${pageNameMap[pageId] || pageId}`;
            }
            if (tab === 'caiwu') {
                return ` > <a href="javascript:void(0)" onclick="switchTab('caiwu')">财务</a> > ${pageNameMap[pageId] || pageId}`;
            }
            if (tab === 'qita') {
                return ` > <a href="javascript:void(0)" onclick="switchTab('qita')">其他</a> > ${pageNameMap[pageId] || pageId}`;
            }
            return ` > ${tab}`;
        }

        function getPageTitle(mdText) {
            const match = mdText.match(/^#\s+(.+)$/m);
            return match ? match[1] : '页面';
        }

        function switchTab(tab) {
            document.querySelectorAll('.top-nav .nav-item').forEach(n => n.classList.remove('active'));
            document.querySelector(`.top-nav .nav-item[data-tab="${tab}"]`)?.classList.add('active');
            document.querySelectorAll('.sidebar-group').forEach(g => {
                g.classList.toggle('active', g.dataset.group === tab);
            });
            if (tab === 'home') {
                currentPageId = 'home';
                document.querySelectorAll('.sidebar .sub-items a').forEach(a => a.classList.remove('active'));
                loadContent('home', 'home');
                return;
            }
            const activeGroup = document.querySelector(`.sidebar-group.active`);
            if (activeGroup) {
                const firstLink = activeGroup.querySelector('.sub-items a');
                if (firstLink) {
                    document.querySelectorAll('.sidebar .sub-items a').forEach(a => a.classList.remove('active'));
                    firstLink.classList.add('active');
                    const pageId = firstLink.dataset.page;
                    if (pageId) {
                        currentPageId = pageId;
                        loadContent(tab, pageId);
                    }
                }
            }
        }

        function bindSidebarEvents() {
            document.querySelectorAll('.sidebar .menu-group .group-title').forEach(el => {
                el.removeEventListener('click', toggleMenu);
                el.addEventListener('click', toggleMenu);
            });
            document.querySelectorAll('.sidebar .sub-items a').forEach(link => {
                link.removeEventListener('click', handleMenuItemClick);
                link.addEventListener('click', handleMenuItemClick);
            });
        }

        function toggleMenu(e) {
            const el = e.currentTarget;
            const arrow = el.querySelector('.arrow');
            const subItems = el.nextElementSibling;
            if (subItems && subItems.classList.contains('sub-items')) {
                subItems.classList.toggle('open');
                if (arrow) arrow.classList.toggle('open');
            }
            e.stopPropagation();
        }

        function handleMenuItemClick(e) {
            e.preventDefault();
            const link = e.currentTarget;
            const pageId = link.dataset.page;
            if (!pageId) return;

            const parentGroup = link.closest('.sidebar-group');
            let tab = parentGroup ? parentGroup.dataset.group : 'home';

            if (tab === 'zhunru' || tab === 'caigou' || tab === 'xiaoshou' || tab === 'caiwu' || tab === 'qita') {
                currentPageId = pageId;
                currentTab = tab;
            } else {
                const parts = pageId.split('-');
                tab = parts[0] || 'home';
                currentPageId = pageId;
                currentTab = tab;
            }

            document.querySelectorAll('.sidebar .sub-items a').forEach(a => a.classList.remove('active'));
            link.classList.add('active');

            document.querySelectorAll('.top-nav .nav-item').forEach(n => n.classList.remove('active'));
            const navMap = {
                'home': '首页',
                'zhunru': '准入',
                'caigou': '采购',
                'xiaoshou': '销售',
                'caiwu': '财务',
                'qita': '其他'
            };
            const navText = navMap[tab];
            document.querySelectorAll('.top-nav .nav-item').forEach(n => {
                if (n.textContent.trim() === navText) {
                    n.classList.add('active');
                }
            });

            document.querySelectorAll('.sidebar-group').forEach(g => {
                g.classList.toggle('active', g.dataset.group === tab);
            });

            loadContent(tab, pageId);
        }

        function highlightSidebarItem(pageId) {
            document.querySelectorAll('.sidebar .sub-items a').forEach(a => {
                a.classList.toggle('active', a.dataset.page === pageId);
            });
        }

        document.querySelectorAll('.top-nav .nav-item').forEach(item => {
            item.addEventListener('click', function() {
                const tab = this.dataset.tab;
                if (!tab) return;
                switchTab(tab);
            });
        });

        function generateTOC() {
            const tocList = document.getElementById('tocList');
            const tocWrapper = document.getElementById('tocWrapper');
            tocList.innerHTML = '';

            const contentArea = document.querySelector('.content-area .page-content');
            if (!contentArea) {
                tocWrapper.classList.add('empty');
                return;
            }

            const headings = contentArea.querySelectorAll('h2');
            if (headings.length === 0) {
                tocWrapper.classList.add('empty');
                return;
            }

            tocWrapper.classList.remove('empty');

            headings.forEach((h2, index) => {
                if (!h2.id) {
                    h2.id = 'toc-' + index;
                }
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = '#' + h2.id;
                a.textContent = h2.textContent;
                a.dataset.target = h2.id;
                li.appendChild(a);
                tocList.appendChild(li);
            });

            tocList.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const targetId = this.dataset.target;
                    const targetEl = document.getElementById(targetId);
                    if (targetEl) {
                        targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        tocList.querySelectorAll('a').forEach(a => a.classList.remove('active-toc'));
                        this.classList.add('active-toc');
                    }
                });
            });

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const id = entry.target.id;
                        tocList.querySelectorAll('a').forEach(a => {
                            a.classList.toggle('active-toc', a.dataset.target === id);
                        });
                    }
                });
            }, { threshold: 0.3 });

            headings.forEach(h2 => observer.observe(h2));
        }

        async function init() {
            await loadSidebar();
            await loadContent('home', 'home');
        }

        document.addEventListener('DOMContentLoaded', init);
        window.switchTab = switchTab;
    </script>
