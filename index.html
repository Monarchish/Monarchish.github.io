<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>支援未来 · 工作文档中心</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
    font-family: 'PingFang SC', 'Microsoft YaHei', 'Inter', -apple-system, sans-serif;
    background: #f5f7fa;
    color: #1a1a1a;
    line-height: 1.6;
}
a { text-decoration: none; color: #3a84ff; cursor: pointer; }
a:hover { text-decoration: underline; }

/* ===== 顶部导航 ===== */
.top-nav {
    display: flex;
    align-items: center;
    padding: 0 40px;
    height: 52px;
    background: #1e2a3a;
    position: sticky;
    top: 0;
    z-index: 100;
}
.top-nav .logo {
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    margin-right: 40px;
    white-space: nowrap;
    letter-spacing: 0.5px;
}
.top-nav .logo span { color: #3a84ff; }
.top-nav .nav-item {
    padding: 0 20px;
    height: 52px;
    font-size: 14px;
    font-weight: 500;
    color: rgba(255,255,255,0.7);
    cursor: pointer;
    border: none;
    background: transparent;
    display: flex;
    align-items: center;
    font-family: inherit;
}
.top-nav .nav-item:hover { color: #fff; }
.top-nav .nav-item.active { color: #fff; }
.top-nav .nav-item.active::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 20px;
    height: 3px;
    background: #3a84ff;
    border-radius: 2px 2px 0 0;
}

/* ===== 主体布局 ===== */
.app {
    display: flex;
    max-width: 1440px;
    margin: 0 auto;
    background: #fff;
    box-shadow: 0 0 40px rgba(0,0,0,0.05);
    min-height: calc(100vh - 52px);
}
.main-body { display: flex; flex: 1; }

/* ===== 左侧边栏 ===== */
.sidebar {
    width: 260px;
    flex-shrink: 0;
    background: #fafbfc;
    border-right: 1px solid #e9edf4;
    padding: 16px 8px 30px;
    overflow-y: auto;
    position: sticky;
    top: 52px;
    max-height: calc(100vh - 52px);
}
.sidebar-category {
    font-size: 14px;
    font-weight: 600;
    color: #1e2a3a;
    padding: 8px 12px 12px;
    border-bottom: 1px solid #e9edf4;
    margin-bottom: 8px;
}
.menu-group { margin-bottom: 2px; }
.group-title {
    font-size: 13px;
    font-weight: 500;
    color: #1e2a3a;
    padding: 6px 12px 4px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-radius: 4px;
    user-select: none;
}
.group-title:hover { background: #f0f4fe; }
.group-title .arrow {
    font-size: 10px;
    color: #8a9aa8;
    transition: transform 0.2s;
}
.group-title .arrow.open { transform: rotate(90deg); }
.sub-items {
    padding-left: 4px;
    overflow: hidden;
    max-height: 0;
    transition: max-height 0.25s ease;
}
.sub-items.open { max-height: 1200px; }
.sub-items a {
    display: block;
    padding: 4px 12px 4px 28px;
    font-size: 13px;
    color: #4a5a6e;
    border-radius: 4px;
    border-left: 2px solid transparent;
    cursor: pointer;
}
.sub-items a:hover { background: #eef3fe; color: #3a84ff; }
.sub-items a.active {
    background: #eef3fe;
    color: #3a84ff;
    font-weight: 500;
    border-left-color: #3a84ff;
}
.sub-faq .group-title { padding-left: 28px; font-size: 13px; }
.sub-faq .sub-items a { padding-left: 44px; }

/* ===== 内容区 ===== */
.content-wrapper { flex: 1; display: flex; min-width: 0; }
.content-area {
    flex: 1;
    padding: 28px 40px 50px;
    max-width: 860px;
}
.breadcrumb {
    font-size: 13px;
    color: #8a9aa8;
    margin-bottom: 12px;
}
.breadcrumb a { color: #3a84ff; }
.page-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #eef2f6;
    padding-bottom: 14px;
    margin-bottom: 20px;
}
.page-header h1 {
    font-size: 22pt;
    font-weight: 600;
    color: #1a1a1a;
    margin: 0;
}
.edit-btn {
    background: #f0f4fe;
    color: #3a84ff;
    border: none;
    padding: 5px 14px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
}
.edit-btn:hover { background: #dce6fa; }

/* ===== Markdown 渲染 ===== */
.page-content h1 { display: none; }
.page-content h2 {
    font-size: 16pt;
    font-weight: 600;
    color: #1a1a1a;
    margin: 28px 0 12px;
    border-bottom: 1px solid #f0f2f5;
    padding-bottom: 6px;
}
.page-content h3 {
    font-size: 13pt;
    font-weight: 600;
    color: #2c2c2c;
    margin: 18px 0 8px;
}
.page-content h4 {
    font-size: 11.5pt;
    font-weight: 600;
    color: #333;
    margin: 14px 0 6px;
}
.page-content p {
    margin-bottom: 12px;
    font-size: 11pt;
    line-height: 1.6;
}
.page-content ul, .page-content ol {
    padding-left: 22px;
    margin-bottom: 12px;
}
.page-content li { margin-bottom: 5px; font-size: 11pt; }
.page-content table {
    border-collapse: collapse;
    width: 100%;
    margin: 16px 0;
}
.page-content th, .page-content td {
    border: 1px solid #e9edf4;
    padding: 8px 14px;
    text-align: left;
    font-size: 11pt;
}
.page-content th { background: #f5f7fa; font-weight: 600; }
.page-content blockquote {
    border-left: 4px solid #3a84ff;
    padding: 12px 20px;
    margin: 16px 0;
    background: #f5f8fe;
    border-radius: 4px;
}
.page-content pre {
    background: #f5f7fa;
    padding: 16px 20px;
    border-radius: 6px;
    overflow-x: auto;
}
.page-content code {
    background: #F2F2F2;
    color: #333;
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    font-size: 0.9em;
    border-radius: 3px;
    padding: 1px 8px;
    font-weight: 900;
}
.footer-meta {
    margin-top: 40px;
    padding-top: 16px;
    border-top: 1px solid #eef2f6;
    font-size: 13px;
    color: #8a9aa8;
}

/* ===== 右侧 TOC ===== */
.toc-wrapper {
    width: 200px;
    flex-shrink: 0;
    padding: 28px 16px 30px;
    background: #fafbfc;
    border-left: 1px solid #e9edf4;
    position: sticky;
    top: 52px;
    max-height: calc(100vh - 52px);
    overflow-y: auto;
}
.toc-wrapper .toc-title {
    font-size: 13px;
    font-weight: 600;
    color: #1e2a3a;
    padding-bottom: 10px;
    border-bottom: 1px solid #e9edf4;
    margin-bottom: 10px;
}
.toc-wrapper .toc-list { list-style: none; }
.toc-wrapper .toc-list li { margin-bottom: 4px; }
.toc-wrapper .toc-list a {
    display: block;
    padding: 4px 8px;
    font-size: 13px;
    color: #4a5a6e;
    border-radius: 4px;
    border-left: 2px solid transparent;
}
.toc-wrapper .toc-list a:hover { background: #eef3fe; color: #3a84ff; }
.toc-wrapper .toc-list a.active-toc {
    background: #eef3fe;
    color: #3a84ff;
    border-left-color: #3a84ff;
    font-weight: 500;
}
.toc-wrapper.empty { display: none; }

/* ===== 加载状态 ===== */
#contentLoader {
    padding: 60px 0;
    text-align: center;
    color: #8a9aa8;
    font-size: 14px;
}
.loading-spinner {
    display: inline-block;
    width: 24px;
    height: 24px;
    border: 3px solid #e0e0e0;
    border-top-color: #3a84ff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 8px;
    vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 1024px) { .toc-wrapper { display: none !important; } }
@media (max-width: 768px) {
    .top-nav { padding: 0 12px; flex-wrap: wrap; height: auto; }
    .top-nav .logo { margin-right: 16px; font-size: 14px; }
    .top-nav .nav-item { padding: 0 12px; height: 40px; font-size: 13px; }
    .sidebar { width: 200px; position: relative; top: 0; max-height: none; }
    .content-area { padding: 16px 14px 30px; max-width: 100%; }
    .main-body { flex-direction: column; }
    .content-wrapper { flex-direction: column; }
}
</style>
</head>
<body>

<header class="top-nav">
    <div class="logo">支援<span>未来</span></div>
    <button class="nav-item active" data-tab="home">首页</button>
    <button class="nav-item" data-tab="zhunru">准入</button>
    <button class="nav-item" data-tab="caigou">采购</button>
    <button class="nav-item" data-tab="xiaoshou">销售</button>
    <button class="nav-item" data-tab="caiwu">财务</button>
    <button class="nav-item" data-tab="qita">其他</button>
</header>

<div class="app">
    <div class="main-body">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="content-wrapper">
            <main class="content-area" id="contentArea">
                <div id="contentLoader">
                    <span class="loading-spinner"></span>
                    加载中...
                </div>
            </main>
            <aside class="toc-wrapper" id="tocWrapper">
                <div class="toc-title">本页指引</div>
                <ul class="toc-list" id="tocList"></ul>
            </aside>
        </div>
    </div>
</div>

<script>
// ===== 页面配置 =====
const PAGES = {
    home: { dir: '', file: 'home.md', label: '首页' },
    zhunru: { dir: 'zhunru', label: '准入' },
    caigou: { dir: 'caigou', label: '采购' },
    xiaoshou: { dir: 'xiaoshou', label: '销售' },
    caiwu: { dir: 'caiwu', label: '财务' },
    qita: { dir: 'qita', label: '其他' }
};

let currentTab = 'home';
let currentPageId = 'home';

// ===== 侧边栏 =====
document.addEventListener('DOMContentLoaded', async () => {
    try {
        const resp = await fetch('sidebar.html');
        document.getElementById('sidebar').innerHTML = await resp.text();
        bindSidebarEvents();
    } catch (e) {
        document.getElementById('sidebar').innerHTML = '<div style="padding:20px;text-align:center;color:#999;">侧边栏加载失败</div>';
    }
    loadContent('home', 'home');
});

function bindSidebarEvents() {
    document.querySelectorAll('.group-title').forEach(el => {
        el.addEventListener('click', function() {
            const arrow = this.querySelector('.arrow');
            const sub = this.nextElementSibling;
            if (sub && sub.classList.contains('sub-items')) {
                sub.classList.toggle('open');
                if (arrow) arrow.classList.toggle('open');
            }
        });
    });
    document.querySelectorAll('.sub-items a').forEach(el => {
        el.addEventListener('click', function(e) {
            e.preventDefault();
            const pageId = this.dataset.page;
            if (!pageId) return;
            const group = this.closest('.sidebar-group');
            const tab = group ? group.dataset.group : 'home';
            document.querySelectorAll('.sub-items a').forEach(a => a.classList.remove('active'));
            this.classList.add('active');
            document.querySelectorAll('.top-nav .nav-item').forEach(n => n.classList.remove('active'));
            const navBtn = document.querySelector(`.top-nav .nav-item[data-tab="${tab}"]`);
            if (navBtn) navBtn.classList.add('active');
            document.querySelectorAll('.sidebar-group').forEach(g => g.classList.toggle('active', g.dataset.group === tab));
            currentTab = tab;
            currentPageId = pageId;
            loadContent(tab, pageId);
        });
    });
}

// ===== 顶部导航切换 =====
document.querySelectorAll('.top-nav .nav-item').forEach(btn => {
    btn.addEventListener('click', function() {
        const tab = this.dataset.tab;
        if (tab === 'home') {
            switchTab('home', 'home');
            return;
        }
        document.querySelectorAll('.sidebar-group').forEach(g => g.classList.toggle('active', g.dataset.group === tab));
        const firstLink = document.querySelector(`.sidebar-group[data-group="${tab}"] .sub-items a`);
        if (firstLink) {
            document.querySelectorAll('.sub-items a').forEach(a => a.classList.remove('active'));
            firstLink.classList.add('active');
            switchTab(tab, firstLink.dataset.page);
        } else {
            switchTab(tab, tab);
        }
    });
});

function switchTab(tab, pageId) {
    document.querySelectorAll('.top-nav .nav-item').forEach(n => n.classList.remove('active'));
    const btn = document.querySelector(`.top-nav .nav-item[data-tab="${tab}"]`);
    if (btn) btn.classList.add('active');
    currentTab = tab;
    currentPageId = pageId;
    loadContent(tab, pageId);
}

// ===== 加载内容 =====
async function loadContent(tab, pageId) {
    const cfg = PAGES[tab] || { dir: tab };
    const loader = document.getElementById('contentLoader');
    const tocWrapper = document.getElementById('tocWrapper');
    const tocList = document.getElementById('tocList');

    loader.innerHTML = '<span class="loading-spinner"></span> 加载中...';
    tocList.innerHTML = '';
    tocWrapper.classList.add('empty');

    let filePath;
    if (tab === 'home') {
        filePath = 'home.md';
    } else if (pageId) {
        filePath = `docs/${cfg.dir}/${pageId}.md`;
    } else {
        filePath = `docs/${cfg.dir}.md`;
    }

    try {
        const resp = await fetch(filePath);
        if (!resp.ok) throw new Error('文件不存在');
        const md = await resp.text();

        const titleMatch = md.match(/^#\s+(.+)$/m);
        const pageTitle = titleMatch ? titleMatch[1] : '页面';

        const body = md.replace(/^#\s+.+\n/, '');
        let html = marked.parse(body);

        // 关键词高亮
        const keywords = ['Open','Write','Left Click','Right Click','Double Click',
            'Filter','Ctrl + C','Ctrl + V','Ctrl + D','Ctrl + F',
            'Ctrl + S','Ctrl + Alt + A','Ctrl + Alt + P','Ctrl + N',
            'Ctrl + ;','Enter','Esc','Alt + 2','Alt + 5','Or','And'];
        const sorted = [...keywords].sort((a,b) => b.length - a.length);
        for (const kw of sorted) {
            const escaped = kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            html = html.replace(new RegExp('(?![^<]*>)' + escaped + '(?![^<]*>)', 'g'),
                `<span style="background:#F2F2F2;color:#333;font-family:SF Mono,Fira Code,Consolas,monospace;font-size:0.9em;border-radius:3px;padding:1px 8px;font-weight:900;">${kw}</span>`);
        }

        loader.innerHTML = `
            <div class="breadcrumb"><a href="javascript:void(0)" onclick="switchTab('home','home')">支援未来</a> > ${pageTitle}</div>
            <div class="page-header">
                <h1>${pageTitle}</h1>
                <a class="edit-btn" href="https://github.com/Monarchish/Monarchish.github.io/edit/main/${filePath}" target="_blank">编辑此页</a>
            </div>
            <div class="page-content markdown-body">${html}</div>
            <div class="footer-meta">最近更新：2026-08-19</div>
        `;

        // 生成右侧 TOC
        const headings = loader.querySelectorAll('.page-content h2');
        if (headings.length > 0) {
            tocWrapper.classList.remove('empty');
            headings.forEach((h2, i) => {
                if (!h2.id) h2.id = 'toc-' + i;
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = '#' + h2.id;
                a.textContent = h2.textContent;
                a.dataset.target = h2.id;
                a.addEventListener('click', function(e) {
                    e.preventDefault();
                    document.getElementById(this.dataset.target)?.scrollIntoView({ behavior: 'smooth' });
                    tocList.querySelectorAll('a').forEach(x => x.classList.remove('active-toc'));
                    this.classList.add('active-toc');
                });
                li.appendChild(a);
                tocList.appendChild(li);
            });
            new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        tocList.querySelectorAll('a').forEach(a => a.classList.toggle('active-toc', a.dataset.target === entry.target.id));
                    }
                });
            }, { threshold: 0.3 }).forEach(h2 => observer.observe(h2));
        }

        window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (e) {
        loader.innerHTML = `<div style="padding:40px;color:#c00;"><h2>加载失败</h2><p>${filePath} 不存在或无法访问</p></div>`;
    }
}

window.switchTab = switchTab;
</script>
</body>
</html>
