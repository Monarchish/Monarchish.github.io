<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>支援未来 · 工作文档中心</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f5f7fa;
            color: #1e2a3a;
            line-height: 1.6;
        }
        a {
            text-decoration: none;
            color: #3a84ff;
        }
        .app {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            max-width: 1440px;
            margin: 0 auto;
            background: #ffffff;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.05);
        }
        .top-nav {
            display: flex;
            align-items: center;
            padding: 0 40px;
            height: 60px;
            background: #ffffff;
            border-bottom: 1px solid #e9edf4;
            flex-shrink: 0;
            gap: 6px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .top-nav .logo {
            font-size: 18px;
            font-weight: 600;
            color: #3a84ff;
            margin-right: 32px;
            white-space: nowrap;
        }
        .top-nav .nav-item {
            padding: 6px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            color: #4a5a6e;
            cursor: pointer;
            transition: all 0.15s ease;
            border: none;
            background: transparent;
        }
        .top-nav .nav-item:hover {
            background: #f0f4fe;
            color: #3a84ff;
        }
        .top-nav .nav-item.active {
            background: #eef3fe;
            color: #3a84ff;
        }
        .main-body {
            display: flex;
            flex: 1;
            position: relative;
        }
        .sidebar {
            width: 260px;
            background: #fafbfc;
            border-right: 1px solid #e9edf4;
            padding: 12px 8px 30px 8px;
            flex-shrink: 0;
            overflow-y: auto;
            max-height: calc(100vh - 60px);
            position: sticky;
            top: 60px;
        }
        .sidebar .menu-group {
            margin-bottom: 2px;
        }
        .sidebar .menu-group .group-title {
            font-size: 13px;
            font-weight: 600;
            color: #1e2a3a;
            padding: 8px 12px 4px 12px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 6px;
            transition: background 0.1s;
            user-select: none;
        }
        .sidebar .menu-group .group-title:hover {
            background: #f0f4fe;
        }
        .sidebar .menu-group .group-title .arrow {
            font-size: 11px;
            color: #8a9aa8;
            transition: transform 0.2s;
        }
        .sidebar .menu-group .group-title .arrow.open {
            transform: rotate(90deg);
        }
        .sidebar .menu-group .sub-items {
            padding-left: 4px;
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.3s ease;
        }
        .sidebar .menu-group .sub-items.open {
            max-height: 1200px;
        }
        .sidebar .menu-group .sub-items a {
            display: block;
            padding: 5px 12px 5px 28px;
            font-size: 14px;
            color: #4a5a6e;
            border-radius: 4px;
            transition: all 0.1s;
            cursor: pointer;
            border-left: 2px solid transparent;
        }
        .sidebar .menu-group .sub-items a:hover {
            background: #eef3fe;
            color: #3a84ff;
        }
        .sidebar .menu-group .sub-items a.active {
            background: #eef3fe;
            color: #3a84ff;
            font-weight: 500;
            border-left-color: #3a84ff;
        }
        .content-wrapper {
            flex: 1;
            display: flex;
            min-height: 600px;
        }
        .content-area {
            flex: 1;
            padding: 28px 40px 50px 40px;
            background: #ffffff;
            min-width: 0;
        }
        .content-area .breadcrumb {
            font-size: 13px;
            color: #8a9aa8;
            margin-bottom: 12px;
        }
        .content-area .breadcrumb span {
            color: #4a5a6e;
        }
        .content-area .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eef2f6;
            padding-bottom: 14px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .content-area .page-header h1 {
            font-size: 24px;
            font-weight: 600;
            color: #1e2a3a;
        }
        .content-area .page-header .edit-btn {
            background: #f0f4fe;
            color: #3a84ff;
            border: none;
            padding: 5px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .content-area .page-header .edit-btn:hover {
            background: #dce6fa;
        }
        .content-area .page-content {
            font-size: 15px;
            color: #2c3e50;
        }
        .content-area .page-content h2 {
            font-size: 19px;
            font-weight: 600;
            margin: 28px 0 12px 0;
            color: #1e2a3a;
            padding-top: 8px;
            border-bottom: 1px solid #f0f2f5;
            padding-bottom: 6px;
        }
        .content-area .page-content h3 {
            font-size: 16px;
            font-weight: 600;
            margin: 18px 0 8px 0;
            color: #2c3e50;
        }
        .content-area .page-content p {
            margin-bottom: 12px;
        }
        .content-area .page-content ul {
            padding-left: 22px;
            margin-bottom: 12px;
        }
        .content-area .page-content li {
            margin-bottom: 5px;
        }
        .content-area .page-content .faq-list {
            margin-top: 8px;
        }
        .content-area .page-content .faq-item {
            background: #f8fafe;
            border-left: 3px solid #3a84ff;
            padding: 12px 18px;
            border-radius: 4px;
            margin-bottom: 12px;
        }
        .content-area .page-content .faq-item .faq-q {
            font-weight: 600;
            color: #1e2a3a;
        }
        .content-area .page-content .faq-item .faq-a {
            margin-top: 4px;
            color: #3a4a5e;
        }
        .content-area .footer-meta {
            margin-top: 40px;
            padding-top: 16px;
            border-top: 1px solid #eef2f6;
            font-size: 13px;
            color: #8a9aa8;
        }
        .toc-wrapper {
            width: 200px;
            flex-shrink: 0;
            padding: 28px 16px 30px 16px;
            background: #fafbfc;
            border-left: 1px solid #e9edf4;
            position: sticky;
            top: 60px;
            max-height: calc(100vh - 60px);
            overflow-y: auto;
            display: none;
        }
        .toc-wrapper.visible {
            display: block;
        }
        .toc-wrapper .toc-title {
            font-size: 13px;
            font-weight: 600;
            color: #1e2a3a;
            padding-bottom: 10px;
            border-bottom: 1px solid #e9edf4;
            margin-bottom: 10px;
        }
        .toc-wrapper .toc-list {
            list-style: none;
            padding: 0;
        }
        .toc-wrapper .toc-list li {
            margin-bottom: 4px;
        }
        .toc-wrapper .toc-list a {
            display: block;
            padding: 4px 8px;
            font-size: 13px;
            color: #4a5a6e;
            border-radius: 4px;
            transition: all 0.1s;
            border-left: 2px solid transparent;
        }
        .toc-wrapper .toc-list a:hover {
            background: #eef3fe;
            color: #3a84ff;
        }
        .toc-wrapper .toc-list a.active-toc {
            background: #eef3fe;
            color: #3a84ff;
            border-left-color: #3a84ff;
            font-weight: 500;
        }
        .page-block {
            display: none;
        }
        .page-block.active {
            display: block;
        }
        .sidebar-group {
            display: none;
        }
        .sidebar-group.active {
            display: block;
        }
        @media (max-width: 1024px) {
            .toc-wrapper {
                display: none !important;
            }
        }
        @media (max-width: 768px) {
            .top-nav {
                padding: 0 12px;
                flex-wrap: wrap;
                height: auto;
                gap: 3px;
            }
            .top-nav .logo {
                margin-right: 12px;
                font-size: 15px;
            }
            .top-nav .nav-item {
                padding: 4px 10px;
                font-size: 13px;
            }
            .sidebar {
                width: 200px;
                padding: 8px 4px;
                max-height: none;
                position: relative;
                top: 0;
            }
            .content-area {
                padding: 16px 14px 30px 14px;
            }
            .main-body {
                flex-direction: column;
            }
            .content-wrapper {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <div class="app">

        <header class="top-nav">
            <div class="logo">支援未来</div>
            <button class="nav-item active" data-tab="home">首页</button>
            <button class="nav-item" data-tab="zhunru">准入</button>
            <button class="nav-item" data-tab="caigou">采购</button>
            <button class="nav-item" data-tab="xiaoshou">销售</button>
            <button class="nav-item" data-tab="caiwu">财务</button>
            <button class="nav-item" data-tab="qita">其他</button>
        </header>

        <div class="main-body">

            <aside class="sidebar" id="sidebar"></aside>

            <div class="content-wrapper">

                <main class="content-area" id="contentArea">
                    <div id="contentLoader">加载中...</div>
                </main>

                <aside class="toc-wrapper" id="tocWrapper">
                    <div class="toc-title">本页指引</div>
                    <ul class="toc-list" id="tocList"></ul>
                </aside>

            </div>
        </div>
    </div>

    <script>
        const contentMap = {
            'home': 'content/home.html',
            'zhunru': 'content/zhunru.html',
            'caigou': 'content/caigou.html',
            'xiaoshou': 'content/xiaoshou.html',
            'caiwu': 'content/caiwu.html',
            'qita': 'content/qita.html'
        };

        let currentTab = 'home';
        let currentPageId = 'home';

        async function loadSidebar() {
            try {
                const resp = await fetch('sidebar.html');
                const html = await resp.text();
                document.getElementById('sidebar').innerHTML = html;
                bindSidebarEvents();
                highlightSidebarItem('home');
            } catch (e) {
                console.warn('侧边栏加载失败', e);
            }
        }

        async function loadContent(tab, pageId) {
            const loader = document.getElementById('contentLoader');

            // 判断文件路径
            let filePath;
            if (tab === 'zhunru') {
                // 准入分类：从 content/准入/ 文件夹加载
                filePath = `content/准入/${pageId}.html`;
            } else {
                // 其他分类：从 content/ 文件夹加载
                filePath = `content/${tab}.html`;
            }

            try {
                const resp = await fetch(filePath);
                if (!resp.ok) {
                    loader.innerHTML = `<p>页面加载失败，请刷新重试。</p>`;
                    return;
                }
                const html = await resp.text();
                loader.innerHTML = html;
                generateTOC();
                document.getElementById('contentArea').scrollTop = 0;
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } catch (e) {
                console.error('内容加载失败:', e);
                loader.innerHTML = `<p>内容加载失败，请刷新重试。</p>`;
            }
        }

        function bindSidebarEvents() {
            document.querySelectorAll('.sidebar .menu-group .group-title').forEach(el => {
                el.removeEventListener('click', toggleMenu);
                el.addEventListener('click', toggleMenu);
            });
            document.querySelectorAll('.sidebar .sub-items a').forEach(link => {
                link.removeEventListener('click', handleMenuItemClick);
                link.addEventListener('click', handleMenuItemClick);
            });
        }

        function toggleMenu(e) {
            const el = e.currentTarget;
            const arrow = el.querySelector('.arrow');
            const subItems = el.nextElementSibling;
            if (subItems && subItems.classList.contains('sub-items')) {
                subItems.classList.toggle('open');
                if (arrow) arrow.classList.toggle('open');
            }
        }

        function handleMenuItemClick(e) {
            e.preventDefault();
            const link = e.currentTarget;
            const pageId = link.dataset.page;
            if (!pageId) return;

            // 根据点击的菜单项判断所属 tab
            const parentGroup = link.closest('.sidebar-group');
            let tab = parentGroup ? parentGroup.dataset.group : 'home';

            // 如果 tab 是 zhunru，直接使用 pageId（已经包含序号）
            if (tab === 'zhunru') {
                currentPageId = pageId;
                currentTab = tab;
            } else {
                // 其他分类：从 pageId 中提取 tab
                const parts = pageId.split('-');
                tab = parts[0] || 'home';
                currentPageId = pageId;
                currentTab = tab;
            }

            // 高亮侧边栏
            document.querySelectorAll('.sidebar .sub-items a').forEach(a => a.classList.remove('active'));
            link.classList.add('active');

            // 更新顶部导航高亮
            document.querySelectorAll('.top-nav .nav-item').forEach(n => n.classList.remove('active'));
            const navMap = {
                'home': '首页',
                'zhunru': '准入',
                'caigou': '采购',
                'xiaoshou': '销售',
                'caiwu': '财务',
                'qita': '其他'
            };
            const navText = navMap[tab];
            document.querySelectorAll('.top-nav .nav-item').forEach(n => {
                if (n.textContent.trim() === navText) {
                    n.classList.add('active');
                }
            });

            // 切换侧边栏显示
            document.querySelectorAll('.sidebar-group').forEach(g => {
                g.classList.toggle('active', g.dataset.group === tab);
            });

            // 加载内容
            loadContent(tab, pageId);
        }

        function highlightSidebarItem(pageId) {
            document.querySelectorAll('.sidebar .sub-items a').forEach(a => {
                a.classList.toggle('active', a.dataset.page === pageId);
            });
        }

        // 顶部导航切换
        document.querySelectorAll('.top-nav .nav-item').forEach(item => {
            item.addEventListener('click', function() {
                const tab = this.dataset.tab;
                if (!tab) return;

                currentTab = tab;

                document.querySelectorAll('.top-nav .nav-item').forEach(n => n.classList.remove('active'));
                this.classList.add('active');

                document.querySelectorAll('.sidebar-group').forEach(g => {
                    g.classList.toggle('active', g.dataset.group === tab);
                });

                if (tab === 'home') {
                    currentPageId = 'home';
                    document.querySelectorAll('.sidebar .sub-items a').forEach(a => a.classList.remove('active'));
                    loadContent('home', 'home');
                    return;
                }

                // 如果切换到 zhunru，激活第一个菜单项
                if (tab === 'zhunru') {
                    const activeGroup = document.querySelector('.sidebar-group.active');
                    if (activeGroup) {
                        const firstLink = activeGroup.querySelector('.sub-items a');
                        if (firstLink) {
                            document.querySelectorAll('.sidebar .sub-items a').forEach(a => a.classList.remove('active'));
                            firstLink.classList.add('active');
                            const pageId = firstLink.dataset.page;
                            if (pageId) {
                                currentPageId = pageId;
                                loadContent(tab, pageId);
                            }
                        }
                    }
                    return;
                }

                // 其他分类：激活第一个菜单项
                const activeGroup = document.querySelector(`.sidebar-group.active`);
                if (activeGroup) {
                    const firstLink = activeGroup.querySelector('.sub-items a');
                    if (firstLink) {
                        document.querySelectorAll('.sidebar .sub-items a').forEach(a => a.classList.remove('active'));
                        firstLink.classList.add('active');
                        const pageId = firstLink.dataset.page;
                        if (pageId) {
                            currentPageId = pageId;
                            loadContent(tab, pageId);
                        }
                    }
                }
            });
        });

        function generateTOC() {
            const tocList = document.getElementById('tocList');
            const tocWrapper = document.getElementById('tocWrapper');
            tocList.innerHTML = '';

            const contentArea = document.querySelector('.content-area .page-content');
            if (!contentArea) {
                tocWrapper.classList.remove('visible');
                return;
            }

            const headings = contentArea.querySelectorAll('h2');
            if (headings.length === 0) {
                tocWrapper.classList.remove('visible');
                return;
            }

            tocWrapper.classList.add('visible');

            headings.forEach((h2, index) => {
                if (!h2.id) {
                    h2.id = 'toc-' + index;
                }
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = '#' + h2.id;
                a.textContent = h2.textContent;
                a.dataset.target = h2.id;
                li.appendChild(a);
                tocList.appendChild(li);
            });

            tocList.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const targetId = this.dataset.target;
                    const targetEl = document.getElementById(targetId);
                    if (targetEl) {
                        targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        tocList.querySelectorAll('a').forEach(a => a.classList.remove('active-toc'));
                        this.classList.add('active-toc');
                    }
                });
            });

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const id = entry.target.id;
                        tocList.querySelectorAll('a').forEach(a => {
                            a.classList.toggle('active-toc', a.dataset.target === id);
                        });
                    }
                });
            }, { threshold: 0.3 });

            headings.forEach(h2 => observer.observe(h2));
        }

        function fixEditButtons() {}

        async function init() {
            await loadSidebar();
            await loadContent('home', 'home');
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>

</body>
</html>
