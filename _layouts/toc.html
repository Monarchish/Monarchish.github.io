<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #ffffff;
      color: #1a1a1a;
      display: flex;
    }
    #sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 300px;
      height: 100vh;
      overflow-y: auto;
      background: #f8f9fa;
      border-right: 1px solid #e0e0e0;
      padding: 20px 16px;
      z-index: 100;
    }
    #sidebar h1 {
      font-size: 1.4rem;
      margin-bottom: 16px;
      color: #1a1a1a;
    }
    details { margin-bottom: 4px; }
    summary {
      cursor: pointer;
      list-style: none;
      font-weight: 600;
      color: #333;
      padding: 4px 0;
      font-size: 0.95rem;
    }
    summary:hover { color: #6c63ff; }
    details[open] > summary { color: #6c63ff; }
    details details { margin-left: 16px; }
    .level4 {
      display: block;
      margin-left: 24px;
      padding: 4px 0;
      color: #555;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .level4:hover { color: #6c63ff; }
    #content {
      margin-left: 300px;
      padding: 32px 40px;
      max-width: 1000px;
      width: 100%;
    }
    h2.end {
      font-size: 1.8rem;
      margin: 24px 0 16px;
      border-bottom: 2px solid #e0e0e0;
      padding-bottom: 8px;
    }
    h3.module {
      font-size: 1.3rem;
      margin: 20px 0 10px;
      color: #333;
    }
    h4.operation {
      font-size: 1.1rem;
      margin: 16px 0 8px;
      color: #555;
    }
    pre {
      background: #f5f5f5;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 16px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-family: "Courier New", monospace;
      font-size: 0.9rem;
      line-height: 1.5;
    }
    code {
      font-family: "Courier New", monospace;
    }
  </style>
</head>
<body>
  <div id="sidebar">
    <h1>支援未来</h1>
    <div id="toc"></div>
  </div>
  <div id="content">
    {{ content }}
  </div>

  <script>
    (function() {
      const contentDiv = document.getElementById('content');
      const tocDiv = document.getElementById('toc');
      const headers = contentDiv.querySelectorAll('h2, h3, h4');

      let currentTop = null;
      let currentModule = null;

      headers.forEach(header => {
        const tag = header.tagName.toLowerCase();
        const title = header.textContent.trim();
        const id = title.replace(/\s+/g, '-');
        header.id = id;

        if (tag === 'h2') {
          const details = document.createElement('details');
          const summary = document.createElement('summary');
          summary.textContent = title;
          details.appendChild(summary);
          tocDiv.appendChild(details);
          currentTop = details;
          currentModule = null;
        } else if (tag === 'h3') {
          const details = document.createElement('details');
          const summary = document.createElement('summary');
          summary.textContent = title;
          details.appendChild(summary);
          if (currentTop) {
            currentTop.appendChild(details);
          } else {
            tocDiv.appendChild(details);
          }
          currentModule = details;
        } else if (tag === 'h4') {
          const a = document.createElement('a');
          a.href = '#' + id;
          a.className = 'level4';
          a.textContent = title;
          if (currentModule) {
            currentModule.appendChild(a);
          } else if (currentTop) {
            currentTop.appendChild(a);
          } else {
            tocDiv.appendChild(a);
          }
        }
      });

      document.querySelectorAll('#toc > details').forEach(d => d.open = true);
      document.querySelectorAll('#toc details details').forEach(d => d.open = false);
    })();
  </script>
</body>
</html>
