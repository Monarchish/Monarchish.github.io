<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>支援未来</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Microsoft YaHei", "PingFang SC", sans-serif;
    background-color: #ffffff;
    color: #333333;
    line-height: 1.6;
    font-size: 11pt;
    display: flex;
    align-items: flex-start;
  }

  /* ========== 左侧固定目录（我们自己那套） ========== */
  #sidebar {
    position: sticky;
    top: 0;
    flex-shrink: 0;
    width: 560px;
    min-width: 560px;
    height: 100vh;
    overflow-y: auto;
    overflow-x: auto;
    background: #fafafa;
    border-right: 1px solid #e8e8e8;
    padding: 20px 16px;
    z-index: 100;
    font-family: -apple-system, BlinkMacSystemFont, "Microsoft YaHei", "PingFang SC", sans-serif;
    font-size: 12px;
    font-weight: 400;
    line-height: 1.2;
    color: #4A4A4A;
  }
  #sidebar h1 {
    font-size: 14px;
    font-weight: 600;
    color: #1a1a1a;
    padding: 0 0 12px 0;
    border-bottom: 1px solid #e8e8e8;
    margin-bottom: 8px;
    white-space: nowrap;
  }
  details { margin-bottom: 2px; }
  summary {
    cursor: pointer;
    list-style: none;
    font-weight: 400;
    color: #4A4A4A;
    padding: 4px 0;
    font-size: 12px;
    white-space: nowrap;
    transition: color 0.15s;
  }
  summary:hover { color: #0066CC; }
  details[open] > summary { color: #0066CC; }
  details details { margin-left: 14px; }

  .level4 {
    display: block;
    margin-left: 24px;
    padding: 4px 0;
    color: #4A4A4A;
    text-decoration: none;
    font-size: 12px;
    white-space: nowrap;
    transition: color 0.15s;
  }
  .level4:hover { color: #0066CC; }

  .faq-details { margin-left: 0; }
  .faq-level4 {
    font-weight: 400;
    font-size: 12px;
    color: #4A4A4A;
    padding: 4px 0;
    margin-left: 18px;
    white-space: nowrap;
    cursor: pointer;
    list-style: none;
  }
  .faq-level4:hover { color: #0066CC; }

  .level5 {
    display: block;
    margin-left: 38px;
    padding: 4px 0;
    color: #4A4A4A;
    text-decoration: none;
    font-size: 12px;
    white-space: nowrap;
  }
  .level5:hover { color: #0066CC; }

  /* ========== 右侧正文区（智能文档风格） ========== */
  #content {
    flex: 1;
    padding: 40px 48px 80px 48px;
    max-width: 900px;
    min-width: 0;
  }

  /* 文档大标题 */
  .doc-title {
    font-size: 22pt;
    font-weight: bold;
    text-align: center;
    color: #000000;
    line-height: 1.4;
    margin-bottom: 48px;
    padding-bottom: 24px;
    border-bottom: 2px solid #e0e0e0;
  }

  /* 标题1：第一层 */
  h1 {
    font-size: 18pt;
    font-weight: bold;
    color: #1a1a1a;
    line-height: 1.4;
    margin-top: 36px;
    margin-bottom: 18px;
    padding-bottom: 8px;
    border-bottom: 1px solid #e8e8e8;
  }

  /* 标题2：第二层 */
  h2 {
    font-size: 15pt;
    font-weight: bold;
    color: #2c3e50;
    line-height: 1.4;
    margin-top: 28px;
    margin-bottom: 14px;
  }

  /* 标题3：第三层 */
  h3 {
    font-size: 13pt;
    font-weight: bold;
    color: #34495e;
    line-height: 1.4;
    margin-top: 20px;
    margin-bottom: 10px;
  }

  /* 标题4：第四层（FAQ条目） */
  h4 {
    font-size: 11.5pt;
    font-weight: bold;
    color: #2c3e50;
    line-height: 1.4;
    margin-top: 16px;
    margin-bottom: 8px;
  }

  /* 普通正文段落 */
  p {
    font-size: 11pt;
    line-height: 1.6;
    color: #333333;
    text-align: justify;
    margin-bottom: 8px;
  }

  /* 🔔 高亮块（蓝色） */
  .highlight-block {
    background-color: #E6EEFA;
    border-left: 4px solid #98C1FF;
    border-radius: 4px;
    padding: 10px 20px;
    margin: 12px 0;
    line-height: 1.6;
    font-size: 11pt;
    color: #333333;
  }
  .highlight-block p {
    margin-bottom: 6px;
  }
  .highlight-block p:last-child {
    margin-bottom: 0;
  }

  /* ⚠️ 警告块 */
  .warning-block {
    background-color: #FFF3E0;
    border-left: 4px solid #FFB74D;
    border-radius: 4px;
    padding: 10px 20px;
    margin: 12px 0;
    line-height: 1.6;
    font-size: 11pt;
    color: #333333;
  }
  .warning-block p {
    margin-bottom: 6px;
  }
  .warning-block p:last-child {
    margin-bottom: 0;
  }

  /* 行内代码 */
  code, .inline-code {
    font-family: "SF Mono", "Fira Code", "Consolas", "Courier New", monospace;
    font-size: 10pt;
    color: #d63384;
    background-color: #F2F2F2;
    padding: 2px 6px;
    border-radius: 3px;
  }

  /* 代码块 */
  pre {
    background-color: #F2F2F2;
    border: 1px solid #e0e0e0;
    border-radius: 4px;
    padding: 12px 16px;
    margin: 12px 0;
    overflow-x: auto;
    font-family: "SF Mono", "Fira Code", "Consolas", "Courier New", monospace;
    font-size: 10pt;
    line-height: 1.5;
    color: #333333;
  }
  pre code {
    background: none;
    padding: 0;
    color: inherit;
    font-size: inherit;
  }

  /* 分隔线 */
  hr {
    border: none;
    border-top: 1px solid #cccccc;
    margin: 24px 0;
  }

  /* 等号分隔线 */
  .section-divider {
    text-align: center;
    color: #999999;
    font-size: 11pt;
    letter-spacing: 2px;
    margin: 28px 0;
    user-select: none;
    overflow: hidden;
  }

  /* 加粗指令词 */
  .cmd {
    font-weight: bold;
    background-color: #F2F2F2;
    padding: 1px 4px;
    border-radius: 2px;
    font-size: 10.5pt;
  }

  /* 变量占位符 */
  .variable {
    color: #0E52D4;
    font-weight: 600;
  }

  /* Or 选项 */
  .or-option {
    font-weight: bold;
    background-color: #F2F2F2;
    padding: 1px 4px;
    border-radius: 2px;
  }

  /* 引用块 */
  blockquote {
    border-left: 3px solid #ddd;
    padding: 8px 16px;
    margin: 12px 0;
    color: #666;
    background-color: #f9f9f9;
    border-radius: 0 4px 4px 0;
    font-size: 11pt;
    line-height: 1.6;
  }
</style>
</head>
<body>

<div id="sidebar">
  <h1>支援未来</h1>
  <details>
    <summary>准入端</summary>
    <details>
      <summary>准入端 · 准入</summary>
      <a class="level4" href="#准入端准入邮件审批">准入端 · 准入 · 邮件审批</a>
      <a class="level4" href="#准入端准入客户档案表">准入端 · 准入 · 客户档案表</a>
      <a class="level4" href="#准入端准入业务供应商及客户准入申请流程">准入端 · 准入 · 业务供应商及客户准入申请流程</a>
    </details>
    <details>
      <summary>准入端 · MDG</summary>
      <a class="level4" href="#准入端MDG查重">准入端 · MDG · 查重</a>
      <a class="level4" href="#准入端MDG组织架构">准入端 · MDG · 组织架构</a>
      <a class="level4" href="#准入端MDG添加抬头">准入端 · MDG · 添加抬头</a>
      <details class="faq-details">
        <summary class="faq-level4">准入端 · MDG · FAQ</summary>
        <a class="level5" href="#faq1">如何“跟踪MDG流程”？</a>
        <a class="level5" href="#faq2">出现“你的连接不是专用连接”时，该怎么办？</a>
        <a class="level5" href="#faq3">出现“营业执照无法上传”时，该怎么办？</a>
        <a class="level5" href="#faq4">出现“当前用户无权限，请联系管理员！”时，该怎么办？</a>
      </details>
    </details>
  </details>
</div>

<div id="content"></div>

<script>
  async function loadContent(file) {
    const res = await fetch(file);
    const text = await res.text();
    document.getElementById('content').insertAdjacentHTML('beforeend', text);
  }

  async function init() {
    await loadContent('zhunru.html');
    // 后续添加其他端文件后在这里加载
  }

  window.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
