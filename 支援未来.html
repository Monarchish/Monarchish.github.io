<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>支援未来</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  :root {
    --primary: #0066CC;           /* 主题蓝色 */
    --sidebar-bg: #f7f9fc;        /* 左侧目录浅灰背景 */
    --content-bg: #ffffff;
    --border: #e0e5ee;
    --text: #1a1a1a;
    --text-secondary: #555;
    --code-bg: #F2F2F2;           /* 代码背景色 */
    --keyword-bg: #F2F2F2;        /* 关键字底纹 */
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "PingFang SC", "Hiragino Sans GB",
                 "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.75;
    color: var(--text);
    background: var(--content-bg);
    display: flex;
    align-items: flex-start;
  }

  /* 左侧固定目录 */
  #sidebar {
    position: sticky;
    top: 0;
    flex-shrink: 0;
    width: 380px;                 /* 固定宽度，保持完整显示 */
    height: 100vh;
    overflow-y: auto;
    overflow-x: auto;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    padding: 24px 16px;
    z-index: 100;
    font-family: inherit;
    font-size: 14px;
    line-height: 1.7;
  }
  #sidebar h1 {
    font-size: 1.2rem;
    margin-bottom: 12px;
    white-space: nowrap;
    font-weight: 600;
    color: var(--text);
  }
  details { margin-bottom: 2px; }
  summary {
    cursor: pointer;
    list-style: none;
    font-weight: 600;
    color: var(--text-secondary);
    padding: 4px 0;
    font-size: 14px;
    white-space: nowrap;
    transition: color 0.2s;
  }
  summary:hover { color: var(--primary); }
  details[open] > summary { color: var(--primary); }
  details details { margin-left: 14px; }

  .level4 {
    display: block;
    margin-left: 24px;
    padding: 4px 0;
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 14px;
    white-space: nowrap;
    transition: color 0.2s;
  }
  .level4:hover { color: var(--primary); }

  .faq-details { margin-left: 0; }
  .faq-level4 {
    font-weight: 600;
    font-size: 14px;
    color: var(--text-secondary);
    padding: 4px 0;
    margin-left: 18px;
    white-space: nowrap;
    cursor: pointer;
    list-style: none;
  }
  .faq-level4:hover { color: var(--primary); }

  .level5 {
    display: block;
    margin-left: 38px;
    padding: 4px 0;
    color: #777;
    text-decoration: none;
    font-size: 14px;
    white-space: nowrap;
  }
  .level5:hover { color: var(--primary); }

  /* 右侧正文区 */
  #content {
    flex: 1;
    padding: 32px 40px;
    max-width: 900px;
    min-width: 0;
  }

  h2.end {
    font-size: 1.7rem;
    margin: 24px 0 16px;
    border-bottom: 2px solid var(--border);
    padding-bottom: 8px;
    font-weight: 600;
    color: var(--text);
  }

  h3.module {
    font-size: 1.3rem;
    margin: 20px 0 10px;
    color: var(--text);
    font-weight: 600;
  }

  h4.operation {
    font-size: 1.1rem;
    margin: 16px 0 8px;
    color: var(--text-secondary);
    font-weight: 600;
  }

  pre {
    background: var(--code-bg);   /* 代码背景 #F2F2F2 */
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin: 12px 0;
    overflow-x: auto;
    white-space: pre-wrap;
    word-wrap: break-word;
    font-family: "SF Mono", "Consolas", "Liberation Mono", Menlo, Courier, monospace;
    font-size: 14px;
    line-height: 1.75;
  }

  code {
    font-family: "SF Mono", "Consolas", "Liberation Mono", Menlo, Courier, monospace;
    font-size: 14px;
  }

  /* 关键词灰色底纹 */
  .kw {
    background: var(--keyword-bg);
    padding: 1px 4px;
    border-radius: 4px;
    font-weight: 700;
    color: var(--text);
  }
</style>
</head>
<body>

<div id="sidebar">
  <h1>支援未来</h1>
  <details>
    <summary>准入端</summary>
    <details>
      <summary>准入端 · 准入</summary>
      <a class="level4" href="#准入端准入邮件审批">准入端 · 准入 · 邮件审批</a>
      <a class="level4" href="#准入端准入客户档案表">准入端 · 准入 · 客户档案表</a>
      <a class="level4" href="#准入端准入业务供应商及客户准入申请流程">准入端 · 准入 · 业务供应商及客户准入申请流程</a>
    </details>
    <details>
      <summary>准入端 · MDG</summary>
      <a class="level4" href="#准入端MDG查重">准入端 · MDG · 查重</a>
      <a class="level4" href="#准入端MDG组织架构">准入端 · MDG · 组织架构</a>
      <a class="level4" href="#准入端MDG添加抬头">准入端 · MDG · 添加抬头</a>
      <details class="faq-details">
        <summary class="faq-level4">准入端 · MDG · FAQ</summary>
        <a class="level5" href="#faq1">如何“跟踪MDG流程”？</a>
        <a class="level5" href="#faq2">出现“你的连接不是专用连接”时，该怎么办？</a>
        <a class="level5" href="#faq3">出现“营业执照无法上传”时，该怎么办？</a>
        <a class="level5" href="#faq4">出现“当前用户无权限，请联系管理员！”时，该怎么办？</a>
      </details>
    </details>
  </details>
</div>

<div id="content"></div>

<script>
  const keywords = ['Open','Write','Left Click','Right Click','Double Click','Ctrl \\+ C','Ctrl \\+ V','Ctrl \\+ D','Ctrl \\+ F','Ctrl \\+ S','Ctrl \\+ Alt \\+ A','Filter','Enter','Esc','And','Or'];

  function highlightKeywords() {
    document.querySelectorAll('pre').forEach(pre => {
      let html = pre.innerHTML;
      keywords.forEach(kw => {
        const re = new RegExp('\\b(' + kw + ')\\b', 'gi');
        html = html.replace(re, '<span class="kw">$1</span>');
      });
      pre.innerHTML = html;
    });
  }

  async function loadContent(file) {
    const res = await fetch(file);
    const text = await res.text();
    document.getElementById('content').insertAdjacentHTML('beforeend', text);
  }

  async function init() {
    await loadContent('zhunru.html');
    // 后续添加其他端文件后在这里加载
    highlightKeywords();
  }

  window.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
