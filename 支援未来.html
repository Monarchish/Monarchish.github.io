<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>支援未来</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: "宋体", SimSun, serif;
    background:#ffffff;
    color:#1a1a1a;
    display:flex;
    align-items:flex-start;
  }

  /* 左侧固定目录 */
  #sidebar {
    position: sticky;
    top: 0;
    flex-shrink: 0;
    width: 380px;                 /* 固定宽度，不随展开关闭变化 */
    height: 100vh;
    overflow-y: auto;
    overflow-x: auto;
    background: #f8f9fa;
    border-right: 1px solid #e0e0e0;
    padding: 20px 16px;
    z-index: 100;
  }
  #sidebar h1 {
    font-size: 1.3rem;
    margin-bottom: 12px;
    white-space: nowrap;
  }
  details { margin-bottom: 2px; }
  summary {
    cursor: pointer;
    list-style: none;
    font-weight: 600;
    color: #333;
    padding: 4px 0;
    font-size: 0.95rem;
    white-space: nowrap;
  }
  summary:hover { color: #6c63ff; }
  details[open] > summary { color: #6c63ff; }
  details details { margin-left: 14px; }

  .level4 {
    display: block;
    margin-left: 24px;
    padding: 4px 0;
    color: #555;
    text-decoration: none;
    font-size: 0.85rem;
    white-space: nowrap;
  }
  .level4:hover { color: #6c63ff; }

  .faq-details {
    margin-left: 0;
  }
  .faq-level4 {
    font-weight: 600;
    font-size: 0.85rem;
    color: #555;
    padding: 4px 0;
    margin-left: 18px;             /* FAQ 标题稍微靠左 */
    white-space: nowrap;
    cursor: pointer;
    list-style: none;
  }
  .faq-level4:hover { color: #6c63ff; }
  .level5 {
    display: block;
    margin-left: 38px;
    padding: 4px 0;
    color: #777;
    text-decoration: none;
    font-size: 0.82rem;
    white-space: nowrap;
  }
  .level5:hover { color: #6c63ff; }

  /* 右侧正文区 */
  #content {
    flex: 1;
    padding: 32px 40px;
    max-width: 1000px;
    min-width: 0;
  }
  h2.end {
    font-size: 1.8rem;
    margin: 24px 0 16px;
    border-bottom: 2px solid #e0e0e0;
    padding-bottom: 8px;
  }
  h3.module {
    font-size: 1.3rem;
    margin: 20px 0 10px;
    color: #333;
  }
  h4.operation {
    font-size: 1.1rem;
    margin: 16px 0 8px;
    color: #555;
  }

  pre {
    background: #ffffff;
    border: 1px solid #e0e0e0;
    border-radius: 6px;
    padding: 16px;
    overflow-x: auto;
    white-space: pre-wrap;
    word-wrap: break-word;
    font-family: "宋体", SimSun, serif;
    font-size: 11px;                 /* 按你的要求改为宋体11号 */
    line-height: 1.85;
  }
  code {
    font-family: "宋体", SimSun, serif;
    font-size: 11px;
  }

  /* 关键词灰色淡底色，加粗 */
  .kw {
    background: #f5f5f5;
    padding: 1px 4px;
    border-radius: 4px;
    font-weight: 700;
    color: #1a1a1a;
  }
</style>
</head>
<body>

<div id="sidebar">
  <h1>支援未来</h1>
  <details>
    <summary>准入端</summary>
    <details>
      <summary>准入端 · 准入</summary>
      <a class="level4" href="#准入端准入邮件审批">准入端 · 准入 · 邮件审批</a>
      <a class="level4" href="#准入端准入客户档案表">准入端 · 准入 · 客户档案表</a>
      <a class="level4" href="#准入端准入业务供应商及客户准入申请流程">准入端 · 准入 · 业务供应商及客户准入申请流程</a>
    </details>
    <details>
      <summary>准入端 · MDG</summary>
      <a class="level4" href="#准入端MDG查重">准入端 · MDG · 查重</a>
      <a class="level4" href="#准入端MDG组织架构">准入端 · MDG · 组织架构</a>
      <a class="level4" href="#准入端MDG添加抬头">准入端 · MDG · 添加抬头</a>
      <details class="faq-details">
        <summary class="faq-level4">准入端 · MDG · FAQ</summary>
        <a class="level5" href="#faq1">如何“跟踪MDG流程”？</a>
        <a class="level5" href="#faq2">出现“你的连接不是专用连接”时，该怎么办？</a>
        <a class="level5" href="#faq3">出现“营业执照无法上传”时，该怎么办？</a>
        <a class="level5" href="#faq4">出现“当前用户无权限，请联系管理员！”时，该怎么办？</a>
      </details>
    </details>
  </details>
</div>

<div id="content"></div>

<script>
  // 关键词列表
  const keywords = ['Open','Write','Left Click','Right Click','Double Click','Ctrl \\+ C','Ctrl \\+ V','Ctrl \\+ D','Ctrl \\+ F','Ctrl \\+ S','Ctrl \\+ Alt \\+ A','Filter','Enter','Esc','And','Or'];

  // 给关键词加高亮
  function highlightKeywords() {
    document.querySelectorAll('pre').forEach(pre => {
      let html = pre.innerHTML;
      keywords.forEach(kw => {
        const re = new RegExp('\\b(' + kw + ')\\b', 'gi');
        html = html.replace(re, '<span class="kw">$1</span>');
      });
      pre.innerHTML = html;
    });
  }

  // 动态加载内容文件
  async function loadContent(file) {
    const res = await fetch(file);
    const text = await res.text();
    document.getElementById('content').insertAdjacentHTML('beforeend', text);
  }

  async function init() {
    await loadContent('zhunru.html');
    // 后续添加其他端：
    // await loadContent('caigou.html');
    // await loadContent('xiaoshou.html');
    // await loadContent('shanghou.html');
    // await loadContent('qinzha.html');
    highlightKeywords();
  }

  window.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
