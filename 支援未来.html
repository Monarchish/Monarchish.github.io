// ============================================================
// 2. 渲染目录
// ============================================================
function renderSidebar() {
  const menu = document.getElementById('sidebarMenu');
  menu.innerHTML = '';
  
  function addItem(section, depth) {
    const a = document.createElement('a');
    a.className = `sidebar-item level-${depth}`;
    a.href = `#${section.id}`;
    a.textContent = section.text;
    a.dataset.id = section.id;
    
    if (section.children && section.children.length > 0) {
      a.classList.add('has-children');
    }
    
    a.addEventListener('click', function(e) {
      // 高亮当前项
      document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
      this.classList.add('active');
      
      // 如果是可折叠项，点击箭头区域切换折叠
      // 但由于我们使用锚点跳转，点击会跳转，这里不做折叠切换
    });
    
    menu.appendChild(a);
    
    if (section.children && section.children.length > 0) {
      section.children.forEach(child => addItem(child, depth + 1));
    }
  }
  
  docData.sections.forEach(section => addItem(section, 0));
}

// ============================================================
// 3. 渲染内容
// ============================================================
function renderContent() {
  const container = document.getElementById('mainContent');
  let html = '';
  
  // 文档标题
  html += `<div class="doc-title">${docData.title}</div>`;
  
  // 递归渲染章节
  function renderSection(section, depth) {
    const tag = ['h1', 'h2', 'h3', 'h4'][Math.min(depth, 3)];
    html += `<${tag} id="${section.id}">${section.text}</${tag}>`;
    
    if (section.children && section.children.length > 0) {
      section.children.forEach(child => renderSection(child, depth + 1));
    }
  }
  
  docData.sections.forEach(section => renderSection(section, 0));
  
  container.innerHTML = html;
}

// ============================================================
// 4. 初始化
// ============================================================
renderSidebar();
renderContent();

// 滚动监听高亮当前目录项
document.addEventListener('scroll', function() {
  const sections = document.querySelectorAll('h1, h2, h3, h4');
  let currentId = '';
  
  sections.forEach(section => {
    const rect = section.getBoundingClientRect();
    if (rect.top <= 100) {
      currentId = section.id;
    }
  });
  
  if (currentId) {
    document.querySelectorAll('.sidebar-item').forEach(el => {
      el.classList.remove('active');
      if (el.dataset.id === currentId) {
        el.classList.add('active');
      }
    });
  }
});
