<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>支援未来 · Operational Cosmos Decoded</title>
<!-- marked.js 用于将 Markdown 渲染为 HTML -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
/* ========== 全局重置 ========== */
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
    font-family: -apple-system, "微软雅黑", "PingFang SC", "Helvetica Neue", sans-serif;
    font-size: 11pt;
    line-height: 1.6;
    color: #1a1a1a;
    background: #ffffff;
    display: flex;
    min-height: 100vh;
}

/* ========== 左侧目录栏 ========== */
#sidebar {
    position: fixed;
    top: 0;
    left: 0;
    width: 280px;
    height: 100vh;
    background: #f8f9fa;
    border-right: 1px solid #e0e0e0;
    overflow-y: auto;
    z-index: 1000;
    padding: 20px 0;
    transition: transform 0.3s ease;
}

#sidebar.collapsed {
    transform: translateX(-280px);
}

#sidebar-header {
    padding: 0 16px 16px;
    border-bottom: 1px solid #e0e0e0;
    margin-bottom: 8px;
}

#sidebar-header h2 {
    font-size: 14px;
    font-weight: 700;
    color: #1a1a1a;
    letter-spacing: 0.5px;
}

#sidebar-header .subtitle {
    font-size: 11px;
    color: #888;
    margin-top: 4px;
}

/* 目录树 */
.toc-list {
    list-style: none;
    padding: 0;
    margin: 0;
}

.toc-item {
    font-size: 12px;
    line-height: 1.2;
    color: #4A4A4A;
    cursor: pointer;
    transition: background 0.15s;
}

.toc-item:hover {
    background: #e8ecef;
}

.toc-item a {
    text-decoration: none;
    color: inherit;
    display: block;
    padding: 6px 16px;
    border-left: 3px solid transparent;
    transition: all 0.15s;
}

.toc-item a:hover {
    color: #1a73e8;
}

.toc-item a.active {
    color: #1a73e8;
    border-left-color: #1a73e8;
    background: #e8f0fe;
    font-weight: 600;
}

/* 层级缩进 */
.toc-level-1 { padding-left: 0; }
.toc-level-1 > a { font-weight: 700; color: #1a1a1a; font-size: 13px; }
.toc-level-2 { padding-left: 0; }
.toc-level-2 > a { font-weight: 600; padding-left: 16px; }
.toc-level-3 { padding-left: 0; }
.toc-level-3 > a { padding-left: 32px; font-size: 11.5px; }
.toc-level-4 { padding-left: 0; }
.toc-level-4 > a { padding-left: 48px; font-size: 11px; color: #666; }

/* 可折叠 */
.toc-toggle {
    display: inline-block;
    width: 16px;
    text-align: center;
    cursor: pointer;
    user-select: none;
    color: #999;
    font-size: 10px;
    margin-right: 4px;
    transition: transform 0.2s;
}

.toc-toggle.expanded {
    transform: rotate(90deg);
}

.toc-children {
    display: none;
}

.toc-children.expanded {
    display: block;
}

/* 折叠按钮 */
#toggle-btn {
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 1001;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 4px;
    padding: 6px 10px;
    cursor: pointer;
    font-size: 14px;
    color: #555;
    transition: all 0.2s;
}

#toggle-btn:hover {
    background: #f0f0f0;
    border-color: #bbb;
}

/* ========== 主内容区 ========== */
#main-content {
    margin-left: 280px;
    flex: 1;
    padding: 40px 48px 80px;
    max-width: 960px;
    transition: margin-left 0.3s ease;
}

#main-content.expanded {
    margin-left: 0;
}

/* ========== Markdown 渲染样式 ========== */
#content-area h1 {
    font-size: 22pt;
    font-weight: 700;
    color: #1a1a1a;
    margin: 32px 0 16px;
    padding-bottom: 8px;
    border-bottom: 2px solid #e8e8e8;
    line-height: 1.3;
}

#content-area h1:first-child {
    margin-top: 0;
    font-size: 26pt;
    border-bottom: 3px solid #1a73e8;
    padding-bottom: 12px;
}

#content-area h2 {
    font-size: 16pt;
    font-weight: 700;
    color: #1a1a1a;
    margin: 28px 0 12px;
    padding-bottom: 6px;
    border-bottom: 1px solid #e8e8e8;
    line-height: 1.4;
}

#content-area h3 {
    font-size: 13pt;
    font-weight: 600;
    color: #2c2c2c;
    margin: 24px 0 10px;
    line-height: 1.5;
}

#content-area h4 {
    font-size: 11.5pt;
    font-weight: 600;
    color: #333;
    margin: 20px 0 8px;
    line-height: 1.5;
}

#content-area p {
    margin: 8px 0;
    line-height: 1.6;
}

#content-area strong {
    font-weight: 700;
    color: #1a1a1a;
}

/* 高亮块（对应智能文档的蓝色底色块） */
#content-area blockquote {
    background: #E6EEFA;
    border-left: 4px solid #98C1FF;
    margin: 12px 0;
    padding: 12px 16px;
    border-radius: 4px;
    line-height: 1.6;
}

#content-area blockquote p {
    margin: 4px 0;
}

/* 警告块（⚠️） */
#content-area .warning-block {
    background: #FFF3E0;
    border-left: 4px solid #FFB74D;
    margin: 12px 0;
    padding: 10px 16px;
    border-radius: 4px;
    line-height: 1.6;
}

/* 行内代码 */
#content-area code {
    font-family: "SF Mono", "Fira Code", "Consolas", monospace;
    font-size: 0.9em;
    background: #F2F2F2;
    color: #d63384;
    padding: 2px 6px;
    border-radius: 3px;
}

/* 代码块 */
#content-area pre {
    background: #f5f5f5;
    border: 1px solid #e0e0e0;
    border-radius: 4px;
    padding: 12px 16px;
    overflow-x: auto;
    margin: 12px 0;
    line-height: 1.5;
}

#content-area pre code {
    background: none;
    color: #333;
    padding: 0;
    font-size: 0.9em;
}

/* 列表 */
#content-area ul, #content-area ol {
    margin: 8px 0;
    padding-left: 24px;
    line-height: 1.6;
}

#content-area li {
    margin: 4px 0;
}

/* 表格 */
#content-area table {
    width: 100%;
    border-collapse: collapse;
    margin: 12px 0;
    font-size: 10.5pt;
}

#content-area th, #content-area td {
    border: 1px solid #ddd;
    padding: 8px 12px;
    text-align: left;
}

#content-area th {
    background: #f5f7fa;
    font-weight: 600;
}

#content-area tr:nth-child(even) {
    background: #fafafa;
}

/* 水平分割线 */
#content-area hr {
    border: none;
    border-top: 2px solid #e8e8e8;
    margin: 24px 0;
}

/* 模块分隔线（智能文档的 ===== 样式） */
#content-area .module-divider {
    border: none;
    border-top: 1px solid #ccc;
    margin: 20px 0;
}

/* 🔔 和 ⚠ 符号 */
#content-area .icon-bell {
    color: #1a73e8;
}

#content-area .icon-warning {
    color: #E65100;
}

/* ========== 加载状态 ========== */
#loading {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 200px;
    color: #999;
    font-size: 14px;
}

.spinner {
    width: 24px;
    height: 24px;
    border: 3px solid #e0e0e0;
    border-top-color: #1a73e8;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 12px;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

/* ========== 响应式 ========== */
@media (max-width: 768px) {
    #sidebar {
        width: 240px;
        transform: translateX(-240px);
    }
    #sidebar.mobile-visible {
        transform: translateX(0);
    }
    #main-content {
        margin-left: 0;
        padding: 24px 20px 60px;
    }
    #toggle-btn {
        display: block;
    }
}
</style>
</head>
<body>

<!-- 侧栏折叠按钮 -->
<button id="toggle-btn" onclick="toggleSidebar()" title="切换目录">☰</button>

<!-- 左侧目录栏 -->
<nav id="sidebar">
    <div id="sidebar-header">
        <h2>📋 支援未来</h2>
        <div class="subtitle">Operational Cosmos Decoded</div>
    </div>
    <ul id="toc" class="toc-list">
        <!-- 由 JavaScript 动态生成 -->
    </ul>
</nav>

<!-- 主内容区 -->
<main id="main-content">
    <div id="content-area">
        <div id="loading">
            <div class="spinner"></div>
            <span>正在加载内容...</span>
        </div>
    </div>
</main>

<script>
// ========== Markdown 文件列表 ==========
const MARKDOWN_FILES = [
    { id: 'zhunru',   title: '准入端',   file: '准入端.md' },
    { id: 'caigou',   title: '采购端',   file: '采购端.md' },
    { id: 'xiaoshou', title: '销售端',   file: '销售端.md' },
    { id: 'shanshou', title: '善后端',   file: '善后端.md' },
    { id: 'qinza',    title: '勤杂组',   file: '勤杂组.md' }
];

// ========== 全局状态 ==========
let allContent = '';        // 所有 Markdown 拼接
let tocData = [];           // 目录数据
let currentSection = null;  // 当前可见的 section

// ========== 加载所有 Markdown 文件 ==========
async function loadAllMarkdown() {
    const contentArea = document.getElementById('content-area');
    
    try {
        let combined = '';
        for (const md of MARKDOWN_FILES) {
            const response = await fetch(md.file);
            if (!response.ok) {
                console.warn(`加载 ${md.file} 失败: ${response.status}`);
                combined += `\n\n## ${md.title}\n\n> ⚠️ 文件 ${md.file} 加载失败，请确认文件已上传。\n\n`;
                continue;
            }
            const text = await response.text();
            combined += '\n\n' + text;
        }
        
        allContent = combined;
        
        // 生成目录
        generateToc(combined);
        
        // 渲染内容
        renderContent(combined);
        
    } catch (err) {
        contentArea.innerHTML = `<div style="padding:40px;color:#c00;">
            <h2>加载失败</h2>
            <p>${err.message}</p>
            <p>请确保：</p>
            <ul>
                <li>五个 .md 文件已上传到同一目录</li>
                <li>文件名为：准入端.md、采购端.md、销售端.md、善后端.md、勤杂组.md</li>
                <li>通过 HTTP 服务器访问（而非直接打开本地文件）</li>
            </ul>
        </div>`;
    }
}

// ========== 生成目录树 ==========
function generateToc(markdown) {
    // 用 marked.lexer 解析 Markdown 结构
    const tokens = marked.lexer(markdown);
    const toc = [];
    let currentH1 = null, currentH2 = null, currentH3 = null;
    
    for (const token of tokens) {
        if (token.type === 'heading' && token.depth >= 1 && token.depth <= 4) {
            const id = token.text.replace(/\s+/g, '-').replace(/[·•]/g, '').replace(/[^\w\u4e00-\u9fff-]/g, '').toLowerCase();
            const item = { 
                text: token.text, 
                id: id, 
                depth: token.depth,
                children: []
            };
            
            if (token.depth === 1) {
                toc.push(item);
                currentH1 = item;
                currentH2 = null;
                currentH3 = null;
            } else if (token.depth === 2) {
                if (currentH1) {
                    currentH1.children.push(item);
                } else {
                    toc.push(item);
                }
                currentH2 = item;
                currentH3 = null;
            } else if (token.depth === 3) {
                if (currentH2) {
                    currentH2.children.push(item);
                } else if (currentH1) {
                    currentH1.children.push(item);
                } else {
                    toc.push(item);
                }
                currentH3 = item;
            } else if (token.depth === 4) {
                if (currentH3) {
                    currentH3.children.push(item);
                } else if (currentH2) {
                    currentH2.children.push(item);
                } else if (currentH1) {
                    currentH1.children.push(item);
                } else {
                    toc.push(item);
                }
            }
        }
    }
    
    tocData = toc;
    renderToc(toc);
}

// ========== 渲染目录树 ==========
function renderToc(toc) {
    const container = document.getElementById('toc');
    container.innerHTML = '';
    
    for (const item of toc) {
        const li = createTocItem(item, 0);
        container.appendChild(li);
    }
}

function createTocItem(item, level) {
    const li = document.createElement('li');
    li.className = `toc-item toc-level-${Math.min(level + 1, 4)}`;
    
    const hasChildren = item.children && item.children.length > 0;
    
    // 链接
    const a = document.createElement('a');
    a.href = `#${item.id}`;
    a.textContent = item.text;
    a.addEventListener('click', function(e) {
        e.preventDefault();
        const target = document.getElementById(item.id);
        if (target) {
            target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        // 高亮当前
        document.querySelectorAll('.toc-item a').forEach(el => el.classList.remove('active'));
        this.classList.add('active');
    });
    
    if (hasChildren) {
        // 可折叠
        const toggle = document.createElement('span');
        toggle.className = 'toc-toggle expanded';
        toggle.textContent = '▶';
        toggle.addEventListener('click', function(e) {
            e.stopPropagation();
            this.classList.toggle('expanded');
            const children = this.parentElement.querySelector('.toc-children');
            if (children) {
                children.classList.toggle('expanded');
            }
        });
        li.appendChild(toggle);
        li.appendChild(a);
        
        const childrenUl = document.createElement('ul');
        childrenUl.className = 'toc-children expanded';
        for (const child of item.children) {
            const childLi = createTocItem(child, level + 1);
            childrenUl.appendChild(childLi);
        }
        li.appendChild(childrenUl);
    } else {
        li.appendChild(a);
    }
    
    return li;
}

// ========== 渲染 Markdown 内容 ==========
function renderContent(markdown) {
    // 使用 marked 渲染
    const renderer = new marked.Renderer();
    
    // 自定义标题渲染（添加锚点 id）
    renderer.heading = function(text, level) {
        const id = text.replace(/\s+/g, '-').replace(/[·•]/g, '').replace(/[^\w\u4e00-\u9fff-]/g, '').toLowerCase();
        return `<h${level} id="${id}">${text}</h${level}>`;
    };
    
    // 自定义 blockquote 渲染（高亮块）
    renderer.blockquote = function(quote) {
        return `<blockquote>${quote}</blockquote>`;
    };
    
    // 自定义代码渲染
    renderer.codespan = function(code) {
        return `<code>${code}</code>`;
    };
    
    // 自定义段落渲染（处理 ⚠ 警告行）
    renderer.paragraph = function(text) {
        if (text.startsWith('⚠')) {
            return `<div class="warning-block">${text}</div>`;
        }
        return `<p>${text}</p>`;
    };
    
    marked.setOptions({
        renderer: renderer,
        breaks: true,
        gfm: true
    });
    
    const html = marked.parse(markdown);
    document.getElementById('content-area').innerHTML = html;
    
    // 移除加载状态
    document.getElementById('loading')?.remove();
}

// ========== 侧栏折叠 ==========
function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const main = document.getElementById('main-content');
    sidebar.classList.toggle('collapsed');
    main.classList.toggle('expanded');
}

// ========== 页面滚动高亮当前目录项 ==========
function updateActiveTocItem() {
    const headings = document.querySelectorAll('h1[id], h2[id], h3[id], h4[id]');
    let currentId = null;
    
    for (const heading of headings) {
        const rect = heading.getBoundingClientRect();
        if (rect.top <= 100) {
            currentId = heading.id;
        }
    }
    
    if (currentId) {
        document.querySelectorAll('.toc-item a').forEach(el => {
            el.classList.remove('active');
            if (el.getAttribute('href') === `#${currentId}`) {
                el.classList.add('active');
            }
        });
    }
}

window.addEventListener('scroll', updateActiveTocItem);

// ========== 启动 ==========
document.addEventListener('DOMContentLoaded', loadAllMarkdown);
</script>

</body>
</html>
